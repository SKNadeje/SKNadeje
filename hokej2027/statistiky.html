html[data-theme="cesko"] {

html[data-theme="svedsko"] body { background: var(--bg-svedsko); background-attachment: fixed; }
html[data-theme="finsko"] {
    --neon:#8ad3ff; --neon-rgb:138,211,255; --gold:#eaf6ff; --gold-rgb:234,246,255;

html[data-theme="kanada"] {

* { box-sizing:border-box; }
body {

h1 { text-align:center; font-size:1.15em; letter-spacing:3px; color:var(--neon); text-transform:uppercase; margin:6px 0 20px; }

.blok {

}
.blok h2 {
    text-align:center; font-size:.95em; letter-spacing:3px; text-transform:uppercase;

.blok.fond { border-color:rgba(var(--gold-rgb),.5); }
.blok.fond h2 { color:var(--gold); text-shadow:0 0 14px rgba(var(--gold-rgb),.4); }
.blok.index { border-color:var(--pink); box-shadow:0 0 18px rgba(255,0,234,.12); }

.fond-castka { text-align:center; font-size:2.4em; font-weight:900; margin:4px 0 2px; }
.fond-pozn { text-align:center; font-size:.7em; opacity:.5; margin-bottom:12px; }
.fond-medaile { display:flex; justify-content:center; gap:22px; font-size:.85em; font-weight:800; flex-wrap:wrap; }

.radek {
    display:flex; align-items:center; gap:12px;
    padding:12px 14px; border-radius:16px; margin-bottom:6px;

.radek .poradi { min-width:52px; font-weight:900; font-size:1.05em; }
.radek .telo { flex:1; min-width:0; }

.radek .sub { font-size:.68em; color:#57c9d5; margin-top:4px; letter-spacing:.5px; font-family:monospace; }
.radek .hodnota { font-weight:900; font-size:1.15em; white-space:nowrap; }
.radek .hodnota small { font-size:.55em; opacity:.5; font-weight:700; margin-left:2px; }
.radek.r1 { background:linear-gradient(90deg, rgba(var(--gold-rgb),.22), rgba(var(--gold-rgb),.05)); box-shadow:0 0 14px rgba(var(--gold-rgb),.12); }
.radek.r1 .poradi { color:#ffd75e; }
.radek.r2 { background:linear-gradient(90deg, rgba(148,163,184,.2), rgba(148,163,184,.04)); }
.radek.r3 { background:linear-gradient(90deg, rgba(180,100,40,.2), rgba(180,100,40,.04)); }
.radek.r3 .poradi { color:#e8965a; }
.mini { display:inline-flex; align-items:center; gap:3px; background:rgba(255,255,255,.08); border-radius:6px; padding:1px 7px; margin-right:6px; font-family:'Segoe UI',sans-serif; }
.prazdno { text-align:center; opacity:.45; padding:18px 0; font-size:.85em; }

<div id="themeSwitch" style="position:fixed; top:12px; right:12px; z-index:10000;">
    <button onclick="prepniThemePanel()" style="background:var(--card-bg); border:1px solid var(--card-border); color:var(--text); width:42px; height:42px; border-radius:50%; cursor:pointer; font-size:1.2em; backdrop-filter:blur(6px);" title="Změnit vzhled">🎨</button>
    <div id="themePanel" style="display:none; position:absolute; top:50px; right:0; background:var(--dark); border:1px solid var(--card-border); border-radius:14px; padding:8px; min-width:170px; box-shadow:0 12px 40px rgba(0,0,0,.5);">
        <button class="theme-opt" onclick="nastavTheme('tmavy')">🌙 Tmavý</button>
        <button class="theme-opt" onclick="nastavTheme('svetly')">☀️ Světlý</button>
        <button class="theme-opt" onclick="nastavTheme('cesko')">🇨🇿 Česko</button>
        <button class="theme-opt" onclick="nastavTheme('nemecko')">🇩🇪 Německo</button>
        <button class="theme-opt" onclick="nastavTheme('svedsko')">🇸🇪 Švédsko</button>
        <button class="theme-opt" onclick="nastavTheme('finsko')">🇫🇮 Finsko</button>
        <button class="theme-opt" onclick="nastavTheme('kanada')">🇨🇦 Kanada</button>
    </div>
</div>
<style>
    .theme-opt { display:block; width:100%; text-align:left; background:none; border:none; color:var(--text); padding:10px 12px; border-radius:8px; cursor:pointer; font-size:.9em; font-family:inherit; }
    .theme-opt:hover { background:var(--card-bg); }
    .theme-opt.on { background:rgba(var(--neon-rgb),.15); color:var(--neon); font-weight:800; }
</style>
<script>
function nastavTheme(t){ try{ localStorage.setItem('hokej_theme',t); }catch(e){}
    if(t==='tmavy') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t);
    document.querySelectorAll('.theme-opt').forEach(b=>b.classList.remove('on'));
    var m={tmavy:0,svetly:1,cesko:2,nemecko:3,svedsko:4,finsko:5,kanada:6}, btns=document.querySelectorAll('.theme-opt'); if(btns[m[t]]) btns[m[t]].classList.add('on');
    document.getElementById('themePanel').style.display='none';
}
function prepniThemePanel(){ var p=document.getElementById('themePanel'); p.style.display=p.style.display==='none'?'block':'none';
    var t=(function(){try{return localStorage.getItem('hokej_theme')||'tmavy';}catch(e){return 'tmavy';}})();
    document.querySelectorAll('.theme-opt').forEach(b=>b.classList.remove('on'));
    var m={tmavy:0,svetly:1,cesko:2,nemecko:3,svedsko:4,finsko:5,kanada:6}, btns=document.querySelectorAll('.theme-opt'); if(btns[m[t]]) btns[m[t]].classList.add('on');
}
document.addEventListener('click',function(e){ var sw=document.getElementById('themeSwitch'); if(sw&&!sw.contains(e.target)){ var p=document.getElementById('themePanel'); if(p) p.style.display='none'; } });
</script>

<script>
const SB_URL = "https://vlabocwezmpwnxrwxihs.supabase.co";
const SB_KEY = "sb_publishable_H9egZ3Rrq5LYi02NxpvjCQ_xDXOQP4X";
const sb = supabase.createClient(SB_URL, SB_KEY);

function radek(h, hodnotaHtml, subHtml, korunka) {
    const cls = h._rankNum === 1 ? 'r1' : h._rankNum === 2 ? 'r2' : h._rankNum === 3 ? 'r3' : '';
    return `<div class="radek ${cls}">
        <span class="poradi">${h._rank}</span>
        <div class="telo">
            <span class="jmeno" onclick="location.href='profil.html?id=${h.user_id}'">${(window._avatary && window._avatary[h.user_id]) ? window._avatary[h.user_id] + ' ' : ''}${h.jmeno}${korunka && h._rankNum === 1 ? ' 👑' : ''}</span>
            <div class="sub">${subHtml}</div>
        </div>
        <span class="hodnota">${hodnotaHtml}</span>
    </div>`;
}

function vykresli(elId, list, klic, fmt, sub, korunka = true) {
    const el = document.getElementById(elId);
    const serazeni = seradSRankem(list.filter(h => h.tipuVyhodnocenych > 0 || h.tipu > 0), klic);
    el.innerHTML = serazeni.length
        ? serazeni.map(h => radek(h, fmt(h), sub(h), korunka)).join('')
        : '<div class="prazdno">Zatím žádná data.</div>';
}

async function load() {
    const [zR, sR, stR, dlR, avR] = await Promise.all([
        sb.from('hokej27_zapasy').select('*'),
        sb.from('hokej27_sazky').select('*'),
        sb.from('hokej27_stav').select('fond_korekce').eq('id', 1).maybeSingle(),
        sb.from('hokej27_dlouhodobe').select('user_id', { count: 'exact', head: true }).eq('zaplaceno', true),
        sb.from('hraci').select('user_id, avatar')
    ]);
    const fondKorekce = Number(stR?.data?.fond_korekce || 0);
    const zaplaceneDlouhodobky = dlR?.count || 0;
    // mapa user_id -> avatar
    window._avatary = {};
    (avR?.data || []).forEach(h => { if (h.avatar) window._avatary[h.user_id] = h.avatar; });
    const stats = spocitejStatistiky(zR.data || [], sR.data || [], fondKorekce, zaplaceneDlouhodobky);

    // Fond + medaile 50/30/20
    document.getElementById('fondCastka').textContent = stats.fond + ' Kč';
    document.getElementById('fondMedaile').innerHTML =
        `<span>🥇 ${Math.round(stats.fond * 0.5)} Kč</span>
         <span>🥈 ${Math.round(stats.fond * 0.3)} Kč</span>
         <span>🥉 ${Math.round(stats.fond * 0.2)} Kč</span>`;

    vykresli('lbIndex', stats.hraci, 'nb',
        h => `${h.nb} <small>NB</small>`,
        h => `<span class="mini">🥅 ${h.skore}</span><span class="mini">🎯 ${h.strelci}</span> Účast: ${h.ucast}%`);

    vykresli('lbVyhry', stats.hraci, 'vyhry',
        h => `${h.vyhry} <small>Kč</small>`,
        h => `Získáno z ${h.tipuVyhodnocenych} tipů`);

    vykresli('lbSkore', stats.hraci, 'skore',
        h => `${h.skore} <small>x</small>`,
        h => `Úspěšnost: ${h.uspSkore}%  Účast: ${h.ucast}%`);

    vykresli('lbStrelci', stats.hraci, 'strelci',
        h => `${h.strelci} <small>x</small>`,
        h => `Úspěšnost: ${h.uspStrelci}%  Účast: ${h.ucast}%`);

    vykresli('lbTrendy', stats.hraci, 'trendy',
        h => `${h.trendy} <small>pts</small>`,
        h => `Úspěšnost: ${h.uspTrendy}%  Účast: ${h.ucast}%`);

    // ⚔️ Rivalové
    await nactiRivaly(stats.hraci);
}

let _vsichniHraci = [];
async function nactiRivaly(hraci) {
    _vsichniHraci = hraci;
    const box = document.getElementById('rivalObsah');
    const { data: { session } } = await sb.auth.getSession();
    const mojeId = session?.user?.id;

    if (!mojeId) {
        box.innerHTML = '<div class="prazdno">Přihlas se v appce, abys mohl vyzvat rivala.</div>';
        return;
    }
    // já v žebříčku
    const ja = hraci.find(h => h.user_id === mojeId);
    if (!ja) {
        box.innerHTML = '<div class="prazdno">Rivala si vybereš, až podáš první tip. 😉</div>';
        return;
    }
    // můj rival z DB
    const { data: mujZaznam } = await sb.from('hraci').select('rival_id').eq('user_id', mojeId).maybeSingle();
    const rivalId = mujZaznam?.rival_id;
    const rival = rivalId ? hraci.find(h => h.user_id === rivalId) : null;

    if (rival) {
        box.innerHTML = vykresliSouboj(ja, rival);
    } else {
        box.innerHTML = vyberRivalaHTML(ja, hraci);
    }
}

function avatarProUid(uid) {
    return (window._avatary && window._avatary[uid]) ? window._avatary[uid] + ' ' : '';
}

function vykresliSouboj(ja, rival) {
    const radek = (label, maJa, maRival, jednotka = '') => {
        const jaLepsi = maJa > maRival, rivalLepsi = maRival > maJa;
        return `<div style="display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06);">
            <div style="flex:1; text-align:right; font-weight:800; color:${jaLepsi ? 'var(--neon)' : 'var(--text)'};">${maJa}${jednotka}</div>
            <div style="width:88px; text-align:center; font-size:.62em; opacity:.55; text-transform:uppercase; letter-spacing:1px;">${label}</div>
            <div style="flex:1; text-align:left; font-weight:800; color:${rivalLepsi ? '#e74c3c' : 'var(--text)'};">${maRival}${jednotka}</div>
        </div>`;
    };
    // celkové vedení (podle NB)
    const vedu = ja.nb > rival.nb, prohravam = ja.nb < rival.nb;
    const stav = vedu ? '<span style="color:var(--neon);">Vedeš! 🔥</span>'
               : prohravam ? '<span style="color:#e74c3c;">Prohráváš 😤</span>'
               : '<span style="opacity:.7;">Nerozhodně 🤝</span>';
    return `
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
            <div style="flex:1; text-align:right; font-weight:900;">${avatarProUid(ja.user_id)}${ja.jmeno} <span style="font-size:.7em; opacity:.5;">(ty)</span></div>
            <div style="font-size:1.1em;">⚔️</div>
            <div style="flex:1; text-align:left; font-weight:900;">${avatarProUid(rival.user_id)}${rival.jmeno}</div>
        </div>
        <div style="text-align:center; font-size:.85em; margin-bottom:10px;">${stav}</div>
        ${radek('NB body', ja.nb, rival.nb)}
        ${radek('Výhry Kč', ja.vyhry, rival.vyhry)}
        ${radek('Úspěšnost', ja.uspSkore, rival.uspSkore, '%')}
        ${radek('Přesných', ja.skore, rival.skore)}
        <div style="text-align:center; margin-top:12px;">
            <button onclick="zmenRivala()" style="background:none; border:1px solid rgba(255,255,255,.2); color:var(--text); opacity:.7; padding:7px 16px; border-radius:100px; cursor:pointer; font-size:.8em;">Změnit rivala</button>
        </div>`;
}

function vyberRivalaHTML(ja, hraci) {
    const soupeci = hraci.filter(h => h.user_id !== ja.user_id);
    if (!soupeci.length) return '<div class="prazdno">Zatím nemáš koho vyzvat – přidej se víc hráčů.</div>';
    return `
        <div style="text-align:center; font-size:.82em; opacity:.7; margin-bottom:12px;">Vyber si rivala a sleduj, kdo z vás je lepší. Můžeš ho kdykoliv změnit.</div>
        <div style="display:flex; flex-direction:column; gap:6px;">
            ${soupeci.map(h => `
                <button onclick="ulozRivala('${h.user_id}')" style="display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); color:var(--text); padding:11px 14px; border-radius:12px; cursor:pointer; font-size:.9em;">
                    <span style="font-weight:700;">${avatarProUid(h.user_id)}${h.jmeno}</span>
                    <span style="opacity:.6; font-size:.85em;">${h.nb} NB</span>
                </button>`).join('')}
        </div>`;
}

async function ulozRivala(rivalId) {
    const { data: { session } } = await sb.auth.getSession();
    const mojeId = session?.user?.id;
    if (!mojeId) return;
    const { error } = await sb.from('hraci').update({ rival_id: rivalId }).eq('user_id', mojeId);
    if (error) { alert('Nepodařilo se uložit: ' + error.message); return; }
    await nactiRivaly(_vsichniHraci);
}

async function zmenRivala() {
    const { data: { session } } = await sb.auth.getSession();
    const mojeId = session?.user?.id;
    if (!mojeId) return;
    await sb.from('hraci').update({ rival_id: null }).eq('user_id', mojeId);
    await nactiRivaly(_vsichniHraci);
}
