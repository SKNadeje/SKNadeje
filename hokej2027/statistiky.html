<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Žebříčky · MS v hokeji 2027</title>
<link rel="icon" href="logo-hokej2027.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="zebricky.js"></script>
<style>
:root { --neon:#00f2ff; --gold:#d4af37; --dark:#0f172a; --pink:#ff00ea; }
* { box-sizing:border-box; }
body {
    background: radial-gradient(ellipse at top, #142036 0%, var(--dark) 65%);
    color:#fff; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    margin:0; padding:15px; min-height:100vh; -webkit-tap-highlight-color:transparent;
}
.wrap { max-width:600px; margin:0 auto; }
.back { display:inline-block; color:rgba(255,255,255,.45); text-decoration:none; font-size:.75em; margin-bottom:12px; }
h1 { text-align:center; font-size:1.15em; letter-spacing:3px; color:var(--neon); text-transform:uppercase; margin:6px 0 20px; }

.blok {
    background:rgba(255,255,255,.04); border:1px solid rgba(0,242,255,.25);
    border-radius:22px; padding:22px 16px; margin-bottom:22px;
}
.blok h2 {
    text-align:center; font-size:.95em; letter-spacing:3px; text-transform:uppercase;
    color:var(--neon); margin:0 0 18px; text-shadow:0 0 14px rgba(0,242,255,.5);
}
.blok.fond { border-color:rgba(212,175,55,.5); }
.blok.fond h2 { color:var(--gold); text-shadow:0 0 14px rgba(212,175,55,.4); }
.blok.index { border-color:var(--pink); box-shadow:0 0 18px rgba(255,0,234,.12); }
.blok.index h2 { color:var(--pink); text-shadow:0 0 14px rgba(255,0,234,.5); }

.fond-castka { text-align:center; font-size:2.4em; font-weight:900; margin:4px 0 2px; }
.fond-pozn { text-align:center; font-size:.7em; opacity:.5; margin-bottom:12px; }
.fond-medaile { display:flex; justify-content:center; gap:22px; font-size:.85em; font-weight:800; flex-wrap:wrap; }

.radek {
    display:flex; align-items:center; gap:12px;
    padding:12px 14px; border-radius:16px; margin-bottom:6px;
    border-bottom:1px solid rgba(255,255,255,.04);
}
.radek .poradi { min-width:52px; font-weight:900; font-size:1.05em; }
.radek .telo { flex:1; min-width:0; }
.radek .jmeno { font-weight:800; font-size:1em; text-decoration:underline; text-decoration-color:rgba(0,242,255,.35); text-underline-offset:3px; cursor:pointer; }
.radek .jmeno:hover { color:var(--neon); }
.radek .sub { font-size:.68em; color:#57c9d5; margin-top:4px; letter-spacing:.5px; font-family:monospace; }
.radek .hodnota { font-weight:900; font-size:1.15em; white-space:nowrap; }
.radek .hodnota small { font-size:.55em; opacity:.5; font-weight:700; margin-left:2px; }
.radek.r1 { background:linear-gradient(90deg, rgba(212,175,55,.22), rgba(212,175,55,.05)); box-shadow:0 0 14px rgba(212,175,55,.12); }
.radek.r1 .poradi { color:#ffd75e; }
.radek.r2 { background:linear-gradient(90deg, rgba(148,163,184,.2), rgba(148,163,184,.04)); }
.radek.r3 { background:linear-gradient(90deg, rgba(180,100,40,.2), rgba(180,100,40,.04)); }
.radek.r3 .poradi { color:#e8965a; }
.mini { display:inline-flex; align-items:center; gap:3px; background:rgba(255,255,255,.08); border-radius:6px; padding:1px 7px; margin-right:6px; font-family:'Segoe UI',sans-serif; }
.prazdno { text-align:center; opacity:.45; padding:18px 0; font-size:.85em; }
</style>
</head>
<body>
<div class="wrap">
    <a class="back" href="index.html">← Zpět na tiket</a>
    <h1>📊 Žebříčky a statistiky</h1>

    <div class="blok fond">
        <h2>💎 Fond Naděje</h2>
        <div class="fond-castka" id="fondCastka">–</div>
        <div class="fond-pozn">(Kumulováno 5 Kč z každé podané sázky)</div>
        <div class="fond-medaile" id="fondMedaile"></div>
    </div>

    <div class="blok index">
        <h2>⭐ Index Naděje (celkem)</h2>
        <div id="lbIndex"></div>
    </div>

    <div class="blok">
        <h2>💰 Bankovní lupiči</h2>
        <div id="lbVyhry"></div>
    </div>

    <div class="blok">
        <h2>🥅 Mistři výsledků</h2>
        <div id="lbSkore"></div>
    </div>

    <div class="blok">
        <h2>🎯 Králové střelců</h2>
        <div id="lbStrelci"></div>
    </div>

    <div class="blok">
        <h2>🧠 Experti (trendy)</h2>
        <div id="lbTrendy"></div>
    </div>
</div>

<script>
const SB_URL = "https://vlabocwezmpwnxrwxihs.supabase.co";
const SB_KEY = "sb_publishable_H9egZ3Rrq5LYi02NxpvjCQ_xDXOQP4X";
const sb = supabase.createClient(SB_URL, SB_KEY);

function radek(h, hodnotaHtml, subHtml, korunka) {
    const cls = h._rankNum === 1 ? 'r1' : h._rankNum === 2 ? 'r2' : h._rankNum === 3 ? 'r3' : '';
    return `<div class="radek ${cls}">
        <span class="poradi">${h._rank}</span>
        <div class="telo">
            <span class="jmeno" onclick="location.href='profil.html?id=${h.user_id}'">${h.jmeno}${korunka && h._rankNum === 1 ? ' 👑' : ''}</span>
            <div class="sub">${subHtml}</div>
        </div>
        <span class="hodnota">${hodnotaHtml}</span>
    </div>`;
}

function vykresli(elId, list, klic, fmt, sub, korunka = true) {
    const el = document.getElementById(elId);
    const serazeni = seradSRankem(list.filter(h => h.tipuVyhodnocenych > 0 || h.tipu > 0), klic);
    el.innerHTML = serazeni.length
        ? serazeni.map(h => radek(h, fmt(h), sub(h), korunka)).join('')
        : '<div class="prazdno">Zatím žádná data.</div>';
}

async function load() {
    const [zR, sR, stR, dlR] = await Promise.all([
        sb.from('hokej27_zapasy').select('*'),
        sb.from('hokej27_sazky').select('*'),
        sb.from('hokej27_stav').select('fond_korekce').eq('id', 1).maybeSingle(),
        sb.from('hokej27_dlouhodobe').select('user_id', { count: 'exact', head: true }).eq('zaplaceno', true)
    ]);
    const fondKorekce = Number(stR?.data?.fond_korekce || 0);
    const zaplaceneDlouhodobky = dlR?.count || 0;
    const stats = spocitejStatistiky(zR.data || [], sR.data || [], fondKorekce, zaplaceneDlouhodobky);

    // Fond + medaile 50/30/20
    document.getElementById('fondCastka').textContent = stats.fond + ' Kč';
    document.getElementById('fondMedaile').innerHTML =
        `<span>🥇 ${Math.round(stats.fond * 0.5)} Kč</span>
         <span>🥈 ${Math.round(stats.fond * 0.3)} Kč</span>
         <span>🥉 ${Math.round(stats.fond * 0.2)} Kč</span>`;

    vykresli('lbIndex', stats.hraci, 'nb',
        h => `${h.nb} <small>NB</small>`,
        h => `<span class="mini">🥅 ${h.skore}</span><span class="mini">🎯 ${h.strelci}</span> Účast: ${h.ucast}%`);

    vykresli('lbVyhry', stats.hraci, 'vyhry',
        h => `${h.vyhry} <small>Kč</small>`,
        h => `Získáno z ${h.tipuVyhodnocenych} tipů`);

    vykresli('lbSkore', stats.hraci, 'skore',
        h => `${h.skore} <small>x</small>`,
        h => `Úspěšnost: ${h.uspSkore}%  Účast: ${h.ucast}%`);

    vykresli('lbStrelci', stats.hraci, 'strelci',
        h => `${h.strelci} <small>x</small>`,
        h => `Úspěšnost: ${h.uspStrelci}%  Účast: ${h.ucast}%`);

    vykresli('lbTrendy', stats.hraci, 'trendy',
        h => `${h.trendy} <small>pts</small>`,
        h => `Úspěšnost: ${h.uspTrendy}%  Účast: ${h.ucast}%`);
}
load();
</script>
</body>
</html>
