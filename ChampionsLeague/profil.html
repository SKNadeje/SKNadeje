<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil hráče · Champions League</title>
<link rel="icon" href="../logo-nadeje.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root { --fial:#2e6bff; --magenta:#ff2ecc; --gold:#d4af37; --dark:#05081c;  --fial-rgb: 46,107,255; --magenta-rgb: 255,46,204; --gold-rgb: 212,175,55; --text: #eef2ff; --text-rgb: 238,242,255; --bg-top: #0a1240; --card-bg: rgba(46,107,255,.05);}
/* ☀️ SVĚTLÝ */
html[data-theme="svetly"] {
    --fial: #0077b6; --fial-rgb: 0,119,182; --magenta: #c0179c; --magenta-rgb: 192,23,156;
    --gold: #c8901a; --gold-rgb: 200,144,26; --dark: #eef2f7; --bg-top: #ffffff; --text: #12212f; --text-rgb: 18,33,47;
    --card-bg: rgba(0,60,100,.05);
}
/* 🏆 ZLATÝ */
html[data-theme="zlaty"] {
    --fial: #d4af37; --fial-rgb: 212,175,55; --magenta: #b8860b; --magenta-rgb: 184,134,11;
    --gold: #ffd700; --gold-rgb: 255,215,0; --dark: #0a0a0a; --bg-top: #2a2410; --text: #f5ecd0; --text-rgb: 245,236,208;
    --card-bg: rgba(212,175,55,.06);
    --bg-klub: linear-gradient(180deg, #4a3c0a 0%, #2a2410 40%, #12100a 75%, #0a0a0a 100%);
}
/* ⚪ REAL MADRID – bílá/zlatá na tmavé (elegance) */
html[data-theme="real"] {
    --fial: #febe10; --fial-rgb: 254,190,16; --magenta: #ffffff; --magenta-rgb: 255,255,255;
    --gold: #febe10; --gold-rgb: 254,190,16; --dark: #0a1428; --bg-top: #12244a; --text: #ffffff; --text-rgb: 255,255,255;
    --card-bg: rgba(255,255,255,.07);
    --bg-klub: linear-gradient(180deg, #e8ecf5 0%, #b8c4dc 10%, #4a5f8a 26%, #1e2f52 48%, #131f3c 72%, #0a1428 100%);
}
/* 🔵🔴 BARCELONA – blaugrana */
html[data-theme="barca"] {
    --fial: #a50044; --fial-rgb: 165,0,68; --magenta: #004d98; --magenta-rgb: 0,77,152;
    --gold: #edbb00; --gold-rgb: 237,187,0; --dark: #0a1836; --bg-top: #004d98; --text: #ffffff; --text-rgb: 255,255,255;
    --card-bg: rgba(255,255,255,.07);
    --bg-klub: linear-gradient(180deg, #004d98 0%, #043a73 28%, #5a0730 60%, #7a0038 85%, #5a0028 100%);
}
/* 🩵 MAN CITY – nebeská modrá */
html[data-theme="city"] {
    --fial: #6cabdd; --fial-rgb: 108,171,221; --magenta: #1c2c5b; --magenta-rgb: 28,44,91;
    --gold: #ffc659; --gold-rgb: 255,198,89; --dark: #08172e; --bg-top: #16386a; --text: #eaf4ff; --text-rgb: 234,244,255;
    --card-bg: rgba(108,171,221,.1);
    --bg-klub: linear-gradient(180deg, #3a7ab5 0%, #2a6299 25%, #1c4a80 50%, #123458 75%, #0a2648 100%);
}
/* 🔵🔴 PSG – tmavě modrá/červená */
html[data-theme="psg"] {
    --fial: #e30613; --fial-rgb: 227,6,19; --magenta: #004170; --magenta-rgb: 0,65,112;
    --gold: #d4af37; --gold-rgb: 212,175,55; --dark: #04122a; --bg-top: #0a2f5c; --text: #ffffff; --text-rgb: 255,255,255;
    --card-bg: rgba(227,6,19,.07);
    --bg-klub: linear-gradient(180deg, #0a2f5c 0%, #071f3f 32%, #4a0810 64%, #8a0c16 85%, #4a0810 100%);
}
/* 🔴 ARSENAL – červená + výrazná bílá */
html[data-theme="arsenal"] {
    --fial: #ffffff; --fial-rgb: 255,255,255; --magenta: #ffffff; --magenta-rgb: 255,255,255;
    --gold: #ffe680; --gold-rgb: 255,230,128; --dark: #1a0608; --bg-top: #ffffff; --text: #ffffff; --text-rgb: 255,255,255;
    --card-bg: rgba(255,255,255,.1);
    --bg-klub: linear-gradient(180deg, #ffffff 0%, #f0f0f0 8%, #ef0107 22%, #d10509 45%, #8a0810 72%, #3a0608 100%);
}
/* Ochrana čitelnosti textů na barevných klubových pozadích */
html[data-theme="real"] .zpet, html[data-theme="real"] .podtitul, html[data-theme="real"] .auth-lista,
html[data-theme="city"] .zpet, html[data-theme="city"] .podtitul, html[data-theme="city"] .auth-lista,
html[data-theme="barca"] .zpet, html[data-theme="barca"] .podtitul, html[data-theme="barca"] .auth-lista,
html[data-theme="psg"] .zpet, html[data-theme="psg"] .podtitul, html[data-theme="psg"] .auth-lista,
html[data-theme="arsenal"] .zpet, html[data-theme="arsenal"] .podtitul, html[data-theme="arsenal"] .auth-lista,
html[data-theme="zlaty"] .zpet, html[data-theme="zlaty"] .podtitul, html[data-theme="zlaty"] .auth-lista {
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
}
/* Ochrana čitelnosti textů na barevných klubových pozadích */
html[data-theme="real"] .zpet, html[data-theme="real"] .podtitul, html[data-theme="real"] .auth-lista,
html[data-theme="city"] .zpet, html[data-theme="city"] .podtitul, html[data-theme="city"] .auth-lista,
html[data-theme="barca"] .zpet, html[data-theme="barca"] .podtitul, html[data-theme="barca"] .auth-lista,
html[data-theme="psg"] .zpet, html[data-theme="psg"] .podtitul, html[data-theme="psg"] .auth-lista,
html[data-theme="arsenal"] .zpet, html[data-theme="arsenal"] .podtitul, html[data-theme="arsenal"] .auth-lista,
html[data-theme="zlaty"] .zpet, html[data-theme="zlaty"] .podtitul, html[data-theme="zlaty"] .auth-lista {
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
}

* { box-sizing:border-box; }
body {
    background: radial-gradient(ellipse at top, var(--bg-top) 0%, var(--dark) 70%);
    color:var(--text); font-family:Inter, sans-serif;
    margin:0; padding:20px 15px 40px; min-height:100vh; -webkit-tap-highlight-color:transparent;
}
/* Klubové gradienty pozadí + tmavý/světlý přes proměnné */
html[data-theme="zlaty"] body,
html[data-theme="real"] body,
html[data-theme="barca"] body,
html[data-theme="city"] body,
html[data-theme="psg"] body,
html[data-theme="arsenal"] body {
    background: var(--bg-klub) !important;
    background-attachment: fixed;
}
.wrap { max-width:560px; margin:0 auto; }
.back { display: block; width: fit-content; margin: 0 auto 14px; text-align: center; color:rgba(240,230,200,.4); text-decoration:none; font-size:.75em; border:1px solid rgba(212,175,55,.25); border-radius:100px; padding:8px 18px; }
.back:hover { color:var(--gold); border-color:var(--gold); }

.hero {
    position:relative; overflow:hidden;
    background:linear-gradient(135deg, rgba(46,107,255,.1), rgba(255,46,204,.05), rgba(15,20,32,.5));
    border:1px solid rgba(46,107,255,.4); border-radius:26px;
    padding:28px 22px; margin-bottom:20px;
}
.hero::before, .hero::after {
    content:''; position:absolute; inset:6px; border:1px solid rgba(46,107,255,.22); border-radius:20px; pointer-events:none;
}
.hero .jmeno {
    font-size:2em; font-weight:900; letter-spacing:1.5px; text-transform:uppercase; word-break:break-word;
    background:linear-gradient(135deg, #eef2ff, var(--fial) 40%, var(--magenta) 65%, #eef2ff 85%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:var(--gold);
}
.hero .titul { color:var(--fial); font-weight:800; letter-spacing:3px; font-size:.78em; text-transform:uppercase; margin-top:8px; }
.hero .hlaska { font-style:italic; opacity:.55; font-size:.92em; margin:16px 0 20px; }
.hero .staty { display:flex; gap:10px; }
.hero .stat { flex:1; background:rgba(5,8,15,.55); border:1px solid rgba(212,175,55,.2); border-radius:16px; padding:14px 6px; text-align:center; }
.hero .stat .v { font-size:1.5em; font-weight:900; color:var(--gold); }
.hero .stat .l { font-size:.55em; letter-spacing:1.5px; text-transform:uppercase; opacity:.5; margin-top:4px; }

.blok { background:rgba(15,20,32,.6); border:1px solid rgba(212,175,55,.18); border-radius:22px; padding:20px 18px; margin-bottom:18px; }
.blok h2 { font-size:.78em; letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin:0 0 16px; }

/* ODZNÁČKY – grid ve stylu WC */
.odznaky { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.odz { background:rgba(5,8,15,.4); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:12px; text-align:center; opacity:.35; }
.odz.on { opacity:1; background:rgba(212,175,55,.1); border-color:rgba(212,175,55,.5); box-shadow:0 0 12px rgba(212,175,55,.12); }
.odz .ic { font-size:1.6em; }
.odz .l { font-size:.66em; font-weight:800; margin-top:5px; }
.odz.on .l { color:var(--gold); }
.odz .p { font-size:.56em; opacity:.6; margin-top:3px; line-height:1.4; }

/* DLOUHODOBKA PŘEHLED */
.dl-prehled { display:flex; flex-direction:column; gap:8px; }
.dl-radek { display:flex; justify-content:space-between; align-items:center; background:rgba(5,8,15,.4); border-radius:12px; padding:10px 14px; font-size:.82em; }
.dl-radek b { color:var(--gold); }

/* FORMA */
.forma { display:flex; gap:9px; }
.forma .f {
    flex:1; aspect-ratio:1; max-width:76px; border-radius:14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    font-size:1.4em; border:1px solid;
}
.forma .f small { font-size:.42em; opacity:.7; font-weight:700; }
.forma .ok { background:rgba(39,174,96,.12); border-color:rgba(39,174,96,.5); }
.forma .fail { background:rgba(231,76,60,.08); border-color:rgba(231,76,60,.4); }

/* ÚSPĚŠNOST */
.usp { margin-bottom:14px; }
.usp .lbl { display:flex; justify-content:space-between; font-size:.95em; font-weight:700; margin-bottom:7px; }
.usp .lbl b { color:var(--fial); font-family:monospace; }
.usp .bar { height:9px; border-radius:100px; background:rgba(255,255,255,.07); overflow:hidden; }
.usp .fill { height:100%; border-radius:100px; }

/* POZICE */
.pozice { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.pozice .p {
    background:rgba(5,10,25,.5); border:1px solid rgba(255,255,255,.1);
    border-radius:16px; padding:14px; display:flex; gap:12px; align-items:center;
}
.pozice .rank { font-size:1.7em; font-weight:900; opacity:.85; }
.pozice .rank.top { color:var(--gold); }
.pozice .info .n { font-size:.6em; letter-spacing:1.5px; text-transform:uppercase; opacity:.5; line-height:1.4; }
.pozice .info .h { font-weight:900; font-size:.95em; margin-top:3px; }


/* HISTORIE */
.hist { display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid rgba(212,175,55,.08); }
.hist .ikona { font-size:1.3em; }
.hist .telo { flex:1; min-width:0; }
.hist .t { font-weight:800; font-size:.92em; }
.hist .s { font-size:.72em; opacity:.55; margin-top:2px; }
.hist .b { font-weight:900; color:var(--gold); white-space:nowrap; }
.prazdno { text-align:center; opacity:.4; padding:16px 0; font-size:.85em; }

html[data-theme="real"] .back { text-shadow: 0 1px 3px rgba(255,255,255,.7); color: rgba(18,36,74,.7) !important; }
html[data-theme="arsenal"] .back { text-shadow: 0 1px 3px rgba(255,255,255,.7); color: rgba(180,10,15,.75) !important; }
html[data-theme="city"] .back, html[data-theme="city"] .zpet { text-shadow: 0 1px 3px rgba(0,0,0,.5); }

/* 🔴⚪ SLAVIA PRAHA – červeno-bílá */
html[data-theme="slavia"] {
    --fial: #ffffff; --fial-rgb: 255,255,255; --magenta: #ffffff; --magenta-rgb: 255,255,255;
    --gold: #ffe0a0; --gold-rgb: 255,224,160; --dark: #6a0a0e; --bg-top: #d7141a; --text: #ffffff; --text-rgb: 255,255,255;
    --card-bg: rgba(255,255,255,.1);
    --bg-klub: linear-gradient(160deg, #ffffff 0%, #f5f5f5 6%, #d7141a 16%, #c41217 40%, #9a0e13 70%, #6a0a0e 100%);
}
html[data-theme="slavia"] body { background: var(--bg-klub) !important; background-attachment: fixed; text-shadow: 0 1px 3px rgba(90,0,4,.6); }
html[data-theme="slavia"] h1 { color: #ffffff; -webkit-text-fill-color: #ffffff; text-shadow: 0 0 12px rgba(120,10,15,.9), 0 2px 6px rgba(0,0,0,.6), 0 0 3px rgba(120,10,15,1); }
html[data-theme="slavia"] .zpet, html[data-theme="slavia"] .back { text-shadow: 0 1px 3px rgba(255,255,255,.7); color: rgba(150,10,15,.8) !important; }

/* 🔵 CHELSEA – královská modrá */
html[data-theme="chelsea"] {
    --fial: #6a9fd8; --fial-rgb: 106,159,216; --magenta: #ffffff; --magenta-rgb: 255,255,255;
    --gold: #ffd700; --gold-rgb: 255,215,0; --dark: #030f26; --bg-top: #0a3a80; --text: #eaf2ff; --text-rgb: 234,242,255;
    --card-bg: rgba(106,159,216,.1);
    --bg-klub: linear-gradient(180deg, #0a52b5 0%, #084298 25%, #063372 50%, #04214d 75%, #030f26 100%);
}
/* 🟡 DORTMUND – žluto-černá */
html[data-theme="dortmund"] {
    --fial: #fde100; --fial-rgb: 253,225,0; --magenta: #fde100; --magenta-rgb: 253,225,0;
    --gold: #fde100; --gold-rgb: 253,225,0; --dark: #0a0a0a; --bg-top: #1a1a1a; --text: #ffffff; --text-rgb: 255,255,255;
    --card-bg: rgba(253,225,0,.08);
    --bg-klub: linear-gradient(180deg, #2a2a1a 0%, #1a1a10 30%, #121208 55%, #0a0a05 100%);
}
html[data-theme="chelsea"] body,
html[data-theme="dortmund"] body {
    background: var(--bg-klub) !important; background-attachment: fixed;
}
html[data-theme="dortmund"] h1 { color: #fde100; -webkit-text-fill-color: #fde100; text-shadow: 0 0 14px rgba(253,225,0,.4), 0 2px 6px rgba(0,0,0,.6); }

</style>

</script>
<script>
const KLUB_LOGA = {
    real: 'https://crests.football-data.org/86.png',
    barca: 'https://crests.football-data.org/81.png',
    city: 'https://crests.football-data.org/65.png',
    psg: 'https://crests.football-data.org/524.png',
    arsenal: 'https://crests.football-data.org/57.png',
    slavia: 'https://crests.football-data.org/930.png',
    chelsea: 'https://crests.football-data.org/61.png',
    dortmund: 'https://crests.football-data.org/4.png'
};
function zobrazKlubOdznak(t) {
    var vz = document.getElementById('klubVodoznak');
    if (vz) { if (KLUB_LOGA[t]) { vz.src = KLUB_LOGA[t]; vz.style.display = 'block'; } else { vz.style.display = 'none'; } }
    var el = document.getElementById('klubOdznak');
    if (!el) return;
    el.style.display = "none";
}
document.addEventListener('DOMContentLoaded',function(){ var t=(function(){try{return localStorage.getItem('cl_theme')||'tmavy';}catch(e){return 'tmavy';}})(); zobrazKlubOdznak(t); });
</script>
</head>
<body>
<img id="klubVodoznak" src="" alt="" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:0; width:75vw; max-width:420px; height:auto; object-fit:contain; opacity:.10; pointer-events:none;">
<img id="klubOdznak" src="" alt="" style="display:none; position:fixed; top:80px; right:16px; z-index:9999; width:72px; height:72px; object-fit:contain; filter:drop-shadow(0 2px 10px rgba(0,0,0,.6));">
<div id="themeSwitch" style="position:fixed; top:12px; right:12px; z-index:10000;">
    <button onclick="prepniThemePanel()" style="background:rgba(var(--fial-rgb),.12); border:1px solid rgba(var(--fial-rgb),.45); color:var(--text); width:42px; height:42px; border-radius:50%; cursor:pointer; font-size:1.2em; backdrop-filter:blur(6px);" title="Změnit vzhled">🎨</button>
    <div id="themePanel" style="display:none; position:absolute; top:50px; right:0; background:var(--dark); border:1px solid rgba(var(--fial-rgb),.45); border-radius:14px; padding:8px; min-width:180px; max-height:60vh; overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,.5);">
        <button class="theme-opt" onclick="nastavTheme('tmavy')">🌙 Tmavý</button>
        <button class="theme-opt" onclick="nastavTheme('svetly')">☀️ Světlý</button>
        <button class="theme-opt" onclick="nastavTheme('zlaty')">🏆 Zlatý</button>
        <button class="theme-opt" onclick="nastavTheme('real')">⚪ Real Madrid</button>
        <button class="theme-opt" onclick="nastavTheme('barca')">🔵 Barcelona</button>
        <button class="theme-opt" onclick="nastavTheme('city')">🩵 Man City</button>
        <button class="theme-opt" onclick="nastavTheme('psg')">🔴 PSG</button>
        <button class="theme-opt" onclick="nastavTheme('arsenal')">🔴 Arsenal</button>
        <button class="theme-opt" onclick="nastavTheme('slavia')">🔴 Slavia Praha</button>
        <button class="theme-opt" onclick="nastavTheme('chelsea')">🔵 Chelsea</button>
        <button class="theme-opt" onclick="nastavTheme('dortmund')">🟡 Dortmund</button>
    </div>
</div>
<style>
    .theme-opt { display:block; width:100%; text-align:left; background:none; border:none; color:var(--text); padding:10px 12px; border-radius:8px; cursor:pointer; font-size:.9em; font-family:inherit; }
    .theme-opt:hover { background:rgba(var(--fial-rgb),.12); }
    .theme-opt.on { background:rgba(var(--fial-rgb),.2); color:var(--fial); font-weight:800; }
</style>
<script>
const CL_THEMES = ['tmavy','svetly','zlaty','real','barca','city','psg','arsenal','slavia','chelsea','dortmund'];
function nastavTheme(t){ try{ localStorage.setItem('cl_theme',t); }catch(e){}
    if(t==='tmavy') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t);
    document.querySelectorAll('.theme-opt').forEach((b,i)=>b.classList.toggle('on', CL_THEMES[i]===t));
    document.getElementById('themePanel').style.display='none';
    zobrazKlubOdznak(t);
}
function prepniThemePanel(){ var p=document.getElementById('themePanel'); p.style.display=p.style.display==='none'?'block':'none';
    var t=(function(){try{return localStorage.getItem('cl_theme')||'tmavy';}catch(e){return 'tmavy';}})();
    document.querySelectorAll('.theme-opt').forEach((b,i)=>b.classList.toggle('on', CL_THEMES[i]===t));
}
document.addEventListener('click',function(e){ var sw=document.getElementById('themeSwitch'); if(sw&&!sw.contains(e.target)){ var p=document.getElementById('themePanel'); if(p) p.style.display='none'; } });
</script>

    </div>

    <div class="blok">
        <h2>📋 Dlouhodobé tipy</h2>
        <div class="dl-prehled" id="dlPrehled"></div>
    </div>

    <div class="blok">
        <h2>⚽ Historie zápasových tipů (<span id="histPocet">0</span>)</h2>
        <div id="historie"></div>
    </div>
</div>

<script>
const SB_URL = "https://vlabocwezmpwnxrwxihs.supabase.co";
const SB_KEY = "sb_publishable_H9egZ3Rrq5LYi02NxpvjCQ_xDXOQP4X";
const sb = supabase.createClient(SB_URL, SB_KEY);

function hashCode(str) {
    let h = 0;
    for (let i = 0; i < String(str).length; i++) h = ((h << 5) - h + String(str).charCodeAt(i)) | 0;
    return h;
}

async function load() {
    const params = new URLSearchParams(location.search);
    let uid = params.get('id');
    if (!uid) {
        const { data: { session } } = await sb.auth.getSession();
        uid = session?.user?.id;
    }
    if (!uid) { document.getElementById('hJmeno').textContent = 'Hráč nenalezen'; return; }

    // Kdo je právě přihlášený (kvůli skrývání cizích tipů)
    const { data: { session: mojeSession } } = await sb.auth.getSession();
    const mojeAktualniId = mojeSession?.user?.id;

    const [zR, tR, dR] = await Promise.all([
        sb.from('cl_zapasy').select('*'),
        sb.from('cl_tipy_zapasy').select('*'),
        sb.from('cl_dlouhodobe').select('*')
    ]);
    const zapasy = zR.data || [], tipy = tR.data || [], dlouhodobe = dR.data || [];
    const zapasMap = {}; zapasy.forEach(z => zapasMap[z.id] = z);

    const mojeTipy = tipy.filter(t => t.user_id === uid).sort((a, b) =>
        new Date(zapasMap[b.zapas_id]?.deadline || 0) - new Date(zapasMap[a.zapas_id]?.deadline || 0));
    const mujDl = dlouhodobe.find(d => d.user_id === uid);

    // ⚽ Avatar – načti VŽDY (i před začátkem, když hráč ještě netipoval)
    await nactiAvatar(uid, mojeAktualniId);

    if (!mojeTipy.length && !mujDl) { document.getElementById('hJmeno').textContent = 'Hráč zatím netipoval'; return; }

    const jmeno = mojeTipy[0]?.jmeno || mujDl?.jmeno || '?';
    const bodyZap = mojeTipy.reduce((s, t) => s + (t.body || 0), 0);
    const bodyDl = (mujDl?.body1 || 0) + (mujDl?.body2 || 0);
    const celkem = bodyZap + bodyDl;
    const presnych = mojeTipy.filter(t => zapasMap[t.zapas_id]?.status === 'vyhodnoceno' &&
        `${zapasMap[t.zapas_id].vysledek_d}:${zapasMap[t.zapas_id].vysledek_h}` === t.skore).length;
    const vyhodnocenychZapasu = zapasy.filter(z => z.status === 'vyhodnoceno').length;
    const ucast = vyhodnocenychZapasu ? Math.round(mojeTipy.filter(t => zapasMap[t.zapas_id]?.status === 'vyhodnoceno').length / vyhodnocenychZapasu * 100) : 0;

    // celkový žebříček pro pozici hráče
    const body = {};
    tipy.forEach(t => { body[t.user_id] = body[t.user_id] || 0; body[t.user_id] += t.body || 0; });
    dlouhodobe.forEach(d => { body[d.user_id] = body[d.user_id] || 0; body[d.user_id] += (d.body1 || 0) + (d.body2 || 0); });
    const razeni = Object.entries(body).sort((a, b) => b[1] - a[1]).map(x => x[0]);
    const pozice = razeni.indexOf(uid) + 1;

    const tip1Kompletni = mujDl?.tip1 && (mujDl.tip1.top8 || []).length === 8 && (mujDl.tip1.propadlici || []).length === 12 && mujDl.tip1.vitezZC;
    const tip2Kompletni = mujDl?.tip2 && (mujDl.tip2.finale || []).length === 2 && mujDl.tip2.vitez;

    // HERO
    document.getElementById('hJmeno').textContent = jmeno;
    document.getElementById('hCelkem').textContent = celkem;
    document.getElementById('hZapasy').textContent = bodyZap;
    document.getElementById('hDlouhodobe').textContent = bodyDl;

    const titulyKandidati = [
        { podm: pozice === 1 && celkem > 0, titul: 'VLÁDCE LIGY', hlasky: ['Pohár ještě nezvedl, ale žebříček mu leží u nohou.', 'Zatím vede – tabulka ho poslouchá.'] },
        { podm: presnych >= 3, titul: 'VĚŠTEC VÝSLEDKŮ', hlasky: ['Přesné skóre mu leze do hlavy samo.', 'Vidí zápas dřív, než se odehraje.'] },
        { podm: tip1Kompletni && tip2Kompletni, titul: 'KOMPLETISTA', hlasky: ['Od základní části po finále – nic mu neuniklo.', 'Vyplnil úplně všechno. Vzorný fanoušek.'] },
        { podm: ucast >= 80 && mojeTipy.length >= 3, titul: 'VĚRNÝ FANOUŠEK', hlasky: ['Netipnul zápas? To se u něj nestává.', 'Účast blízko 100 %. Klobouk dolů.'] },
    ].filter(k => k.podm);
    const titul = titulyKandidati[0] || { titul: 'NADĚJNÝ TIPÉR', hlasky: ['Jeho velká chvíle teprve přijde.', 'Zatím sbírá zkušenosti.'] };
    document.getElementById('hTitul').textContent = titul.titul;
    document.getElementById('hHlaska').textContent = `„${titul.hlasky[Math.abs(hashCode(uid)) % titul.hlasky.length]}"`;

    // ODZNÁČKY
    const odz = [
        { on: mojeTipy.length > 0, ic: '⚽', l: 'První tip', p: 'Vsadil aspoň na jeden zápas.' },
        { on: presnych >= 1, ic: '🎯', l: 'Přesňák', p: `Trefil přesný výsledek (${presnych}×).` },
        { on: presnych >= 3, ic: '🔮', l: 'Věštec', p: 'Trefil 3+ přesných výsledků.' },
        { on: ucast >= 80 && mojeTipy.length >= 3, ic: '📅', l: 'Věrný fanoušek', p: 'Účast 80 %+ na vypsaných zápasech.' },
        { on: !!tip1Kompletni, ic: '📋', l: 'Základní část hotova', p: 'Vyplnil kompletní dlouhodobku 1.' },
        { on: !!tip2Kompletni, ic: '🏆', l: 'Cesta k titulu', p: 'Vyplnil kompletní dlouhodobku 2.' },
        { on: !!mujDl?.zaplaceno, ic: '💰', l: 'Zaplaceno', p: 'Uhradil startovné 200 Kč.' },
        { on: pozice === 1 && celkem > 0, ic: '👑', l: 'Vládce ligy', p: 'Vede celkový žebříček.' },
        { on: pozice >= 2 && pozice <= 3 && celkem > 0, ic: '🥈', l: 'Na bedně', p: 'Drží 2.–3. místo v žebříčku.' },
    ];
    // ===== FORMA (posledních 5 vyhodnocených) =====
    const vyhodnocene = mojeTipy.filter(t => zapasMap[t.zapas_id]?.status === 'vyhodnoceno').slice(0, 5);
    document.getElementById('forma').innerHTML = vyhodnocene.length
        ? vyhodnocene.map(t => {
            const z = zapasMap[t.zapas_id];
            const trefil = `${z.vysledek_d}:${z.vysledek_h}` === t.skore;
            return `<div class="f ${t.body > 0 ? 'ok' : 'fail'}">${trefil ? '🎯' : (t.body > 0 ? '✅' : '❌')}<small>${z.vysledek_d}:${z.vysledek_h}</small></div>`;
        }).join('')
        : '<div class="prazdno" style="flex:1;">Zatím žádné vyhodnocené tipy.</div>';

    // ===== ÚSPĚŠNOST =====
    const pocetVyhodnocenych = mojeTipy.filter(t => zapasMap[t.zapas_id]?.status === 'vyhodnoceno').length;
    const trendy = mojeTipy.filter(t => {
        const z = zapasMap[t.zapas_id];
        if (z?.status !== 'vyhodnoceno') return false;
        const [td, th] = t.skore.split(':').map(Number);
        const smerTip = td > th ? 1 : (td === th ? 0 : 2);
        const smerReal = z.vysledek_d > z.vysledek_h ? 1 : (z.vysledek_d === z.vysledek_h ? 0 : 2);
        return smerTip === smerReal;
    }).length;
    const pct = (x) => pocetVyhodnocenych ? Math.round(x / pocetVyhodnocenych * 100) : 0;
    const bar = (nazev, ikona, pocet, procenta, barva) => `
        <div class="usp">
            <div class="lbl"><span>${ikona} ${nazev}</span><b>${pocet}×&nbsp;&nbsp;${procenta}%</b></div>
            <div class="bar"><div class="fill" style="width:${procenta}%; background:${barva};"></div></div>
        </div>`;
    document.getElementById('uspesnost').innerHTML =
        bar('Přesné výsledky', '🎯', presnych, pct(presnych), 'linear-gradient(90deg,#2e6bff,#1a4bb8)') +
        bar('Správné trendy', '📈', trendy, pct(trendy), 'linear-gradient(90deg,#ff2ecc,#a0009a)') +
        bar('Účast na zápasech', '📅', pocetVyhodnocenych, ucast, 'linear-gradient(90deg,#d4af37,#9a7b1e)');

    // ===== POZICE V ŽEBŘÍČKU =====
    const pKarta = (rank, nazev, hodnota) => `
        <div class="p">
            <span class="rank ${rank <= 3 ? 'top' : ''}">${rank}.</span>
            <div class="info"><div class="n">${nazev}</div><div class="h">${hodnota}</div></div>
        </div>`;
    const razeniZap = Object.entries(
        tipy.reduce((a, t) => { a[t.user_id] = (a[t.user_id] || 0) + (t.body || 0); return a; }, {})
    ).sort((a, b) => b[1] - a[1]).map(x => x[0]);
    const pozZap = razeniZap.indexOf(uid) + 1;
    document.getElementById('pozice').innerHTML =
        pKarta(pozice, 'Celkově', celkem + ' b.') +
        (pozZap > 0 ? pKarta(pozZap, 'Zápasové<br>tipy', bodyZap + ' b.') : '');

    document.getElementById('odznaky').innerHTML = odz.map(o => `
        <div class="odz ${o.on ? 'on' : ''}">
            <div class="ic">${o.ic}</div>
            <div class="l">${o.l}</div>
            <div class="p">${o.p}</div>
        </div>`).join('');

    // DLOUHODOBKA PŘEHLED
    const dlHtml = [];
    if (mujDl?.tip1) {
        const t = mujDl.tip1;
        dlHtml.push(`<div class="dl-radek"><span>📋 Top 8 / propadlíci / vítěz ZČ</span><b>${(t.top8 || []).length}/8 · ${(t.propadlici || []).length}/12${t.vitezZC ? ' · ✓ vítěz' : ''}</b></div>`);
        dlHtml.push(`<div class="dl-radek"><span>Body za dlouhodobku 1</span><b>${mujDl.body1 || 0}</b></div>`);
    }
    if (mujDl?.tip2) {
        const t = mujDl.tip2;
        dlHtml.push(`<div class="dl-radek"><span>🏆 QF/SF/finalisté/vítěz</span><b>${(t.qf || []).length}/8 · ${(t.sf || []).length}/4 · ${(t.finale || []).length}/2${t.vitez ? ' · ✓' : ''}</b></div>`);
        dlHtml.push(`<div class="dl-radek"><span>Body za dlouhodobku 2</span><b>${mujDl.body2 || 0}</b></div>`);
    }
    document.getElementById('dlPrehled').innerHTML = dlHtml.length ? dlHtml.join('') : '<div class="prazdno">Zatím nevyplnil žádnou dlouhodobku.</div>';

    // HISTORIE
    document.getElementById('histPocet').textContent = mojeTipy.length;
    document.getElementById('historie').innerHTML = mojeTipy.length
        ? mojeTipy.map(t => {
            const z = zapasMap[t.zapas_id];
            const hotovo = z?.status === 'vyhodnoceno';
            const trefil = hotovo && `${z.vysledek_d}:${z.vysledek_h}` === t.skore;
            // Tip cizího hráče je skrytý, dokud zápas nezačne (aby se neopisovalo)
            const jeMuj = uid === mojeAktualniId;
            const zacal = z && Date.now() > new Date(z.deadline).getTime();
            const skryt = !jeMuj && !zacal && !hotovo;
            return `<div class="hist">
                <span class="ikona">${skryt ? '🙈' : (!hotovo ? '⏳' : (trefil ? '✅' : '❌'))}</span>
                <div class="telo">
                    <div class="t">${z ? `${z.domaci} vs ${z.hoste}` : 'Neznámý zápas'}</div>
                    <div class="s">${skryt
                        ? 'Tip skrytý do uzávěrky 🔒'
                        : `Tip: ${t.skore}${hotovo ? ` | Výsledek: ${z.vysledek_d}:${z.vysledek_h}` : ' | čeká na výsledek'}`}</div>
                </div>
                <div class="b">${hotovo ? `+${t.body || 0} b.` : '–'}</div>
            </div>`;
        }).join('')
        : '<div class="prazdno">Zatím žádné tipy na zápasy.</div>';
}

// ⚽ Fotbalová + rozšířená sada avatarů
const AVATARY = [
    '⚽','🥅','🧤','🏆','🥇','🥈','🥉','🎽','👟','🚩',
    '🦁','🦅','🐺','🐻','🐉','🦈','🐅','🦊','🐂','🐗',
    '🦌','🦏','🐊','🦍','🐢','🦉','🐲','🦇',
    '⚡','🔥','💥','⭐','👑','🎯','💎','🛡️','🚀','💪',
    '😎','🤩','🥶','🤠','👽','🤖','👹','💀','🃏','🎲'
];

async function nactiAvatar(uid, mojeId) {
    const { data } = await sb.from('hraci').select('avatar').eq('user_id', uid).maybeSingle();
    const avatar = data?.avatar || '⚽';
    const disp = document.getElementById('avatarDisplay');
    if (disp) disp.textContent = avatar;

    if (mojeId && uid === mojeId) {
        const box = document.getElementById('avatarBox');
        const vyber = document.getElementById('avatarVyber');
        if (box && vyber) {
            box.style.display = 'block';
            vyber.innerHTML = AVATARY.map(a => `
                <button onclick="ulozAvatar('${a}')" style="
                    font-size:1.6em; width:52px; height:52px; border-radius:12px; cursor:pointer;
                    background:${a === avatar ? 'rgba(var(--fial-rgb),.2)' : 'rgba(255,255,255,.05)'};
                    border:2px solid ${a === avatar ? 'var(--fial)' : 'rgba(255,255,255,.1)'};
                ">${a}</button>`).join('');
        }
    }
}

async function ulozAvatar(a) {
    const { data: { session } } = await sb.auth.getSession();
    const mojeId = session?.user?.id;
    if (!mojeId) return;
    const { error } = await sb.from('hraci').update({ avatar: a }).eq('user_id', mojeId);
    if (error) { alert('Nepodařilo se uložit: ' + error.message); return; }
    document.getElementById('avatarDisplay').textContent = a;
    document.querySelectorAll('#avatarVyber button').forEach(b => {
        const je = b.textContent === a;
        b.style.background = je ? 'rgba(var(--fial-rgb),.2)' : 'rgba(255,255,255,.05)';
        b.style.border = '2px solid ' + (je ? 'var(--fial)' : 'rgba(255,255,255,.1)');
    });
}

function prepniAvatarVyber() {
    const wrap = document.getElementById('avatarVyberWrap');
    const toggle = document.getElementById('avatarToggle');
    const skryto = wrap.style.display === 'none';
    wrap.style.display = skryto ? 'block' : 'none';
    if (toggle) toggle.textContent = skryto ? '▲ skrýt' : '▼ vybrat';
}
load();
</script>

<script>
// Načti viditelnost vodoznaku z cl_stav a aplikuj (nastavená adminem, platí všude)
(async function(){
    try {
        const { data } = await sb.from('cl_stav').select('vodoznak_opacity').eq('id', 1).maybeSingle();
        const op = (data && data.vodoznak_opacity != null) ? data.vodoznak_opacity : 0.10;
        const vz = document.getElementById('klubVodoznak');
        if (vz) vz.style.opacity = op;
    } catch(e) { /* necháme výchozí opacity z CSS */ }
})();
</script>
