<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NADĚJE · Žebříčky Champions League</title>
<link rel="icon" href="../favicon.ico">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cl-zebricky.js"></script>
<style>
:root {
    --fial: #2e6bff;
    --magenta: #ff2ecc;
    --gold: #d4af37;
    --dark: #05081c;
}
* { box-sizing: border-box; }
body {
    background: radial-gradient(ellipse at top, #0d1430 0%, var(--dark) 65%);
    color: #eef2ff; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 15px; min-height: 100vh; -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 600px; margin: 0 auto; }
.back { display: inline-block; color: rgba(238,242,255,.45); text-decoration: none; font-size: .75em; margin-bottom: 12px; }
h1 { text-align: center; font-size: 1.15em; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; margin: 6px 0 6px; }
.podtitul { text-align: center; font-size: .72em; opacity: .5; margin-bottom: 18px; letter-spacing: 1px; }

/* ZÁLOŽKY */
.zalozky { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
.zalozka {
    flex: 1 1 auto; min-width: 90px; text-align: center;
    background: rgba(46,107,255,.06); border: 1px solid rgba(46,107,255,.25);
    border-radius: 12px; padding: 10px 8px; cursor: pointer;
    font-size: .74em; font-weight: 800; letter-spacing: .5px; color: #aeb9d8;
    transition: all .18s; user-select: none;
}
.zalozka:hover { border-color: rgba(46,107,255,.5); }
.zalozka.on { background: rgba(212,175,55,.14); border-color: var(--gold); color: var(--gold); }

/* BANK BOX (jen u Celkově) */
.bank-box {
    background: rgba(212,175,55,.08); border: 1px solid rgba(212,175,55,.4);
    border-radius: 18px; padding: 18px 16px; margin-bottom: 20px; text-align: center;
}
.bank-box .castka { font-size: 2em; font-weight: 900; color: var(--gold); margin: 2px 0; }
.bank-box .pozn { font-size: .7em; opacity: .55; margin-bottom: 10px; }
.bank-box .medaile { display: flex; justify-content: center; gap: 20px; font-size: .82em; font-weight: 800; flex-wrap: wrap; }

/* BLOK ŽEBŘÍČKU */
.blok {
    background: rgba(46,107,255,.04); border: 1px solid rgba(46,107,255,.22);
    border-radius: 22px; padding: 20px 14px; margin-bottom: 22px;
}
.blok h2 {
    text-align: center; font-size: .9em; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--fial); margin: 0 0 16px;
}
.blok.celkem { border-color: rgba(212,175,55,.45); }
.blok.celkem h2 { color: var(--gold); }

.radek {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 16px; margin-bottom: 6px;
    border-bottom: 1px solid rgba(255,255,255,.04);
    transition: transform .22s, background .22s, box-shadow .22s;
}
.radek:hover {
    transform: translateX(4px);
    background: rgba(46,107,255,.1);
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
}
@media (prefers-reduced-motion: reduce) { .radek { transition: none; } .radek:hover { transform: none; } }
.radek .poradi { min-width: 48px; font-weight: 900; font-size: 1.05em; opacity: .85; }
.radek .telo { flex: 1; min-width: 0; }
.radek .jmeno { font-weight: 800; font-size: 1em; cursor: pointer; text-decoration: underline; text-decoration-color: rgba(46,107,255,.35); text-underline-offset: 3px; }
.radek .jmeno:hover { color: var(--fial); }
.radek .sub { font-size: .68em; color: #7d89ad; margin-top: 4px; letter-spacing: .3px; }
.radek .hodnota { font-weight: 900; font-size: 1.15em; white-space: nowrap; }
.radek .hodnota small { font-size: .55em; opacity: .5; font-weight: 700; margin-left: 2px; }
.radek.r1 { background: linear-gradient(90deg, rgba(212,175,55,.22), rgba(212,175,55,.05)); }
.radek.r1 .poradi { color: #ffd75e; }
.radek.r2 { background: linear-gradient(90deg, rgba(148,163,184,.2), rgba(148,163,184,.04)); }
.radek.r2 .poradi { color: #cbd5e1; }
.radek.r3 { background: linear-gradient(90deg, rgba(180,100,40,.2), rgba(180,100,40,.04)); }
.radek.r3 .poradi { color: #e8965a; }
.prazdno { text-align: center; opacity: .45; padding: 20px 0; font-size: .85em; }
.mini { display: inline-flex; align-items: center; gap: 3px; background: rgba(255,255,255,.07); border-radius: 6px; padding: 1px 7px; margin-right: 6px; }
</style>
</head>
<body>
<div class="wrap">
    <a class="back" href="index.html">← Zpět na tipy</a>
    <h1>📊 Žebříčky Champions League</h1>
    <div class="podtitul">Sázková kancelář Naděje</div>

    <div class="zalozky">
        <div class="zalozka on" data-kat="celkem" onclick="prepni('celkem')">⭐ Celkově</div>
        <div class="zalozka" data-kat="skore" onclick="prepni('skore')">🥅 Výsledky</div>
        <div class="zalozka" data-kat="trendy" onclick="prepni('trendy')">🧠 Trendy</div>
        <div class="zalozka" data-kat="dl" onclick="prepni('dl')">📋 Dlouhodobky</div>
    </div>

    <div id="obsah"></div>
</div>

<script>
const SB_URL = "https://vlabocwezmpwnxrwxihs.supabase.co";
const SB_KEY = "sb_publishable_H9egZ3Rrq5LYi02NxpvjCQ_xDXOQP4X";
const sb = supabase.createClient(SB_URL, SB_KEY);

const STARTOVNE = 200;              // do banku jde 200 Kč z každého startovného
const DELENI = [0.5, 0.3, 0.2];     // dělení banku mezi top 3

let stats = null, bank = 0, aktKat = 'celkem';

function radek(h, poradiNum, rankLabel, hodnotaHtml, subHtml) {
    const cls = poradiNum === 1 ? 'r1' : poradiNum === 2 ? 'r2' : poradiNum === 3 ? 'r3' : '';
    const korunka = poradiNum === 1 ? ' 👑' : '';
    return `<div class="radek ${cls}">
        <span class="poradi">${rankLabel}</span>
        <div class="telo">
            <span class="jmeno" onclick="location.href='profil.html?id=${h.user_id}'">${h.jmeno}${korunka}</span>
            <div class="sub">${subHtml}</div>
        </div>
        <span class="hodnota">${hodnotaHtml}</span>
    </div>`;
}

function vykresli(list, klic, fmt, sub, filtr) {
    const relevantni = list.filter(filtr || (() => true));
    const serazeni = seradSRankemCL(relevantni, klic);
    if (!serazeni.length) return '<div class="prazdno">Zatím žádná data.</div>';
    return serazeni.map(h => radek(h, h._rankNum, h._rank, fmt(h), sub(h))).join('');
}

const POHLEDY = {
    celkem: () => {
        const bankBox = `
            <div class="bank-box">
                <div style="font-size:.75em; letter-spacing:2px; opacity:.7;">💰 BANK SOUTĚŽE</div>
                <div class="castka">${bank.toLocaleString('cs-CZ')} Kč</div>
                <div class="pozn">Dělí se mezi top 3 hráče celkového pořadí</div>
                <div class="medaile">
                    <span>🥇 ${Math.round(bank * DELENI[0]).toLocaleString('cs-CZ')} Kč</span>
                    <span>🥈 ${Math.round(bank * DELENI[1]).toLocaleString('cs-CZ')} Kč</span>
                    <span>🥉 ${Math.round(bank * DELENI[2]).toLocaleString('cs-CZ')} Kč</span>
                </div>
            </div>`;
        const zeb = vykresli(stats.hraci, 'celkem',
            h => `${h.celkem} <small>b.</small>`,
            h => `<span class="mini">🥅 ${h.zapasBody} b.</span><span class="mini">📋 ${h.dlBody} b.</span>`,
            h => h.celkem > 0 || h.tipu > 0);
        return bankBox + `<div class="blok celkem"><h2>⭐ Celkové pořadí</h2>${zeb}</div>`;
    },
    skore: () => {
        const zeb = vykresli(stats.hraci, 'skore',
            h => `${h.skore}<small>×</small>`,
            h => `Úspěšnost: ${h.uspSkore} % · Účast: ${h.ucast} %`,
            h => h.tipuVyhodnocenych > 0);
        return `<div class="blok"><h2>🥅 Mistři výsledků (přesné skóre)</h2>${zeb}</div>`;
    },
    trendy: () => {
        const zeb = vykresli(stats.hraci, 'trendy',
            h => `${h.trendy}<small>×</small>`,
            h => `Úspěšnost: ${h.uspTrendy} % · Účast: ${h.ucast} %`,
            h => h.tipuVyhodnocenych > 0);
        return `<div class="blok"><h2>🧠 Experti na trendy (správný směr)</h2>${zeb}</div>`;
    },
    dl: () => {
        const zeb = vykresli(stats.hraci, 'dlBody',
            h => `${h.dlBody} <small>b.</small>`,
            h => `Základní část + cesta k titulu`,
            h => h.dlBody > 0);
        return `<div class="blok"><h2>📋 Dlouhodobé tipy</h2>${zeb}</div>`;
    }
};

function prepni(kat) {
    aktKat = kat;
    document.querySelectorAll('.zalozka').forEach(z => z.classList.toggle('on', z.dataset.kat === kat));
    document.getElementById('obsah').innerHTML = POHLEDY[kat]();
    animujCisla();
}

// Efekt: čísla v žebříčku „naskočí" od nuly k cílové hodnotě
function animujCisla() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.querySelectorAll('#obsah .hodnota').forEach(el => {
        const html = el.innerHTML;
        const m = html.match(/^(\d+)/);           // číslo na začátku (např. "42 b." / "5×")
        if (!m) return;
        const cil = parseInt(m[1]);
        if (cil <= 0) return;
        const zbytek = html.slice(m[1].length);   // "<small> b.</small>" apod.
        const kroku = 22;
        let i = 0;
        const iv = setInterval(() => {
            i++;
            const val = Math.round(cil * i / kroku);
            el.innerHTML = val + zbytek;
            if (i >= kroku) clearInterval(iv);
        }, 28);
    });
}

async function load() {
    const [zR, tR, dR] = await Promise.all([
        sb.from('cl_zapasy').select('*'),
        sb.from('cl_tipy_zapasy').select('*'),
        sb.from('cl_dlouhodobe').select('*')
    ]);
    stats = spocitejStatistikyCL(zR.data || [], tR.data || [], dR.data || []);
    const paid = (dR.data || []).filter(d => d.zaplaceno).length;
    bank = paid * STARTOVNE;
    prepni('celkem');
}
load();
</script>
</body>
</html>
