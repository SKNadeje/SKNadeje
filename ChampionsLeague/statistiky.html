.radek {

<script>
const KLUB_LOGA = {
    real: 'https://crests.football-data.org/86.png',

function zobrazKlubOdznak(t) {
    var el = document.getElementById('klubOdznak');
    if (!el) return;
    if (KLUB_LOGA[t]) { el.src = KLUB_LOGA[t]; el.style.display = 'block'; }

}

<script>
const CL_THEMES = ['tmavy','svetly','zlaty','real','barca','city','psg','arsenal'];
function nastavTheme(t){ try{ localStorage.setItem('cl_theme',t); }catch(e){}
    if(t==='tmavy') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t);
    document.querySelectorAll('.theme-opt').forEach((b,i)=>b.classList.toggle('on', CL_THEMES[i]===t));
    document.getElementById('themePanel').style.display='none';
    zobrazKlubOdznak(t);
}
function prepniThemePanel(){ var p=document.getElementById('themePanel'); p.style.display=p.style.display==='none'?'block':'none';
    var t=(function(){try{return localStorage.getItem('cl_theme')||'tmavy';}catch(e){return 'tmavy';}})();
    document.querySelectorAll('.theme-opt').forEach((b,i)=>b.classList.toggle('on', CL_THEMES[i]===t));
}
document.addEventListener('click',function(e){ var sw=document.getElementById('themeSwitch'); if(sw&&!sw.contains(e.target)){ var p=document.getElementById('themePanel'); if(p) p.style.display='none'; } });
</script>

<script>
const SB_URL = "https://vlabocwezmpwnxrwxihs.supabase.co";
const SB_KEY = "sb_publishable_H9egZ3Rrq5LYi02NxpvjCQ_xDXOQP4X";
const sb = supabase.createClient(SB_URL, SB_KEY);

const STARTOVNE = 200;              // do banku jde 200 Kč z každého startovného
const DELENI = [0.5, 0.3, 0.2];     // dělení banku mezi top 3

let stats = null, bank = 0, aktKat = 'celkem';

function radek(h, poradiNum, rankLabel, hodnotaHtml, subHtml) {
    const cls = poradiNum === 1 ? 'r1' : poradiNum === 2 ? 'r2' : poradiNum === 3 ? 'r3' : '';
    const korunka = poradiNum === 1 ? ' 👑' : '';
    return `<div class="radek ${cls}">
        <span class="poradi">${rankLabel}</span>
        <div class="telo">
            <span class="jmeno" onclick="location.href='profil.html?id=${h.user_id}'">${(window._avatary && window._avatary[h.user_id]) ? window._avatary[h.user_id] + ' ' : ''}${h.jmeno}${korunka}</span>
            <div class="sub">${subHtml}</div>
        </div>
        <span class="hodnota">${hodnotaHtml}</span>
    </div>`;
}

function vykresli(list, klic, fmt, sub, filtr) {
    const relevantni = list.filter(filtr || (() => true));
    const serazeni = seradSRankemCL(relevantni, klic);
    if (!serazeni.length) return '<div class="prazdno">Zatím žádná data.</div>';
    return serazeni.map(h => radek(h, h._rankNum, h._rank, fmt(h), sub(h))).join('');
}

const POHLEDY = {
    celkem: () => {
        const bankBox = `
            <div class="bank-box">
                <div style="font-size:.75em; letter-spacing:2px; opacity:.7;">💰 BANK SOUTĚŽE</div>
                <div class="castka">${bank.toLocaleString('cs-CZ')} Kč</div>
                <div class="pozn">Dělí se mezi top 3 hráče celkového pořadí</div>
                <div class="medaile">
                    <span>🥇 ${Math.round(bank * DELENI[0]).toLocaleString('cs-CZ')} Kč</span>
                    <span>🥈 ${Math.round(bank * DELENI[1]).toLocaleString('cs-CZ')} Kč</span>
                    <span>🥉 ${Math.round(bank * DELENI[2]).toLocaleString('cs-CZ')} Kč</span>
                </div>
            </div>`;
        const zeb = vykresli(stats.hraci, 'celkem',
            h => `${h.celkem} <small>b.</small>`,
            h => `<span class="mini">🥅 ${h.zapasBody} b.</span><span class="mini">📋 ${h.dlBody} b.</span>`,
            h => h.celkem > 0 || h.tipu > 0);
        return bankBox + `<div class="blok celkem"><h2>⭐ Celkové pořadí</h2>${zeb}</div>`;
    },
    skore: () => {
        const zeb = vykresli(stats.hraci, 'skore',
            h => `${h.skore}<small>×</small>`,
            h => `Úspěšnost: ${h.uspSkore} % · Účast: ${h.ucast} %`,
            h => h.tipuVyhodnocenych > 0);
        return `<div class="blok"><h2>🥅 Mistři výsledků (přesné skóre)</h2>${zeb}</div>`;
    },
    trendy: () => {
        const zeb = vykresli(stats.hraci, 'trendy',
            h => `${h.trendy}<small>×</small>`,
            h => `Úspěšnost: ${h.uspTrendy} % · Účast: ${h.ucast} %`,
            h => h.tipuVyhodnocenych > 0);
        return `<div class="blok"><h2>🧠 Experti na trendy (správný směr)</h2>${zeb}</div>`;
    },
    dl: () => {
        const zeb = vykresli(stats.hraci, 'dlBody',
            h => `${h.dlBody} <small>b.</small>`,
            h => `Základní část + cesta k titulu`,
            h => h.dlBody > 0);
        return `<div class="blok"><h2>📋 Dlouhodobé tipy</h2>${zeb}</div>`;
    },
    rivalove: () => {
        // vykreslí se asynchronně přes nactiRivaly (kvůli session)
        setTimeout(() => nactiRivaly(stats.hraci), 10);
        return `<div class="blok" style="border-color:rgba(231,76,60,.45);"><h2>⚔️ Rivalové</h2><div id="rivalObsah"><div class="prazdno">Načítám…</div></div></div>`;
    }
};

function prepni(kat) {
    aktKat = kat;
    document.querySelectorAll('.zalozka').forEach(z => z.classList.toggle('on', z.dataset.kat === kat));
    document.getElementById('obsah').innerHTML = POHLEDY[kat]();
    animujCisla();
}

// Efekt: čísla v žebříčku „naskočí" od nuly k cílové hodnotě
function animujCisla() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.querySelectorAll('#obsah .hodnota').forEach(el => {
        const html = el.innerHTML;
        const m = html.match(/^(\d+)/);           // číslo na začátku (např. "42 b." / "5×")
        if (!m) return;
        const cil = parseInt(m[1]);
        if (cil <= 0) return;
        const zbytek = html.slice(m[1].length);   // "<small> b.</small>" apod.
        const kroku = 22;
        let i = 0;
        const iv = setInterval(() => {
            i++;
            const val = Math.round(cil * i / kroku);
            el.innerHTML = val + zbytek;
            if (i >= kroku) clearInterval(iv);
        }, 28);
    });
}

let _vsichniHraci = [];
async function nactiRivaly(hraci) {
    _vsichniHraci = hraci;
    const box = document.getElementById('rivalObsah');
    if (!box) return;
    const { data: { session } } = await sb.auth.getSession();
    const mojeId = session?.user?.id;

    if (!mojeId) { box.innerHTML = '<div class="prazdno">Přihlas se v appce, abys mohl vyzvat rivala.</div>'; return; }
    const ja = hraci.find(h => h.user_id === mojeId);
    if (!ja) { box.innerHTML = '<div class="prazdno">Rivala si vybereš, až podáš první tip. 😉</div>'; return; }

    const { data: mujZaznam } = await sb.from('hraci').select('rival_id').eq('user_id', mojeId).maybeSingle();
    const rivalId = mujZaznam?.rival_id;
    const rival = rivalId ? hraci.find(h => h.user_id === rivalId) : null;

    box.innerHTML = rival ? vykresliSouboj(ja, rival) : vyberRivalaHTML(ja, hraci);
}

function avatarProUid(uid) {
    return (window._avatary && window._avatary[uid]) ? window._avatary[uid] + ' ' : '';
}

function vykresliSouboj(ja, rival) {
    const radekS = (label, maJa, maRival, jednotka = '') => {
        const jaLepsi = maJa > maRival, rivalLepsi = maRival > maJa;
        return `<div style="display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06);">
            <div style="flex:1; text-align:right; font-weight:800; color:${jaLepsi ? 'var(--fial)' : 'var(--text)'};">${maJa}${jednotka}</div>
            <div style="width:92px; text-align:center; font-size:.62em; opacity:.55; text-transform:uppercase; letter-spacing:1px;">${label}</div>
            <div style="flex:1; text-align:left; font-weight:800; color:${rivalLepsi ? '#e74c3c' : 'var(--text)'};">${maRival}${jednotka}</div>
        </div>`;
    };
    const vedu = ja.celkem > rival.celkem, prohravam = ja.celkem < rival.celkem;
    const stav = vedu ? '<span style="color:var(--fial);">Vedeš! 🔥</span>'
               : prohravam ? '<span style="color:#e74c3c;">Prohráváš 😤</span>'
               : '<span style="opacity:.7;">Nerozhodně 🤝</span>';
    return `
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
            <div style="flex:1; text-align:right; font-weight:900;">${avatarProUid(ja.user_id)}${ja.jmeno} <span style="font-size:.7em; opacity:.5;">(ty)</span></div>
            <div style="font-size:1.1em;">⚔️</div>
            <div style="flex:1; text-align:left; font-weight:900;">${avatarProUid(rival.user_id)}${rival.jmeno}</div>
        </div>
        <div style="text-align:center; font-size:.85em; margin-bottom:10px;">${stav}</div>
        ${radekS('Celkem bodů', ja.celkem, rival.celkem)}
        ${radekS('Přesných', ja.skore, rival.skore)}
        ${radekS('Trendů', ja.trendy, rival.trendy)}
        ${radekS('Dlouhodobky', ja.dlBody, rival.dlBody)}
        <div style="text-align:center; margin-top:12px;">
            <button onclick="zmenRivala()" style="background:none; border:1px solid rgba(255,255,255,.2); color:var(--text); opacity:.7; padding:7px 16px; border-radius:100px; cursor:pointer; font-size:.8em;">Změnit rivala</button>
        </div>`;
}

function vyberRivalaHTML(ja, hraci) {
    const soupeci = hraci.filter(h => h.user_id !== ja.user_id && (h.tipu > 0 || h.celkem > 0));
    if (!soupeci.length) return '<div class="prazdno">Zatím nemáš koho vyzvat.</div>';
    return `
        <div style="text-align:center; font-size:.82em; opacity:.7; margin-bottom:12px;">Vyber si rivala a sleduj, kdo z vás je lepší. Můžeš ho kdykoliv změnit.</div>
        <div style="display:flex; flex-direction:column; gap:6px;">
            ${soupeci.map(h => `
                <button onclick="ulozRivala('${h.user_id}')" style="display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); color:var(--text); padding:11px 14px; border-radius:12px; cursor:pointer; font-size:.9em;">
                    <span style="font-weight:700;">${avatarProUid(h.user_id)}${h.jmeno}</span>
                    <span style="opacity:.6; font-size:.85em;">${h.celkem} b.</span>
                </button>`).join('')}
        </div>`;
}

async function ulozRivala(rivalId) {
    const { data: { session } } = await sb.auth.getSession();
    const mojeId = session?.user?.id;
    if (!mojeId) return;
    const { error } = await sb.from('hraci').update({ rival_id: rivalId }).eq('user_id', mojeId);
    if (error) { alert('Nepodařilo se uložit: ' + error.message); return; }
    await nactiRivaly(_vsichniHraci);
}

async function zmenRivala() {
    const { data: { session } } = await sb.auth.getSession();
    const mojeId = session?.user?.id;
    if (!mojeId) return;
    await sb.from('hraci').update({ rival_id: null }).eq('user_id', mojeId);
    await nactiRivaly(_vsichniHraci);
}

async function load() {
    const [zR, tR, dR, avR] = await Promise.all([
        sb.from('cl_zapasy').select('*'),
        sb.from('cl_tipy_zapasy').select('*'),
        sb.from('cl_dlouhodobe').select('*'),
        sb.from('hraci').select('user_id, avatar')
    ]);
    window._avatary = {};
    (avR?.data || []).forEach(h => { if (h.avatar) window._avatary[h.user_id] = h.avatar; });
    stats = spocitejStatistikyCL(zR.data || [], tR.data || [], dR.data || []);
    const paid = (dR.data || []).filter(d => d.zaplaceno).length;
    bank = paid * STARTOVNE;
    prepni('celkem');
}
load();
</script>
