<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NADĚJE · Žebříčky Champions League</title>
<link rel="icon" href="../favicon.ico">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --fial: #2e6bff;
    --magenta: #ff2ecc;
    --gold: #d4af37;
    --dark: #05081c;
 --fial-rgb: 46,107,255; --magenta-rgb: 255,46,204; --gold-rgb: 212,175,55; --text: #eef2ff; --text-rgb: 238,242,255; --bg-top: #0a1240; --card-bg: rgba(46,107,255,.05);}
/* ☀️ SVĚTLÝ */
html[data-theme="svetly"] {
    --fial: #0077b6; --fial-rgb: 0,119,182; --magenta: #c0179c; --magenta-rgb: 192,23,156;
    --gold: #c8901a; --gold-rgb: 200,144,26; --dark: #d4dde8; --bg-top: #e9eef5; --text: #12212f; --text-rgb: 18,33,47;
    --card-bg: rgba(0,55,95,.06);
}
/* 🏆 ZLATÝ */
html[data-theme="zlaty"] {
    --fial: #d4af37; --fial-rgb: 212,175,55; --magenta: #b8860b; --magenta-rgb: 184,134,11;
    --gold: #ffd700; --gold-rgb: 255,215,0; --dark: #0a0a0a; --bg-top: #2a2410; --text: #f5ecd0; --text-rgb: 245,236,208;
    --card-bg: rgba(212,175,55,.06);
    --bg-klub: linear-gradient(180deg, #4a3c0a 0%, #2a2410 40%, #12100a 75%, #0a0a0a 100%);
}
/* ⚪ REAL MADRID – bílá/zlatá na tmavé (elegance) */
html[data-theme="real"] {
    --fial: #febe10; --fial-rgb: 254,190,16; --magenta: #ffffff; --magenta-rgb: 255,255,255;
    --gold: #febe10; --gold-rgb: 254,190,16; --dark: #0a1428; --bg-top: #12244a; --text: #ffffff; --text-rgb: 255,255,255;
    --card-bg: rgba(255,255,255,.07);
    --bg-klub: linear-gradient(180deg, #e8ecf5 0%, #b8c4dc 10%, #4a5f8a 26%, #1e2f52 48%, #131f3c 72%, #0a1428 100%);
}
/* 🔵🔴 BARCELONA – blaugrana */
html[data-theme="barca"] {
    --fial: #a50044; --fial-rgb: 165,0,68; --magenta: #004d98; --magenta-rgb: 0,77,152;
    --gold: #edbb00; --gold-rgb: 237,187,0; --dark: #0a1836; --bg-top: #004d98; --text: #ffffff; --text-rgb: 255,255,255;
    --card-bg: rgba(255,255,255,.07);
    --bg-klub: linear-gradient(180deg, #004d98 0%, #043a73 28%, #5a0730 60%, #7a0038 85%, #5a0028 100%);
}
/* 🩵 MAN CITY – nebeská modrá */
html[data-theme="city"] {
    --fial: #6cabdd; --fial-rgb: 108,171,221; --magenta: #1c2c5b; --magenta-rgb: 28,44,91;
    --gold: #ffc659; --gold-rgb: 255,198,89; --dark: #08172e; --bg-top: #16386a; --text: #eaf4ff; --text-rgb: 234,244,255;
    --card-bg: rgba(108,171,221,.1);
    --bg-klub: linear-gradient(180deg, #3a7ab5 0%, #2a6299 25%, #1c4a80 50%, #123458 75%, #0a2648 100%);
}
/* 🔵🔴 PSG – tmavě modrá/červená */
html[data-theme="psg"] {
    --fial: #e30613; --fial-rgb: 227,6,19; --magenta: #004170; --magenta-rgb: 0,65,112;
    --gold: #d4af37; --gold-rgb: 212,175,55; --dark: #04122a; --bg-top: #0a2f5c; --text: #ffffff; --text-rgb: 255,255,255;
    --card-bg: rgba(227,6,19,.07);
    --bg-klub: linear-gradient(180deg, #0a2f5c 0%, #071f3f 32%, #4a0810 64%, #8a0c16 85%, #4a0810 100%);
}
/* 🔴 ARSENAL – červená + výrazná bílá */
html[data-theme="arsenal"] {
    --fial: #ff3b3f; --fial-rgb: 255,59,63; --magenta: #ff8a8d; --magenta-rgb: 255,138,141;
    --gold: #f0c05a; --gold-rgb: 240,192,90; --dark: #180305; --bg-top: #6a0d12; --text: #ffffff; --text-rgb: 255,255,255;
    --card-bg: rgba(255,255,255,.07);
    --bg-klub: linear-gradient(165deg, #6a0d12 0%, #3d060a 52%, #180305 100%);
}
/* Ochrana čitelnosti textů na barevných klubových pozadích */
html[data-theme="real"] .zpet, html[data-theme="real"] .podtitul, html[data-theme="real"] .auth-lista,
html[data-theme="city"] .zpet, html[data-theme="city"] .podtitul, html[data-theme="city"] .auth-lista,
html[data-theme="barca"] .zpet, html[data-theme="barca"] .podtitul, html[data-theme="barca"] .auth-lista,
html[data-theme="psg"] .zpet, html[data-theme="psg"] .podtitul, html[data-theme="psg"] .auth-lista,
html[data-theme="arsenal"] .zpet, html[data-theme="arsenal"] .podtitul, html[data-theme="arsenal"] .auth-lista,
html[data-theme="zlaty"] .zpet, html[data-theme="zlaty"] .podtitul, html[data-theme="zlaty"] .auth-lista {
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
}
/* Ochrana čitelnosti textů na barevných klubových pozadích */
html[data-theme="real"] .zpet, html[data-theme="real"] .podtitul, html[data-theme="real"] .auth-lista,
html[data-theme="city"] .zpet, html[data-theme="city"] .podtitul, html[data-theme="city"] .auth-lista,
html[data-theme="barca"] .zpet, html[data-theme="barca"] .podtitul, html[data-theme="barca"] .auth-lista,
html[data-theme="psg"] .zpet, html[data-theme="psg"] .podtitul, html[data-theme="psg"] .auth-lista,
html[data-theme="arsenal"] .zpet, html[data-theme="arsenal"] .podtitul, html[data-theme="arsenal"] .auth-lista,
html[data-theme="zlaty"] .zpet, html[data-theme="zlaty"] .podtitul, html[data-theme="zlaty"] .auth-lista {
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
}

* { box-sizing: border-box; }
body {
    background: radial-gradient(ellipse at top, var(--bg-top) 0%, var(--dark) 65%);
    color: var(--text); font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 15px; min-height: 100vh; -webkit-tap-highlight-color: transparent;
}
/* Klubové gradienty pozadí + tmavý/světlý přes proměnné */
html[data-theme="zlaty"] body,
html[data-theme="real"] body,
html[data-theme="barca"] body,
html[data-theme="city"] body,
html[data-theme="psg"] body,
html[data-theme="arsenal"] body {
    background: var(--bg-klub) !important;
    background-attachment: fixed;
}
.wrap { max-width: 600px; margin: 0 auto; }
.back { display: block; text-align: center; color: rgba(238,242,255,.45); text-decoration: none; font-size: .75em; margin-bottom: 12px; }
h1 { text-align: center; font-size: 1.15em; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; margin: 6px 0 6px; }
.podtitul { text-align: center; font-size: .72em; opacity: .5; margin-bottom: 18px; letter-spacing: 1px; }

/* ZÁLOŽKY */
.zalozky { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
.zalozka {
    flex: 1 1 auto; min-width: 90px; text-align: center;
    background: rgba(46,107,255,.06); border: 1px solid rgba(46,107,255,.25);
    border-radius: 12px; padding: 10px 8px; cursor: pointer;
    font-size: .74em; font-weight: 800; letter-spacing: .5px; color: #aeb9d8;
    transition: all .18s; user-select: none;
}
.zalozka:hover { border-color: rgba(46,107,255,.5); }
.zalozka.on { background: rgba(212,175,55,.14); border-color: var(--gold); color: var(--gold); }

/* BANK BOX (jen u Celkově) */
.bank-box {
    background: rgba(212,175,55,.08); border: 1px solid rgba(212,175,55,.4);
    border-radius: 18px; padding: 18px 16px; margin-bottom: 20px; text-align: center;
}
.bank-box .castka { font-size: 2em; font-weight: 900; color: var(--gold); margin: 2px 0; }
.bank-box .pozn { font-size: .7em; opacity: .55; margin-bottom: 10px; }
.bank-box .medaile { display: flex; justify-content: center; gap: 20px; font-size: .82em; font-weight: 800; flex-wrap: wrap; }

/* BLOK ŽEBŘÍČKU */
.blok {
    background: rgba(46,107,255,.04); border: 1px solid rgba(46,107,255,.22);
    border-radius: 22px; padding: 20px 14px; margin-bottom: 22px;
}
.blok h2 {
    text-align: center; font-size: .9em; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--fial); margin: 0 0 16px;
}
.blok.celkem { border-color: rgba(212,175,55,.45); }
.blok.celkem h2 { color: var(--gold); }

.radek {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 16px; margin-bottom: 6px;
    border-bottom: 1px solid rgba(255,255,255,.04);
    transition: transform .22s, background .22s, box-shadow .22s;
}
.radek:hover {
    transform: translateX(4px);
    background: rgba(46,107,255,.1);
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
}
@media (prefers-reduced-motion: reduce) { .radek { transition: none; } .radek:hover { transform: none; } }
.radek .poradi { min-width: 48px; font-weight: 900; font-size: 1.05em; opacity: .85; }
.radek .telo { flex: 1; min-width: 0; }
.radek .jmeno { font-weight: 800; font-size: 1em; cursor: pointer; text-decoration: underline; text-decoration-color: rgba(46,107,255,.35); text-underline-offset: 3px; }
.radek .jmeno:hover { color: var(--fial); }
.radek .sub { font-size: .68em; color: #7d89ad; margin-top: 4px; letter-spacing: .3px; }
.radek .hodnota { font-weight: 900; font-size: 1.15em; white-space: nowrap; }
.radek .hodnota small { font-size: .55em; opacity: .5; font-weight: 700; margin-left: 2px; }
.radek.r1 { background: linear-gradient(90deg, rgba(212,175,55,.22), rgba(212,175,55,.05)); }
.radek.r1 .poradi { color: #ffd75e; }
.radek.r2 { background: linear-gradient(90deg, rgba(148,163,184,.2), rgba(148,163,184,.04)); }
.radek.r2 .poradi { color: var(--text); opacity: .6; }
.radek.r3 { background: linear-gradient(90deg, rgba(180,100,40,.2), rgba(180,100,40,.04)); }
.radek.r3 .poradi { color: #e8965a; }
.prazdno { text-align: center; opacity: .45; padding: 20px 0; font-size: .85em; }
.mini { display: inline-flex; align-items: center; gap: 3px; background: rgba(255,255,255,.07); border-radius: 6px; padding: 1px 7px; margin-right: 6px; }

html[data-theme="real"] .back { text-shadow: 0 1px 3px rgba(255,255,255,.7); color: rgba(18,36,74,.7) !important; }
html[data-theme="arsenal"] .back { text-shadow: 0 1px 4px rgba(0,0,0,.5); color: rgba(255,200,201,.9) !important; }
html[data-theme="city"] .back, html[data-theme="city"] .zpet { text-shadow: 0 1px 3px rgba(0,0,0,.5); }

/* Pódium stupně vítězů */
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 8px; margin-bottom: 18px; }
.podium .p { text-align: center; flex: 1; max-width: 130px; }
.podium .medal { font-size: 28px; margin-bottom: 4px; }
.podium .p.mid .medal { font-size: 36px; }
.podium .jm { font-size: 13px; font-weight: 800; margin-bottom: 3px; cursor: pointer; }
.podium .jm:hover { text-decoration: underline; }
.podium .b { font-size: 16px; font-weight: 900; margin-bottom: 6px; }
.podium .b small { font-size: 9px; opacity: .6; font-weight: 700; }
.podium .schod { border-radius: 8px 8px 0 0; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: rgba(255,255,255,.4); }
.rozdelovac { display: flex; align-items: center; gap: 10px; margin: 14px 4px 10px; }
.rozdelovac .cara { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(212,175,55,.2), transparent); }
.rozdelovac .lbl { font-size: 9px; color: rgba(212,175,55,.4); letter-spacing: 2px; text-transform: uppercase; font-weight: 700; white-space: nowrap; }

/* 🔴⚪ SLAVIA PRAHA – červeno-bílá */
html[data-theme="slavia"] {
    --fial: #ffffff; --fial-rgb: 255,255,255; --magenta: #ff9a9d; --magenta-rgb: 255,154,157;
    --gold: #ffd9a0; --gold-rgb: 255,217,160; --dark: #4a080c; --bg-top: #c8121a; --text: #ffffff; --text-rgb: 255,255,255;
    --card-bg: rgba(255,255,255,.08);
    --bg-klub: linear-gradient(160deg, #e0141c 0%, #b30f16 38%, #7a0a10 70%, #4a080c 100%);
}
html[data-theme="slavia"] body { background: var(--bg-klub) !important; background-attachment: fixed; text-shadow: 0 1px 3px rgba(90,0,4,.6); }
html[data-theme="slavia"] h1 { color: #ffffff; -webkit-text-fill-color: #ffffff; text-shadow: 0 0 12px rgba(120,10,15,.9), 0 2px 6px rgba(0,0,0,.6), 0 0 3px rgba(120,10,15,1); }
html[data-theme="slavia"] .zpet, html[data-theme="slavia"] .back { text-shadow: 0 1px 4px rgba(0,0,0,.5); color: rgba(255,210,211,.9) !important; }

/* 🔵 CHELSEA – královská modrá */
html[data-theme="chelsea"] {
    --fial: #6a9fd8; --fial-rgb: 106,159,216; --magenta: #ffffff; --magenta-rgb: 255,255,255;
    --gold: #ffd700; --gold-rgb: 255,215,0; --dark: #030f26; --bg-top: #0a3a80; --text: #eaf2ff; --text-rgb: 234,242,255;
    --card-bg: rgba(106,159,216,.1);
    --bg-klub: linear-gradient(180deg, #0a52b5 0%, #084298 25%, #063372 50%, #04214d 75%, #030f26 100%);
}
/* 🟡 DORTMUND – žluto-černá */
html[data-theme="dortmund"] {
    --fial: #fde100; --fial-rgb: 253,225,0; --magenta: #fde100; --magenta-rgb: 253,225,0;
    --gold: #fde100; --gold-rgb: 253,225,0; --dark: #0a0a0a; --bg-top: #1a1a1a; --text: #ffffff; --text-rgb: 255,255,255;
    --card-bg: rgba(253,225,0,.08);
    --bg-klub: linear-gradient(180deg, #2a2a1a 0%, #1a1a10 30%, #121208 55%, #0a0a05 100%);
}
html[data-theme="chelsea"] body,
html[data-theme="dortmund"] body {
    background: var(--bg-klub) !important; background-attachment: fixed;
}
html[data-theme="dortmund"] h1 { color: #fde100; -webkit-text-fill-color: #fde100; text-shadow: 0 0 14px rgba(253,225,0,.4), 0 2px 6px rgba(0,0,0,.6); }

.legenda-tag { background:linear-gradient(135deg,#ffe9a8,#f0c359); color:#3a2a06; font-size:.6em; font-weight:900; padding:2px 8px; border-radius:100px; letter-spacing:.5px; vertical-align:middle; margin-left:5px; box-shadow:0 1px 6px rgba(240,195,89,.5); white-space:nowrap; }
.radek.legenda { background: linear-gradient(90deg, rgba(240,195,89,.16), rgba(240,195,89,.02) 70%) !important; border-color: rgba(240,195,89,.55) !important; }
".vyvoj-wrap { padding: 4px; }
.vyvoj-svg { width: 100%; height: auto; display: block; }
.vyvoj-legenda { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; margin-top: 12px; }
.vyvoj-leg { font-size: .74em; display: flex; align-items: center; gap: 5px; color: var(--text); }
.vyvoj-leg i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
.vyvoj-leg b { color: var(--gold); }
.vyvoj-leg { cursor: pointer; user-select: none; padding: 2px 4px; border-radius: 6px; }
.vyvoj-leg:hover { background: rgba(255,255,255,.06); }
.vyvoj-leg.off { opacity: .38; text-decoration: line-through; }
.vyvoj-ovladace { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
.vyvoj-ovladace button { font-size: .72em; padding: 5px 14px; border-radius: 100px; border: 1px solid var(--card-border); background: rgba(255,255,255,.05); color: var(--text); cursor: pointer; font-family: inherit; }
.vyvoj-ovladace button:hover { border-color: var(--gold); }
.jok-tab { border: 1px solid var(--card-border); border-radius: 12px; overflow: hidden; }
.jok-head, .jok-row { display: grid; grid-template-columns: 1fr 64px 56px 90px; align-items: center; padding: 9px 12px; font-size: .85em; }
.jok-head { background: rgba(255,255,255,.06); font-weight: 800; font-size: .62rem; letter-spacing: 1px; text-transform: uppercase; color: #9fb4dd; }
.jok-head span:not(:first-child), .jok-row span:not(:first-child) { text-align: center; }
.jok-row { border-top: 1px solid rgba(255,255,255,.05); }
.jok-jm { font-weight: 700; }
.jok-b { color: var(--gold); font-weight: 900; }
.karta-kola-btn { display:block; margin:4px auto 16px; background:linear-gradient(120deg,var(--gold),#e0a63e); color:#1a1206; border:none; padding:11px 24px; border-radius:100px; font-weight:800; font-size:.88em; cursor:pointer; font-family:inherit; box-shadow:0 4px 16px rgba(240,195,89,.3); }
.karta-kola-btn:hover { transform:translateY(-1px); }
</style>
<script>
(function(){ try { var t=localStorage.getItem('cl_theme')||'tmavy'; if(t!=='tmavy') document.documentElement.setAttribute('data-theme',t); } catch(e){} })();
</script>
<script>
const KLUB_LOGA = {
     tmavy: 'trophy.png',
    svetly: 'trophy.png',
    zlaty: 'trophy.png',
    real: 'https://crests.football-data.org/86.png',
    barca: 'https://crests.football-data.org/81.png',
    city: 'https://crests.football-data.org/65.png',
    psg: 'https://crests.football-data.org/524.png',
    arsenal: 'https://crests.football-data.org/57.png',
    slavia: 'https://crests.football-data.org/930.png',
    chelsea: 'https://crests.football-data.org/61.png',
    dortmund: 'https://crests.football-data.org/4.png'
};
function zobrazKlubOdznak(t) {
    var vz = document.getElementById('klubVodoznak');
    if (vz) { if (KLUB_LOGA[t]) { vz.src = KLUB_LOGA[t]; vz.style.display = 'block'; } else { vz.style.display = 'none'; } }
    var el = document.getElementById('klubOdznak');
    if (!el) return;
    el.style.display = "none";
}
document.addEventListener('DOMContentLoaded',function(){ var t=(function(){try{return localStorage.getItem('cl_theme')||'tmavy';}catch(e){return 'tmavy';}})(); zobrazKlubOdznak(t); });
</script>
</head>
<body>
<img id="klubVodoznak" src="" alt="" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:0; width:75vw; max-width:420px; height:auto; object-fit:contain; opacity:.10; pointer-events:none;">
<img id="klubOdznak" src="" alt="" style="display:none; position:fixed; top:10px; left:12px; z-index:10000; width:64px; height:64px; object-fit:contain; filter:drop-shadow(0 2px 8px rgba(0,0,0,.55));">
<div id="themeSwitch" style="position:fixed; top:12px; right:12px; z-index:10000;">
    <button onclick="prepniThemePanel()" style="background:rgba(var(--fial-rgb),.12); border:1px solid rgba(var(--fial-rgb),.45); color:var(--text); width:42px; height:42px; border-radius:50%; cursor:pointer; font-size:1.2em; backdrop-filter:blur(6px);" title="Změnit vzhled">🎨</button>
    <div id="themePanel" style="display:none; position:absolute; top:50px; right:0; background:var(--dark); border:1px solid rgba(var(--fial-rgb),.45); border-radius:14px; padding:8px; min-width:180px; max-height:60vh; overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,.5);">
        <button class="theme-opt" onclick="nastavTheme('tmavy')">🌙 Tmavý</button>
        <button class="theme-opt" onclick="nastavTheme('svetly')">☀️ Světlý</button>
        <button class="theme-opt" onclick="nastavTheme('zlaty')">🏆 Zlatý</button>
        <button class="theme-opt" onclick="nastavTheme('real')">⚪ Real Madrid</button>
        <button class="theme-opt" onclick="nastavTheme('barca')">🔵 Barcelona</button>
        <button class="theme-opt" onclick="nastavTheme('city')">🩵 Man City</button>
        <button class="theme-opt" onclick="nastavTheme('psg')">🔴 PSG</button>
        <button class="theme-opt" onclick="nastavTheme('arsenal')">🔴 Arsenal</button>
        <button class="theme-opt" onclick="nastavTheme('slavia')">🔴 Slavia Praha</button>
        <button class="theme-opt" onclick="nastavTheme('chelsea')">🔵 Chelsea</button>
        <button class="theme-opt" onclick="nastavTheme('dortmund')">🟡 Dortmund</button>
    </div>
</div>
<style>
    .theme-opt { display:block; width:100%; text-align:left; background:none; border:none; color:var(--text); padding:10px 12px; border-radius:8px; cursor:pointer; font-size:.9em; font-family:inherit; }
    .theme-opt:hover { background:rgba(var(--fial-rgb),.12); }
    .theme-opt.on { background:rgba(var(--fial-rgb),.2); color:var(--fial); font-weight:800; }
</style>
<script>
const CL_THEMES = ['tmavy','svetly','zlaty','real','barca','city','psg','arsenal','slavia','chelsea','dortmund'];
function nastavTheme(t){ try{ localStorage.setItem('cl_theme',t); }catch(e){}
    if(t==='tmavy') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t);
    document.querySelectorAll('.theme-opt').forEach((b,i)=>b.classList.toggle('on', CL_THEMES[i]===t));
    document.getElementById('themePanel').style.display='none';
    zobrazKlubOdznak(t);
}

function vyvojInner() {

    const nX = kola.length;
    const px = i => padL + (nX === 1 ? (W - padL - padR) / 2 : (i / (nX - 1)) * (W - padL - padR));
    const py = v => padT + (1 - v / maxY) * (H - padT - padB);

// Efekt: čísla v žebříčku „naskočí" od nuly k cílové hodnotě
function animujCisla() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.querySelectorAll('#obsah .hodnota').forEach(el => {
        const html = el.innerHTML;
        const m = html.match(/^(\d+)/);           // číslo na začátku (např. "42 b." / "5×")
        if (!m) return;
        const cil = parseInt(m[1]);
        if (cil <= 0) return;
        const zbytek = html.slice(m[1].length);   // "<small> b.</small>" apod.
        const kroku = 22;
        let i = 0;
        const iv = setInterval(() => {
            i++;
            const val = Math.round(cil * i / kroku);
            el.innerHTML = val + zbytek;
            if (i >= kroku) clearInterval(iv);
        }, 28);
    });
}

    _vsichniHraci = hraci;

    const ja = hraci.find(h => h.user_id === mojeId);

    const radekS = (label, maJa, maRival, jednotka = '') => {
        const jaLepsi = maJa > maRival, rivalLepsi = maRival > maJa;
        return `<div style="display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06);">
            <div style="flex:1; text-align:right; font-weight:800; color:${jaLepsi ? 'var(--fial)' : 'var(--text)'};">${maJa}${jednotka}</div>
            <div style="width:92px; text-align:center; font-size:.62em; opacity:.55; text-transform:uppercase; letter-spacing:1px;">${label}</div>
            <div style="flex:1; text-align:left; font-weight:800; color:${rivalLepsi ? '#e74c3c' : 'var(--text)'};">${maRival}${jednotka}</div>
        </div>`;
    };
    const vedu = ja.celkem > rival.celkem, prohravam = ja.celkem < rival.celkem;
    const stav = vedu ? '<span style="color:var(--fial);">Vedeš! 🔥</span>'
               : prohravam ? '<span style="color:#e74c3c;">Prohráváš 😤</span>'
               : '<span style="opacity:.7;">Nerozhodně 🤝</span>';
    return `
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
            <div style="flex:1; text-align:right; font-weight:900;">${avatarProUid(ja.user_id)}${ja.jmeno} <span style="font-size:.7em; opacity:.5;">(ty)</span></div>
            <div style="font-size:1.1em;">⚔️</div>
            <div style="flex:1; text-align:left; font-weight:900;">${avatarProUid(rival.user_id)}${rival.jmeno}</div>
        </div>
        <div style="text-align:center; font-size:.85em; margin-bottom:10px;">${stav}</div>
        ${radekS('Celkem bodů', ja.celkem, rival.celkem)}
        ${radekS('Přesných', ja.skore, rival.skore)}
        ${radekS('Trendů', ja.trendy, rival.trendy)}
        ${radekS('Dlouhodobky', ja.dlBody, rival.dlBody)}
        <div style="text-align:center; margin-top:12px;">
            <button onclick="zmenRivala()" style="background:none; border:1px solid rgba(255,255,255,.2); color:var(--text); opacity:.7; padding:7px 16px; border-radius:100px; cursor:pointer; font-size:.8em;">Změnit rivala</button>
        </div>`;
}

function vyberRivalaHTML(ja, hraci) {
    const soupeci = hraci.filter(h => h.user_id !== ja.user_id && (h.tipu > 0 || h.celkem > 0 || (window._dlUsers && window._dlUsers.has(h.user_id))));
    if (!soupeci.length) return '<div class="prazdno">Zatím nemáš koho vyzvat.</div>';
    return `
        <div style="text-align:center; font-size:.82em; opacity:.7; margin-bottom:12px;">Vyber si rivala a sleduj, kdo z vás je lepší. Můžeš ho kdykoliv změnit.</div>
        <div style="display:flex; flex-direction:column; gap:6px;">
            ${soupeci.map(h => `
                <button onclick="ulozRivala('${h.user_id}')" style="display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); color:var(--text); padding:11px 14px; border-radius:12px; cursor:pointer; font-size:.9em;">
                    <span style="font-weight:700;">${avatarProUid(h.user_id)}${h.jmeno}</span>
                    <span style="opacity:.6; font-size:.85em;">${h.celkem} b.</span>
                </button>`).join('')}
        </div>`;
}

async function ulozRivala(rivalId) {
    const { data: { session } } = await sb.auth.getSession();
    const mojeId = session?.user?.id;
    if (!mojeId) return;
    const { error } = await sb.from('hraci').update({ rival_id: rivalId }).eq('user_id', mojeId);
    if (error) { alert('Nepodařilo se uložit: ' + error.message); return; }
    await nactiRivaly(_vsichniHraci);
}

async function zmenRivala() {
    const { data: { session } } = await sb.auth.getSession();
    const mojeId = session?.user?.id;
    if (!mojeId) return;
    await sb.from('hraci').update({ rival_id: null }).eq('user_id', mojeId);
    await nactiRivaly(_vsichniHraci);
}

async function load() {
    const [zR, tR, dR, avR] = await Promise.all([
        sb.from('cl_zapasy').select('*'),
        sb.from('cl_tipy_zapasy').select('*'),
        sb.from('cl_dlouhodobe').select('*'),
        sb.from('hraci').select('user_id, avatar')
    ]);
    window._avatary = {};
    (avR?.data || []).forEach(h => { if (h.avatar) window._avatary[h.user_id] = h.avatar; });
    stats = spocitejStatistikyCL(zR.data || [], tR.data || [], dR.data || []);
    window._zapasyRaw = zR.data || []; window._tipyRaw = tR.data || [];
    window._dlUsers = new Set((dR.data || []).map(d => d.user_id)); // hráči s dlouhodobkou (i s 0 body)
    const paid = (dR.data || []).filter(d => d.zaplaceno).length;
    bank = paid * STARTOVNE;
    prepni('celkem');
}
load();
</script>

<script>
// Načti viditelnost vodoznaku z cl_stav a aplikuj (nastavená adminem, platí všude)
