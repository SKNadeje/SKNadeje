<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NADĚJE · CL Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root { --fial: #a78bfa; --dark: #14101f; --card-bg: rgba(255,255,255,.05); --gold: #d4af37; --green: #27ae60; --red: #c0392b; }
* { box-sizing: border-box; }
body { background: var(--dark); color: #fff; font-family: 'Segoe UI', Roboto, Arial, sans-serif; margin: 0; padding: 15px; min-height: 100vh; }
.wrap { max-width: 640px; margin: 0 auto; }
.zpet { display: inline-block; color: rgba(255,255,255,.45); text-decoration: none; font-size: .72em; margin: 4px 0 10px; }
h1 { font-size: 1.2em; font-weight: 900; color: var(--fial); letter-spacing: 2px; text-transform: uppercase; }
h2 { font-size: .85em; color: var(--gold); letter-spacing: 1.5px; text-transform: uppercase; margin: 0 0 12px; }
.karta { background: var(--card-bg); border: 1px solid rgba(167,139,250,.25); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
.pole { width: 100%; background: rgba(10,6,20,.6); color: #fff; border: 1px solid rgba(167,139,250,.3); border-radius: 10px; padding: 11px; font-size: .9em; font-family: inherit; outline: none; margin-bottom: 10px; }
textarea.pole { min-height: 90px; resize: vertical; }
.btn { background: linear-gradient(135deg, #a78bfa, #6d4fc4); color: #0e0a18; border: none; border-radius: 11px; padding: 12px 18px; font-weight: 900; font-size: .78em; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; font-family: inherit; }
.btn-gold { background: linear-gradient(135deg, #d4af37, #9a7b1e); }
.btn-red { background: var(--red); color: #fff; }
.btn-mini { padding: 6px 12px; font-size: .68em; border-radius: 8px; }
.zapas-row { border-bottom: 1px solid rgba(255,255,255,.08); padding: 11px 0; font-size: .85em; }
.msg { display: none; position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; font-weight: 900; padding: 12px 22px; border-radius: 100px; z-index: 2000; font-size: .8em; }
.dl-radek { border-bottom: 1px solid rgba(255,255,255,.08); padding: 10px 0; font-size: .8em; }
.nezmocnen { text-align: center; padding: 60px 20px; opacity: .6; }
.flexrow { display: flex; gap: 10px; }
.flexrow .pole { flex: 1; }
label.lbl { display: block; font-size: .62em; letter-spacing: 1.5px; text-transform: uppercase; opacity: .55; font-weight: 800; margin-bottom: 5px; }
.chipy { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chipy .ch {
    font-size: .74em; font-weight: 700; padding: 7px 12px;
    border: 1px solid rgba(167,139,250,.3); border-radius: 100px;
    cursor: pointer; user-select: none; transition: all .15s; opacity: .75; color: #fff;
}
.chipy .ch.on { background: rgba(212,175,55,.2); border-color: var(--gold); color: var(--gold); opacity: 1; }
.pocitadlo { font-size: .68em; opacity: .55; margin-bottom: 8px; }
.par-radek { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.par-radek .pole { margin-bottom: 0; }
.par-radek span { opacity: .4; font-size: .8em; flex-shrink: 0; }
select.pole { color-scheme: dark; }
select.pole option { background: #14101f; color: #fff; }
</style>
</head>
<body>
<div class="wrap">
    <a class="zpet" href="index.html">← Zpět na tipy</a>
    <h1>⚙️ CL Admin</h1>
    <div id="obsah" class="nezmocnen">Ověřuji oprávnění…</div>
</div>
<div class="msg" id="msg"></div>

<script>
const SB_URL = "https://vlabocwezmpwnxrwxihs.supabase.co";
const SB_KEY = "sb_publishable_H9egZ3Rrq5LYi02NxpvjCQ_xDXOQP4X";
const sb = supabase.createClient(SB_URL, SB_KEY);
const ADMIN_ID = "92a1e51b-e03c-48d7-99df-76c2f60a455f";
const BODY = { presne: 5, trend: 1, top8: 3, vitezZC: 8, propadlik: 2, qf: 2, sf: 4, finale: 6, vitezCL: 10 };

let stav = {};

function msg(t, err) {
    const el = document.getElementById('msg');
    el.textContent = t;
    el.style.background = err ? 'var(--red)' : 'var(--green)';
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3500);
}

async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session || session.user.id !== ADMIN_ID) {
        document.getElementById('obsah').innerHTML = 'Přístup jen pro admina.<br><br><a href="../welcome.html" style="color:var(--fial);">→ Přihlásit</a>';
        return;
    }
    document.getElementById('obsah').className = '';
    document.getElementById('obsah').innerHTML = `
        <div class="karta">
            <h2>➕ Vypsat zápas k tipování</h2>
            <div class="flexrow">
                <select class="pole" id="n-domaci"><option value="">– domácí –</option></select>
                <select class="pole" id="n-hoste"><option value="">– hosté –</option></select>
            </div>
            <div class="flexrow">
                <select class="pole" id="n-faze">
                    <option value="ZC">Základní část</option>
                    <option value="PO">Play-off (únor)</option>
                    <option value="OSM">Osmifinále</option>
                    <option value="QF">Čtvrtfinále</option>
                    <option value="SF">Semifinále</option>
                    <option value="FINALE">Finále</option>
                </select>
                <input class="pole" id="n-deadline" type="datetime-local">
            </div>
            <button class="btn" onclick="pridejZapas()">VYPSAT ZÁPAS</button>
        </div>

        <div class="karta">
            <h2>🎯 Aktivní a vyhodnocené zápasy</h2>
            <div id="seznamZapasu">Načítám…</div>
        </div>

        <div class="karta">
            <h2>🏟️ Účastníci ligové fáze (36 týmů)</h2>
            <label class="lbl">Jeden tým na řádek – po srpnovém losu</label>
            <textarea class="pole" id="t-tymy" placeholder="Real Madrid&#10;Manchester City&#10;Bayern Mnichov&#10;…"></textarea>
            <label class="lbl">Uzávěrka dlouhodobky 1 (před 1. kolem)</label>
            <input class="pole" id="t-dl1" type="datetime-local">
            <button class="btn" onclick="ulozTymy()">ULOŽIT TÝMY + UZÁVĚRKU</button>
        </div>

        <div class="karta">
            <h2>🥊 Páry osmifinále (pavouk) – otevře dlouhodobku 2</h2>
            <label class="lbl">8 párů – po únorovém losu</label>
            <div id="r16-pary"></div>
            <label class="lbl">Uzávěrka dlouhodobky 2 (před osmifinále)</label>
            <input class="pole" id="t-dl2" type="datetime-local">
            <button class="btn" onclick="ulozR16()">ULOŽIT PÁRY + UZÁVĚRKU</button>
        </div>

        <div class="karta">
            <h2>🏁 Vyhodnocení dlouhodobky 1 (po základní části)</h2>
            <label class="lbl">Skutečné top 8 tabulky</label>
            <div class="pocitadlo" id="poc-vtop8">0 / 8</div>
            <div class="chipy" id="v-top8"></div>
            <label class="lbl">Vítěz základní části</label>
            <select class="pole" id="v-vitezZC"><option value="">– vyber –</option></select>
            <label class="lbl">Skuteční propadlíci – místa 25–36</label>
            <div class="pocitadlo" id="poc-vprop">0 / 12</div>
            <div class="chipy" id="v-prop"></div>
            <button class="btn btn-gold" onclick="vyhodnotDl1()">SPOČÍTAT BODY DLOUHODOBKY 1</button>
        </div>

        <div class="karta">
            <h2>🏆 Vyhodnocení dlouhodobky 2 (postupně jak se hraje)</h2>
            <label class="lbl">Skuteční čtvrtfinalisté (vítězové osmifinále) – vyber 8 ze 16</label>
            <div class="pocitadlo" id="poc-vqf">0 / 8</div>
            <div class="chipy" id="v-qf"></div>
            <label class="lbl">Semifinalisté – vyber 4 ze zvolených čtvrtfinalistů</label>
            <div class="pocitadlo" id="poc-vsf">0 / 4</div>
            <div class="chipy" id="v-sf"></div>
            <label class="lbl">Finalisté – vyber 2 ze zvolených semifinalistů</label>
            <div class="pocitadlo" id="poc-vfin">0 / 2</div>
            <div class="chipy" id="v-fin"></div>
            <label class="lbl">Vítěz CL – vyber z finalistů</label>
            <select class="pole" id="v-vitez"><option value="">– vyber –</option></select>
            <button class="btn btn-gold" onclick="vyhodnotDl2()">SPOČÍTAT BODY DLOUHODOBKY 2</button>
        </div>

        <div class="karta">
            <h2>💰 Startovné (200 Kč)</h2>
            <div id="seznamDl">Načítám…</div>
        </div>

        <div class="karta" style="border-color:rgba(239,68,68,.35);">
            <h2 style="color:#ff8a7a;">🧪 Testovací data</h2>
            <p style="font-size:.72em; opacity:.6; margin-top:-6px;">Vloží ukázkové týmy, zápasy a tipy – tvůj reálný tip + 5 čistě fiktivních postav (žádné skutečné účty, jen testovací záznamy v DB).</p>
            <button class="btn" onclick="vlozTestData()">➕ VLOŽIT TESTOVACÍ DATA</button>
            <button class="btn btn-red" style="margin-top:8px;" onclick="smazTestData()">🗑 SMAZAT VŠECHNA CL DATA (RESET)</button>
        </div>`;
    await nactiStav();
    await nactiZapasy();
    await nactiDlouhodobe();
}

/* ---------- TESTOVACÍ DATA ---------- */
const TEST_TYMY = [
    "Real Madrid","Barcelona","Atlético Madrid","Athletic Bilbao",
    "Manchester City","Liverpool","Arsenal","Chelsea","Aston Villa","Newcastle",
    "Bayern Mnichov","Leverkusen","Dortmund","RB Lipsko","Stuttgart",
    "Inter Milán","AC Milán","Juventus","Atalanta","Boloňa",
    "PSG","Monako","Brest","Lille",
    "Sporting CP","Benfica","Porto",
    "Feyenoord","PSV Eindhoven","Ajax",
    "Celtic","Club Bruggy",
    "Slavia Praha","Sparta Praha",
    "Galatasaray","Crvena zvezda"
];

const FIKTIVNI_JMENA = ['Fantom Fanda', 'Bety Bystrá', 'Karel Kanonýr', 'Nikola Nadějná', 'Ropák Robin'];

async function vlozTestData() {
    if (!confirm('Vložit testovací data (36 týmů + 4 zápasy + tvůj tip + 5 čistě fiktivních tipérů)?')) return;
    try {
        // 1) Týmy + deadline dlouhodobky 1
        const dl1 = new Date(Date.now() + 7 * 86400000).toISOString();
        await sb.from('cl_stav').upsert({ id: 1, tymy: TEST_TYMY, deadline_tip1: dl1 });

        // 2) Testovací zápasy (různé stavy: otevřený, brzy uzavřený, uzavřený bez výsledku, vyhodnocený)
        const zitra = new Date(Date.now() + 3 * 86400000).toISOString();
        const zaTydny = new Date(Date.now() + 5 * 86400000).toISOString();
        const vcera = new Date(Date.now() - 86400000).toISOString();

        const { data: novy1 } = await sb.from('cl_zapasy').insert({ domaci: 'Slavia Praha', hoste: 'Real Madrid', faze: 'ZC', deadline: zitra }).select().single();
        const { data: novy2 } = await sb.from('cl_zapasy').insert({ domaci: 'Manchester City', hoste: 'Bayern Mnichov', faze: 'ZC', deadline: zaTydny }).select().single();
        const { data: novy3 } = await sb.from('cl_zapasy').insert({ domaci: 'Inter Milán', hoste: 'Arsenal', faze: 'ZC', deadline: vcera }).select().single();
        const { data: novy4 } = await sb.from('cl_zapasy').insert({
            domaci: 'Sparta Praha', hoste: 'Barcelona', faze: 'ZC', deadline: vcera,
            status: 'vyhodnoceno', vysledek_d: 0, vysledek_h: 0
        }).select().single();

        // 3) Tvůj vlastní (reálný) tip
        const { data: { session } } = await sb.auth.getSession();
        const vsichniTiperi = [];
        if (session) {
            const { data: h } = await sb.from('hraci').select('jmeno').eq('user_id', session.user.id).maybeSingle();
            vsichniTiperi.push({ user_id: session.user.id, jmeno: (h?.jmeno || session.user.email.split('@')[0]) + ' (ty)' });
        }

        // 4) Čistě fiktivní tipéři – náhodné ID, žádný reálný účet (FK vazba je zrušená)
        FIKTIVNI_JMENA.forEach(jmeno => {
            vsichniTiperi.push({ user_id: crypto.randomUUID(), jmeno: `🎭 ${jmeno}` });
        });

        // Varianty tipů na zápasy – různé skóre, ať je co srovnávat na žebříčku/barometru
        const varianty = ['1:4', '2:2', '1:1', '3:1', '0:2', '2:0'];
        const zapasyProTip = [novy1, novy2, novy3].filter(Boolean);
        const tipyNaVlozeni = [];
        vsichniTiperi.forEach((t, i) => {
            zapasyProTip.forEach((z, zi) => {
                tipyNaVlozeni.push({ zapas_id: z.id, user_id: t.user_id, jmeno: t.jmeno, skore: varianty[(i + zi) % varianty.length] });
            });
            // všichni mají tip i na vyhodnocený zápas – někdo trefí 0:0, někdo ne
            if (novy4) tipyNaVlozeni.push({ zapas_id: novy4.id, user_id: t.user_id, jmeno: t.jmeno, skore: i % 2 === 0 ? '0:0' : '1:0', body: i % 2 === 0 ? 5 : 0 });
        });
        if (tipyNaVlozeni.length) {
            const { error: e1 } = await sb.from('cl_tipy_zapasy').insert(tipyNaVlozeni);
            if (e1) throw new Error('tipy: ' + e1.message);
        }

        // Dlouhodobé tipy – variace výběru z TEST_TYMY, ať je vidět rozdílné pokrytí top 8 / propadlíků
        const dlTipyNaVlozeni = vsichniTiperi.map((t, i) => ({
            user_id: t.user_id, jmeno: t.jmeno,
            tip1: {
                top8: TEST_TYMY.slice(i, i + 8),
                vitezZC: TEST_TYMY[i],
                propadlici: TEST_TYMY.slice(-12 - i, TEST_TYMY.length - i)
            },
            zaplaceno: i % 2 === 0
        }));
        if (dlTipyNaVlozeni.length) {
            const { error: e2 } = await sb.from('cl_dlouhodobe').insert(dlTipyNaVlozeni);
            if (e2) throw new Error('dlouhodobé: ' + e2.message);
        }

        msg(`✅ Testovací data vložena (ty + ${FIKTIVNI_JMENA.length} fiktivních tipérů)!`);
        await nactiStav(); await nactiZapasy();
    } catch (e) {
        msg('Chyba: ' + e.message, true);
    }
}

async function smazTestData() {
    if (!confirm('POZOR: Smaže úplně všechna CL data (zápasy, tipy, dlouhodobky, seznam týmů). Nevratné. Pokračovat?')) return;
    if (!confirm('Fakt jistě? Tohle smaže i ostrá data, pokud už nějaká jsou.')) return;
    try {
        await sb.from('cl_zapasy').delete().neq('id', 0);          // kaskádou smaže i cl_tipy_zapasy
        await sb.from('cl_dlouhodobe').delete().neq('user_id', '00000000-0000-0000-0000-000000000000');
        await sb.from('cl_stav').update({
            tymy: [], osmifinaliste: [], deadline_tip1: null, deadline_tip2: null, vysledky: {}
        }).eq('id', 1);
        msg('🗑 Vše smazáno.');
        location.reload();
    } catch (e) {
        msg('Chyba: ' + e.message, true);
    }
}

async function nactiStav() {
    const { data } = await sb.from('cl_stav').select('*').eq('id', 1).maybeSingle();
    stav = data || {};
    if ((stav.tymy || []).length) document.getElementById('t-tymy').value = stav.tymy.join('\n');
    const toLocal = (iso) => iso ? new Date(new Date(iso).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : '';
    document.getElementById('t-dl1').value = toLocal(stav.deadline_tip1);
    document.getElementById('t-dl2').value = toLocal(stav.deadline_tip2);

    naplnTymSelecty();
    renderR16Pary();
    initVysl1();
    initVysl2();
}

function naplnTymSelecty() {
    const tymy = stav.tymy || [];
    const opt = (sel) => '<option value="">– vyber –</option>' + tymy.map(t => `<option${t === sel ? ' selected' : ''}>${t}</option>`).join('');
    ['n-domaci', 'n-hoste'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = opt('');
    });
}

/* ---------- PÁRY OSMIFINÁLE (výběr ze seznamu, 8 řádků × 2 selecty) ---------- */
function renderR16Pary() {
    const cont = document.getElementById('r16-pary');
    if (!cont) return;
    const tymy = stav.tymy || [];
    const ulozene = stav.bracket_r16 || [];
    const opt = (sel) => '<option value="">–</option>' + tymy.map(t => `<option${t === sel ? ' selected' : ''}>${t}</option>`).join('');
    cont.innerHTML = Array.from({ length: 8 }).map((_, i) => `
        <div class="par-radek">
            <select class="pole" id="r16-a-${i}">${opt(ulozene[i]?.[0] || '')}</select>
            <span>vs</span>
            <select class="pole" id="r16-b-${i}">${opt(ulozene[i]?.[1] || '')}</select>
        </div>`).join('');
}

/* ---------- ZÁPASY ---------- */
async function pridejZapas() {
    const domaci = document.getElementById('n-domaci').value.trim();
    const hoste = document.getElementById('n-hoste').value.trim();
    const faze = document.getElementById('n-faze').value;
    const dl = document.getElementById('n-deadline').value;
    if (!domaci || !hoste || !dl) return msg('Vyplň soupeře i deadline.', true);
    const { error } = await sb.from('cl_zapasy').insert({ domaci, hoste, faze, deadline: new Date(dl).toISOString() });
    if (error) return msg('Chyba: ' + error.message, true);
    document.getElementById('n-domaci').value = '';
    document.getElementById('n-hoste').value = '';
    msg('ZÁPAS VYPSÁN ✅');
    nactiZapasy();
}

async function nactiZapasy() {
    const [{ data: zapasy }, { data: tipy }] = await Promise.all([
        sb.from('cl_zapasy').select('*').order('deadline', { ascending: false }),
        sb.from('cl_tipy_zapasy').select('*')
    ]);
    const tMap = {};
    (tipy || []).forEach(t => (tMap[t.zapas_id] = tMap[t.zapas_id] || []).push(t));
    document.getElementById('seznamZapasu').innerHTML = (zapasy || []).map(z => {
        const tt = tMap[z.id] || [];
        const hotovo = z.status === 'vyhodnoceno';
        return `<div class="zapas-row">
            <b>${z.domaci} vs ${z.hoste}</b> · ${z.faze} · tipů: ${tt.length}
            ${hotovo
                ? ` · <span style="color:var(--green); font-weight:900;">✔ ${z.vysledek_d}:${z.vysledek_h}</span>`
                : ` <div style="margin-top:8px; display:flex; gap:8px; align-items:center;">
                        <input class="pole" style="width:52px; margin:0; text-align:center;" id="vd-${z.id}" placeholder="0" inputmode="numeric">
                        <b>:</b>
                        <input class="pole" style="width:52px; margin:0; text-align:center;" id="vh-${z.id}" placeholder="0" inputmode="numeric">
                        <button class="btn btn-mini btn-gold" onclick="vyhodnotZapas(${z.id})">VYHODNOTIT</button>
                        <button class="btn btn-mini btn-red" onclick="smazZapas(${z.id})">🗑</button>
                    </div>`}
            <div style="font-size:.85em; opacity:.65; margin-top:5px;">${tt.map(t => `• ${t.jmeno}: ${t.skore}${hotovo ? ` (+${t.body})` : ''}`).join('<br>')}</div>
        </div>`;
    }).join('') || '<div style="opacity:.5;">Žádné zápasy.</div>';
}

async function vyhodnotZapas(id) {
    const d = parseInt(document.getElementById('vd-' + id).value);
    const h = parseInt(document.getElementById('vh-' + id).value);
    if (isNaN(d) || isNaN(h)) return msg('Doplň skóre.', true);
    const { data: tipy } = await sb.from('cl_tipy_zapasy').select('*').eq('zapas_id', id);
    for (const t of (tipy || [])) {
        const [td, th] = t.skore.split(':').map(Number);
        const presne = td === d && th === h;
        const trend = (d > h && td > th) || (d < h && td < th) || (d === h && td === th);
        const b = presne ? BODY.presne : (trend ? BODY.trend : 0);
        await sb.from('cl_tipy_zapasy').update({ body: b }).eq('id', t.id);
    }
    await sb.from('cl_zapasy').update({ status: 'vyhodnoceno', vysledek_d: d, vysledek_h: h }).eq('id', id);
    msg('VYHODNOCENO ✅ (' + (tipy || []).length + ' tipů)');
    nactiZapasy();
}

async function smazZapas(id) {
    if (!confirm('Smazat zápas včetně tipů?')) return;
    await sb.from('cl_zapasy').delete().eq('id', id);
    nactiZapasy();
}

/* ---------- STAV / TÝMY ---------- */
const radky = (id) => document.getElementById(id).value.split('\n').map(x => x.trim()).filter(Boolean);

async function ulozTymy() {
    const tymy = radky('t-tymy');
    if (tymy.length !== 36) return msg(`Čekám 36 týmů, máš ${tymy.length}.`, true);
    const dl = document.getElementById('t-dl1').value;
    const { error } = await sb.from('cl_stav').update({
        tymy, deadline_tip1: dl ? new Date(dl).toISOString() : null,
        aktualizovano: new Date().toISOString()
    }).eq('id', 1);
    if (error) return msg('Chyba: ' + error.message, true);
    msg('TÝMY ULOŽENY ✅');
}

async function ulozR16() {
    const pary = [];
    const pouzite = new Set();
    for (let i = 0; i < 8; i++) {
        const a = document.getElementById(`r16-a-${i}`).value;
        const b = document.getElementById(`r16-b-${i}`).value;
        if (!a || !b) return msg(`Vyplň oba týmy v páru č. ${i + 1}.`, true);
        if (a === b) return msg(`Pár č. ${i + 1}: tým nemůže hrát sám proti sobě.`, true);
        if (pouzite.has(a) || pouzite.has(b)) return msg(`Tým se v párech opakuje (pár č. ${i + 1}).`, true);
        pouzite.add(a); pouzite.add(b);
        pary.push([a, b]);
    }
    const dl = document.getElementById('t-dl2').value;
    const { error } = await sb.from('cl_stav').update({
        bracket_r16: pary,
        osmifinaliste: pary.flat(), // zpětná kompatibilita s existující logikou
        deadline_tip2: dl ? new Date(dl).toISOString() : null,
        aktualizovano: new Date().toISOString()
    }).eq('id', 1);
    if (error) return msg('Chyba: ' + error.message, true);
    stav.bracket_r16 = pary;
    msg('PÁRY OSMIFINÁLE ULOŽENY ✅ – dlouhodobka 2 je otevřená');
}

/* ---------- DLOUHODOBKY VYHODNOCENÍ (výběr ze seznamu) ---------- */
const low = (x) => String(x || '').trim().toLowerCase();
const maTym = (list, tym) => (list || []).some(x => low(x) === low(tym));

function chipHtml(elId, pool, vybrane, max, onClick) {
    const el = document.getElementById(elId);
    if (!el) return;
    el.innerHTML = pool.map(t => {
        const on = vybrane.includes(t);
        return `<span class="ch${on ? ' on' : ''}" onclick="${onClick}('${t.replace(/'/g, "\\'")}')">${t}</span>`;
    }).join('') || '<span style="opacity:.4; font-size:.85em;">Zatím žádné týmy k výběru.</span>';
}

/* --- Dlouhodobka 1 --- */
let vysl1 = { top8: [], propadlici: [] };

function initVysl1() {
    const v = stav.vysledky || {};
    vysl1 = { top8: [...(v.top8 || [])], propadlici: [...(v.propadlici || [])] };
    const selVitez = document.getElementById('v-vitezZC');
    if (selVitez) selVitez.innerHTML = '<option value="">– vyber –</option>' + (stav.tymy || []).map(t => `<option${t === v.vitezZC ? ' selected' : ''}>${t}</option>`).join('');
    renderVysl1();
}

function renderVysl1() {
    const tymy = stav.tymy || [];
    chipHtml('v-top8', tymy, vysl1.top8, 8, 'toggleVysl1_top8');
    chipHtml('v-prop', tymy, vysl1.propadlici, 12, 'toggleVysl1_prop');
    document.getElementById('poc-vtop8').textContent = `${vysl1.top8.length} / 8`;
    document.getElementById('poc-vprop').textContent = `${vysl1.propadlici.length} / 12`;
}
function toggleVysl1_top8(tym) { toggle(vysl1.top8, tym, 8); renderVysl1(); }
function toggleVysl1_prop(tym) { toggle(vysl1.propadlici, tym, 12); renderVysl1(); }
function toggle(arr, tym, max) {
    const i = arr.indexOf(tym);
    if (i >= 0) arr.splice(i, 1);
    else if (arr.length < max) arr.push(tym);
}

async function vyhodnotDl1() {
    const top8 = vysl1.top8, prop = vysl1.propadlici;
    const vitezZC = document.getElementById('v-vitezZC').value;
    if (top8.length !== 8 || prop.length !== 12 || !vitezZC) return msg('Vyber přesně 8 do top 8, 12 propadlíků a vítěze ZČ.', true);
    const { data: dl } = await sb.from('cl_dlouhodobe').select('*');
    for (const r of (dl || [])) {
        const t = r.tip1 || {};
        let b = 0;
        (t.top8 || []).forEach(x => { if (maTym(top8, x)) b += BODY.top8; });
        if (low(t.vitezZC) === low(vitezZC)) b += BODY.vitezZC;
        (t.propadlici || []).forEach(x => { if (maTym(prop, x)) b += BODY.propadlik; });
        await sb.from('cl_dlouhodobe').update({ body1: b }).eq('user_id', r.user_id);
    }
    await sb.from('cl_stav').update({
        vysledky: { ...(stav.vysledky || {}), top8, vitezZC, propadlici: prop },
        aktualizovano: new Date().toISOString()
    }).eq('id', 1);
    stav.vysledky = { ...(stav.vysledky || {}), top8, vitezZC, propadlici: prop };
    msg('DLOUHODOBKA 1 SPOČÍTÁNA ✅');
}

/* --- Dlouhodobka 2 (kaskádově z párů osmifinále) --- */
let vysl2 = { qf: [], sf: [], finale: [], vitez: null };

function initVysl2() {
    const v = stav.vysledky || {};
    vysl2 = { qf: [...(v.qf || [])], sf: [...(v.sf || [])], finale: [...(v.finale || [])], vitez: v.vitez || null };
    renderVysl2();
}

function renderVysl2() {
    const poolQf = (stav.bracket_r16 || []).flat();
    chipHtml('v-qf', poolQf, vysl2.qf, 8, 'toggleVysl2_qf');
    chipHtml('v-sf', vysl2.qf, vysl2.sf, 4, 'toggleVysl2_sf');
    chipHtml('v-fin', vysl2.sf, vysl2.finale, 2, 'toggleVysl2_fin');
    document.getElementById('poc-vqf').textContent = `${vysl2.qf.length} / 8`;
    document.getElementById('poc-vsf').textContent = `${vysl2.sf.length} / 4`;
    document.getElementById('poc-vfin').textContent = `${vysl2.finale.length} / 2`;
    const selVitez = document.getElementById('v-vitez');
    if (selVitez) selVitez.innerHTML = '<option value="">– vyber –</option>' + vysl2.finale.map(t => `<option${t === vysl2.vitez ? ' selected' : ''}>${t}</option>`).join('');
    if (!vysl2.finale.includes(vysl2.vitez)) vysl2.vitez = null;
}
function toggleVysl2_qf(tym) { toggle(vysl2.qf, tym, 8); vysl2.sf = vysl2.sf.filter(t => vysl2.qf.includes(t)); vysl2.finale = vysl2.finale.filter(t => vysl2.sf.includes(t)); renderVysl2(); }
function toggleVysl2_sf(tym) { toggle(vysl2.sf, tym, 4); vysl2.finale = vysl2.finale.filter(t => vysl2.sf.includes(t)); renderVysl2(); }
function toggleVysl2_fin(tym) { toggle(vysl2.finale, tym, 2); renderVysl2(); }

async function vyhodnotDl2() {
    const qf = vysl2.qf, sf = vysl2.sf, fin = vysl2.finale;
    const vitez = document.getElementById('v-vitez').value;
    if (qf.length !== 8 || sf.length !== 4 || fin.length !== 2 || !vitez) return msg('Vyber 8 čtvrtfinalistů, 4 semifinalisty, 2 finalisty a vítěze.', true);
    const { data: dl } = await sb.from('cl_dlouhodobe').select('*');
    for (const r of (dl || [])) {
        const t = r.tip2 || {};
        let b = 0;
        (t.qf || []).forEach(x => { if (maTym(qf, x)) b += BODY.qf; });
        (t.sf || []).forEach(x => { if (maTym(sf, x)) b += BODY.sf; });
        (t.finale || []).forEach(x => { if (maTym(fin, x)) b += BODY.finale; });
        if (low(t.vitez) === low(vitez)) b += BODY.vitezCL;
        await sb.from('cl_dlouhodobe').update({ body2: b }).eq('user_id', r.user_id);
    }
    await sb.from('cl_stav').update({
        vysledky: { ...(stav.vysledky || {}), qf, sf, finale: fin, vitez },
        sezona_ukoncena: true,
        aktualizovano: new Date().toISOString()
    }).eq('id', 1);
    stav.vysledky = { ...(stav.vysledky || {}), qf, sf, finale: fin, vitez };
    msg('DLOUHODOBKA 2 SPOČÍTÁNA ✅ – sezóna uzavřena');
}

/* ---------- STARTOVNÉ ---------- */
async function nactiDlouhodobe() {
    const { data: dl } = await sb.from('cl_dlouhodobe').select('*').order('jmeno');
    document.getElementById('seznamDl').innerHTML = (dl || []).map(r => `
        <div class="dl-radek">
            <b>${r.jmeno}</b> · body: ${(r.body1 || 0) + (r.body2 || 0)}
            <button class="btn btn-mini" style="background:${r.zaplaceno ? 'var(--green)' : 'var(--red)'}; color:#fff; margin-left:10px;"
                onclick="togglePaid('${r.user_id}', ${r.zaplaceno})">${r.zaplaceno ? '✅ zaplaceno' : '❌ nezaplaceno'}</button>
        </div>`).join('') || '<div style="opacity:.5;">Zatím nikdo nepodal dlouhodobý tip.</div>';
}

async function togglePaid(uid, curr) {
    await sb.from('cl_dlouhodobe').update({ zaplaceno: !curr }).eq('user_id', uid);
    nactiDlouhodobe();
}

init();
</script>
