<style>

html, body { color-scheme: dark; }

.wrap { max-width: 640px; margin: 0 auto; }

h1 { font-size: 1.2em; font-weight: 900; color: var(--fial); letter-spacing: 2px; text-transform: uppercase; }
h2 { font-size: .85em; color: var(--gold); letter-spacing: 1.5px; text-transform: uppercase; margin: 0 0 12px; }
.karta { background: var(--card-bg); border: 1px solid rgba(167,139,250,.25); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
.pole { width: 100%; background: rgba(10,6,20,.6); color: #fff; border: 1px solid rgba(167,139,250,.3); border-radius: 10px; padding: 11px; font-size: .9em; font-family: inherit; outline: none; margin-bottom: 10px; }
textarea.pole { min-height: 90px; resize: vertical; }
.btn { background: linear-gradient(135deg, #a78bfa, #6d4fc4); color: #0e0a18; border: none; border-radius: 11px; padding: 12px 18px; font-weight: 900; font-size: .78em; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; font-family: inherit; }
.btn-gold { background: linear-gradient(135deg, #d4af37, #9a7b1e); }
.btn-red { background: var(--red); color: #fff; }
.btn-mini { padding: 6px 12px; font-size: .68em; border-radius: 8px; }
.zapas-row { border-bottom: 1px solid rgba(255,255,255,.08); padding: 11px 0; font-size: .85em; }
.msg { display: none; position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; font-weight: 900; padding: 12px 22px; border-radius: 100px; z-index: 2000; font-size: .8em; }
.dl-radek { border-bottom: 1px solid rgba(255,255,255,.08); padding: 10px 0; font-size: .8em; }
.nezmocnen { text-align: center; padding: 60px 20px; opacity: .6; }
.flexrow { display: flex; gap: 10px; }
.flexrow .pole { flex: 1; }
label.lbl { display: block; font-size: .62em; letter-spacing: 1.5px; text-transform: uppercase; opacity: .55; font-weight: 800; margin-bottom: 5px; }
.chipy { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.chipy .ch { font-size:.74em; font-weight:700; padding:7px 12px; border:1px solid rgba(167,139,250,.3);
    border-radius:100px; cursor:pointer; user-select:none; transition:all .15s; opacity:.75; color:#fff; }
.chipy .ch.on { background:rgba(212,175,55,.2); border-color:var(--gold); color:var(--gold); opacity:1; }
.pocitadlo { font-size:.68em; opacity:.55; margin-bottom:8px; }
.par-radek { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.par-radek .pole { margin-bottom:0; }
.par-radek span { opacity:.4; font-size:.8em; flex-shrink:0; }
select.pole option { background:#14101f; color:#fff; }
.karta h2.sbal { cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin: 0; user-select: none; }
.karta h2.sbal .arrow { transition: transform .2s; font-size: .8em; opacity: .7; }
.karta h2.sbal.open .arrow { transform: rotate(180deg); }
.karta-obsah { overflow: hidden; }
.karta-obsah.zavreno { display: none; }
.kolo-blok { margin-bottom: 12px; border: 1px solid rgba(167,139,250,.2); border-radius: 12px; overflow: hidden; }
.kolo-hl { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; background: rgba(167,139,250,.13); cursor: pointer; font-weight: 800; user-select: none; }
.kolo-obsah { padding: 8px; }
.kolo-blok.sbaleno .kolo-obsah { display: none; }
.kolo-blok.sbaleno .kolo-hl { opacity: .65; }
</style>
</head>

</div>

<script>
const SB_URL = "https://vlabocwezmpwnxrwxihs.supabase.co";
const SB_KEY = "sb_publishable_H9egZ3Rrq5LYi02NxpvjCQ_xDXOQP4X";
const sb = supabase.createClient(SB_URL, SB_KEY);
const ADMIN_ID = "92a1e51b-e03c-48d7-99df-76c2f60a455f";
const BODY = { presne: 5, trend: 1, top8: 3, vitezZC: 8, propadlik: 1, qf: 2, sf: 5, finale: 8, vitezCL: 20,
               cech: 5, slavia_misto: 5, slavia_body: 5, slavia_goly: 5 };
const CECH_MOZNOSTI = ['Nepostoupí z ligové fáze', 'Vypadne v play-off (únor)', 'Vypadne v osmifinále', 'Čtvrtfinále a dál', 'Žádný český tým v CL'];

let stav = {};

function msg(t, err) {
    const el = document.getElementById('msg');
    el.textContent = t;
    el.style.background = err ? 'var(--red)' : 'var(--green)';
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3500);
}

async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session || session.user.id !== ADMIN_ID) {
        document.getElementById('obsah').innerHTML = 'Přístup jen pro admina.<br><br><a href="../welcome.html" style="color:var(--fial);">→ Přihlásit</a>';
        return;
    }
    document.getElementById('obsah').className = '';
    document.getElementById('obsah').innerHTML = `
        <div class="karta">
            <h2>➕ Vypsat zápasy k tipování</h2>
            <div style="font-size:.8em; opacity:.7; margin-bottom:10px;">
                Nastav <b>společný deadline</b> a fázi – předvyplní se všem řádkům. U jednotlivého zápasu je můžeš přepsat.
            </div>
            <div class="flexrow">
                <select class="pole" id="hr-faze">
                    <option value="ZC">Základní část</option>
                    <option value="PO">Play-off (únor)</option>
                    <option value="OSM">Osmifinále</option>
                    <option value="QF">Čtvrtfinále</option>
                    <option value="SF">Semifinále</option>
                    <option value="FINALE">Finále</option>
                </select>
                <input class="pole" id="hr-deadline" type="datetime-local" title="Společný deadline">
                <input class="pole" id="hr-kolo" type="number" min="1" placeholder="Kolo" title="Hrací kolo (1., 2., …) – platí pro celou dávku" style="max-width:100px;">
            </div>
            <button class="btn btn-mini" style="margin:6px 0;" onclick="hrPredvyplnit()">⬇️ Předvyplnit deadline+fázi do všech řádků</button>

            <div id="hr-radky"></div>

            <button class="btn btn-mini" style="background:#2c3e50; margin-top:8px;" onclick="hrPridejRadek()">➕ Další zápas</button>
            <button class="btn" style="margin-top:10px;" onclick="hrUlozVse()">📤 VYPSAT VŠECHNY ZÁPASY</button>
            <div id="hr-msg" style="margin-top:8px; font-size:.85em;"></div>
        </div>

        <div class="karta">
            <h2>🎯 Aktivní zápasy (k vyhodnocení)</h2>
            <div id="seznamZapasuAktivni">Načítám…</div>
        </div>

        <div class="karta">
            <h2>✅ Vyhodnocené zápasy</h2>
            <div id="seznamZapasuHotove">Načítám…</div>
        </div>

        <div class="karta">
            <h2>🏟️ Účastníci ligové fáze (36 týmů)</h2>
            <label class="lbl">Jeden tým na řádek – po srpnovém losu</label>
            <textarea class="pole" id="t-tymy" placeholder="Real Madrid&#10;Manchester City&#10;Bayern Mnichov&#10;…"></textarea>
            <label class="lbl">Uzávěrka dlouhodobky 1 (před 1. kolem)</label>
            <input class="pole" id="t-dl1" type="datetime-local">
            <button class="btn" onclick="ulozTymy()">ULOŽIT TÝMY + UZÁVĚRKU</button>
        </div>

        <div class="karta">
            <h2>🥊 Páry osmifinále (pavouk) – otevře dlouhodobku 2</h2>
            <label class="lbl">8 párů – po únorovém losu</label>
            <div id="r16-pary"></div>
            <label class="lbl">Uzávěrka dlouhodobky 2 (před osmifinále)</label>
            <input class="pole" id="t-dl2" type="datetime-local">
            <button class="btn" onclick="ulozR16()">ULOŽIT PÁRY + UZÁVĚRKU</button>
        </div>

        <div class="karta">
            <h2>🏁 Vyhodnocení dlouhodobky 1 (po základní části)</h2>
            <label class="lbl">Skutečné top 8 tabulky</label>
            <div class="pocitadlo" id="poc-vtop8">0 / 8</div>
            <div class="chipy" id="v-top8"></div>
            <label class="lbl">Vítěz základní části</label>
            <select class="pole" id="v-vitezZC"><option value="">– vyber –</option></select>
            <label class="lbl">Skuteční propadlíci – místa 25–36</label>
            <div class="pocitadlo" id="poc-vprop">0 / 12</div>
            <div class="chipy" id="v-prop"></div>
            <label class="lbl">🇨🇿 SK Slavia Praha – kam došla v soutěži</label>
            <select class="pole" id="v-cech"><option value="">– vyber –</option></select>
            <label class="lbl">🇨🇿 Slavia – skutečné umístění v tabulce (1–36)</label>
            <input class="pole" id="v-slavia-misto" type="number" min="1" max="36" placeholder="např. 8">
            <label class="lbl">🇨🇿 Slavia – skutečný počet bodů v ligové fázi</label>
            <input class="pole" id="v-slavia-body" type="number" min="0" placeholder="např. 12">
            <label class="lbl">🇨🇿 Slavia – skutečný počet vstřelených gólů</label>
            <input class="pole" id="v-slavia-goly" type="number" min="0" placeholder="např. 14">
            <button class="btn btn-gold" onclick="vyhodnotDl1()">SPOČÍTAT BODY DLOUHODOBKY 1</button>
        </div>

        <div class="karta">
            <h2>🏆 Vyhodnocení dlouhodobky 2 (postupně jak se hraje)</h2>
            <label class="lbl">Skuteční čtvrtfinalisté – vyber 8 ze 16</label>
            <div class="pocitadlo" id="poc-vqf">0 / 8</div>
            <div class="chipy" id="v-qf"></div>
            <label class="lbl">Semifinalisté – vyber 4 ze zvolených</label>
            <div class="pocitadlo" id="poc-vsf">0 / 4</div>
            <div class="chipy" id="v-sf"></div>
            <label class="lbl">Finalisté – vyber 2 ze zvolených</label>
            <div class="pocitadlo" id="poc-vfin">0 / 2</div>
            <div class="chipy" id="v-fin"></div>
            <label class="lbl">Vítěz CL</label>
            <select class="pole" id="v-vitez"><option value="">– vyber –</option></select>
            <button class="btn btn-gold" onclick="vyhodnotDl2()">SPOČÍTAT BODY DLOUHODOBKY 2</button>
        </div>

        <div class="karta">
            <h2>💰 Startovné (200 Kč)</h2>
            <div id="seznamDl">Načítám…</div>
        </div>

        <div class="karta">
            <h2>🎨 Viditelnost vodoznaku (loga na pozadí)</h2>
            <div style="font-size:.8em; opacity:.7; margin-bottom:10px;">Platí pro všechny stránky CL. 0 % = vypnuto.</div>
            <div style="display:flex; align-items:center; gap:12px;">
                <input type="range" id="vodoznakRange" min="0" max="40" step="1" value="10" style="flex:1;" oninput="document.getElementById('vodoznakVal').textContent=this.value+' %'">
                <span id="vodoznakVal" style="font-weight:900; color:var(--gold); min-width:44px; text-align:right;">10 %</span>
            </div>
            <button class="btn btn-gold" style="width:100%; margin-top:10px;" onclick="ulozVodoznak()">💾 ULOŽIT VIDITELNOST</button>
            <div id="vodoznakMsg" style="margin-top:8px; font-size:.85em;"></div>
        </div>

        <div class="karta">
            <h2>👑 Král kola</h2>
            <div style="font-size:.82em; opacity:.75; margin-bottom:10px;">Spočítá, kdo od <b>minulého vyhlášení</b> získal nejvíc bodů za zápasy. První vyhlášení bere body od začátku (základ 0). Nejdřív ukáže návrh, teprve po potvrzení odejde push.</div>
            <button class="btn btn-gold" onclick="vyhodnotKolo()" style="width:100%;">🧮 Vyhodnotit kolo</button>
            <div id="kralVysledek" style="margin-top:10px;"></div>
            <div id="kralHistorie" style="margin-top:14px; font-size:.85em;"></div>
            <div id="kralMsg" style="margin-top:8px; font-size:.85em;"></div>
        </div>

        <div class="karta">
            <h2>📢 Poslat oznámení</h2>
            <input type="text" id="pushTitulek" placeholder="Titulek (např. ⚠️ Pozor)" maxlength="60" style="width:100%; padding:10px; margin-bottom:8px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); border-radius:8px; color:#fff; font-family:inherit;">
            <textarea id="pushText" placeholder="Text zprávy (např. Zítra uzávěrka dlouhodobky!)" maxlength="180" style="width:100%; min-height:70px; padding:10px; margin-bottom:8px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); border-radius:8px; color:#fff; font-family:inherit; resize:vertical;"></textarea>
            <div style="display:flex; gap:8px; margin-bottom:8px;">
                <button class="btn" id="pushKomuVsichni" onclick="pushKomu('vsichni')" style="flex:1;">👥 Všem</button>
                <button class="btn" id="pushKomuVyber" onclick="pushKomu('vyber')" style="flex:1; background:#444;">☑️ Vybraným</button>
            </div>
            <div id="pushHraciBox" style="display:none; margin-bottom:8px; max-height:200px; overflow-y:auto; border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:8px;">
                <div id="pushHraciList" style="font-size:.9em;">Načítám…</div>
            </div>
            <button class="btn btn-gold" onclick="odesliPush()" style="width:100%;">📤 ODESLAT OZNÁMENÍ</button>
            <div id="pushMsg" style="margin-top:8px; font-size:.85em;"></div>
        </div>`;
    initSbalovani();
    await nactiStav();
    await nactiZapasy();
    await nactiDlouhodobe();
    await nactiKrale();
}

// ---------- PUSH OZNÁMENÍ ----------
let _pushKomu = 'vsichni';
function pushKomu(kdo) {
    _pushKomu = kdo;
    document.getElementById('pushKomuVsichni').style.background = kdo === 'vsichni' ? '' : '#444';
    document.getElementById('pushKomuVyber').style.background = kdo === 'vyber' ? '' : '#444';
    const box = document.getElementById('pushHraciBox');
    box.style.display = kdo === 'vyber' ? 'block' : 'none';
    if (kdo === 'vyber') nactiPushHrace();
}

async function nactiPushHrace() {
    const list = document.getElementById('pushHraciList');
    const { data: hraci } = await sb.from('hraci').select('user_id, jmeno').order('jmeno');
    if (!hraci || !hraci.length) { list.innerHTML = '<div style="opacity:.5;">Žádní hráči.</div>'; return; }
    list.innerHTML = hraci.map(h => `
        <label style="display:flex; align-items:center; gap:8px; padding:6px 4px; cursor:pointer;">
            <input type="checkbox" class="push-hrac" value="${h.user_id}" style="width:18px; height:18px;">
            <span>${h.jmeno || '(bez jména)'}</span>
        </label>`).join('');
}

async function odesliPush() {
    const titulek = document.getElementById('pushTitulek').value.trim();
    const text = document.getElementById('pushText').value.trim();
    const msg = document.getElementById('pushMsg');
    if (!text) { msg.innerHTML = '<span style="color:#ff5555;">Napiš text zprávy.</span>'; return; }

    let user_ids = [];
    if (_pushKomu === 'vyber') {
        user_ids = [...document.querySelectorAll('.push-hrac:checked')].map(c => c.value);
        if (!user_ids.length) { msg.innerHTML = '<span style="color:#ff5555;">Vyber aspoň jednoho hráče.</span>'; return; }
    }

    const potvrz = _pushKomu === 'vsichni'
        ? 'Opravdu poslat oznámení VŠEM hráčům?'
        : `Poslat oznámení ${user_ids.length} vybraným hráčům?`;
    if (!confirm(potvrz)) return;

    msg.innerHTML = '<span style="opacity:.6;">Odesílám…</span>';
    try {
        const res = await fetch('https://vlabocwezmpwnxrwxihs.supabase.co/functions/v1/posli-oznameni', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SB_KEY },
            body: JSON.stringify({
                titulek, text,
                url: 'https://sknadeje.cz/ChampionsLeague/index.html',
                komu: _pushKomu,
                user_ids
            })
        });
        const data = await res.json();
        if (data.ok) {
            let t = '✅ Odesláno!';
            if (data.preskoceno) t += ' (' + data.preskoceno + ' hráč(ů) nemá zapnuté notifikace)';
            msg.innerHTML = '<span style="color:#2ecc71;">' + t + '</span>';
            document.getElementById('pushTitulek').value = '';
            document.getElementById('pushText').value = '';
            document.querySelectorAll('.push-hrac:checked').forEach(c => c.checked = false);
        } else if (data.odeslano === 0 && data.detail) {
            msg.innerHTML = '<span style="color:#f1c40f;">📨 Zpráva odeslána do OneSignal. Pokud někomu nedorazí, nemá zapnuté notifikace (může chvíli trvat, než dorazí).</span>';
        } else {
            msg.innerHTML = '<span style="color:#ff5555;">Chyba: ' + JSON.stringify(data.chyby || data.error || data.detail || 'neznámá') + '</span>';
        }
    } catch (e) {
        msg.innerHTML = '<span style="color:#ff5555;">Chyba spojení: ' + e.message + '</span>';
    }
}

async function nactiStav() {
    const { data } = await sb.from('cl_stav').select('*').eq('id', 1).maybeSingle();
    stav = data || {};
    if ((stav.tymy || []).length) document.getElementById('t-tymy').value = stav.tymy.join('\n');
    const toLocal = (iso) => iso ? new Date(new Date(iso).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : '';
    document.getElementById('t-dl1').value = toLocal(stav.deadline_tip1);
    document.getElementById('t-dl2').value = toLocal(stav.deadline_tip2);
    naplnTymSelecty();
    renderR16Pary();
    initVysl1();
    initVysl2();
    // vodoznak posuvník
    const vr = document.getElementById('vodoznakRange');
    if (vr) {
        const pct = Math.round(((stav.vodoznak_opacity ?? 0.10) * 100));
        vr.value = pct;
        document.getElementById('vodoznakVal').textContent = pct + ' %';
    }
}

async function ulozVodoznak() {
    const pct = parseInt(document.getElementById('vodoznakRange').value, 10);
    const m = document.getElementById('vodoznakMsg');
    m.innerHTML = '<span style="opacity:.6;">Ukládám…</span>';
    const { error } = await sb.from('cl_stav').update({ vodoznak_opacity: pct / 100 }).eq('id', 1);
    if (error) { m.innerHTML = '<span style="color:#ff5555;">Chyba: ' + error.message + '</span>'; return; }
    m.innerHTML = '<span style="color:#2ecc71;">✅ Uloženo! Projeví se hráčům při načtení stránky.</span>';
}

// ── HROMADNÉ VYPISOVÁNÍ ZÁPASŮ ──
function tymOptions(sel) {
    const tymy = stav.tymy || [];
    return '<option value="">– vyber –</option>' + tymy.map(t => `<option${t === sel ? ' selected' : ''}>${t}</option>`).join('');
}
const FAZE_OPTS = [['ZC','Základní část'],['PO','Play-off'],['OSM','Osmifinále'],['QF','Čtvrtfinále'],['SF','Semifinále'],['FINALE','Finále']];

function hrRadekHTML(i) {
    return `
    <div class="hr-radek" data-i="${i}" style="border:1px solid rgba(var(--fial-rgb),.2); border-radius:10px; padding:10px; margin-bottom:8px;">
        <div class="flexrow">
            <select class="pole hr-domaci">${tymOptions('')}</select>
            <select class="pole hr-hoste">${tymOptions('')}</select>
        </div>
        <div class="flexrow" style="margin-top:6px;">
            <select class="pole hr-faze">${FAZE_OPTS.map(f=>`<option value="${f[0]}">${f[1]}</option>`).join('')}</select>
            <input class="pole hr-dl" type="datetime-local" title="Deadline tohoto zápasu">
        </div>
        <div style="margin-top:6px; font-size:.8em; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
            <span style="opacity:.7;">🎲 Outsider (3b výhra / 2b remíza):</span>
            <select class="pole hr-outsider" style="flex:1; min-width:120px;">
                <option value="">Nikdo</option>
            </select>
            <button class="btn btn-mini" style="background:#7a2020;" onclick="hrSmazRadek(${i})">✕</button>
        </div>
    </div>`;
}

let _hrPocet = 0;
function hrPridejRadek() {
    const cont = document.getElementById('hr-radky');
    if (!cont) return;
    const div = document.createElement('div');
    div.innerHTML = hrRadekHTML(_hrPocet++);
    const radek = div.firstElementChild;
    cont.appendChild(radek);
    // Naplň outsider select podle vybraných týmů (aktualizuje se při změně)
    const dom = radek.querySelector('.hr-domaci');
    const hos = radek.querySelector('.hr-hoste');
    const out = radek.querySelector('.hr-outsider');
    function updateOut() {
        const d = dom.value, h = hos.value;
        out.innerHTML = '<option value="">Nikdo</option>' +
            (d ? `<option value="${d}">${d}</option>` : '') +
            (h ? `<option value="${h}">${h}</option>` : '');
    }
    dom.addEventListener('change', updateOut);
    hos.addEventListener('change', updateOut);
    // předvyplň deadline+fázi z horních společných polí
    const dl = document.getElementById('hr-deadline')?.value;
    const fz = document.getElementById('hr-faze')?.value;
    if (dl) radek.querySelector('.hr-dl').value = dl;
    if (fz) radek.querySelector('.hr-faze').value = fz;
}

function hrPredvyplnit() {

async function hrUlozVse() {
    const radky = [...document.querySelectorAll('.hr-radek')];
    const m = document.getElementById('hr-msg');
    if (!radky.length) { m.innerHTML = '<span style="color:#ff5555;">Přidej aspoň jeden zápas.</span>'; return; }

    const zapasy = [];
    const kolo = parseInt(document.getElementById('hr-kolo').value, 10) || null;
    for (const r of radky) {
        const domaci = r.querySelector('.hr-domaci').value.trim();
        const hoste = r.querySelector('.hr-hoste').value.trim();
        const faze = r.querySelector('.hr-faze').value;
        const dl = r.querySelector('.hr-dl').value;
        const outsider = r.querySelector('.hr-outsider').value.trim() || null;
        if (!domaci || !hoste || !dl) {
            m.innerHTML = '<span style="color:#ff5555;">Každý zápas musí mít domácí, hosty i deadline.</span>';
            return;
        }
        if (domaci === hoste) {
            m.innerHTML = '<span style="color:#ff5555;">Domácí a hosté nemůžou být stejný tým.</span>';
            return;
        }
        zapasy.push({ domaci, hoste, faze, deadline: new Date(dl).toISOString(), outsider, kolo });
    }

    m.innerHTML = '<span style="opacity:.6;">Ukládám…</span>';
    const { error } = await sb.from('cl_zapasy').insert(zapasy);
    if (error) { m.innerHTML = '<span style="color:#ff5555;">Chyba: ' + error.message + '</span>'; return; }

    // Notifikace na každý zápas (jako u jednotlivého)
    for (const z of zapasy) {
        const kdy = new Date(z.deadline).toLocaleString('cs-CZ', { day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit' });
        posliNotifikaciZapas(z.domaci, z.hoste, z.deadline);
    }

    m.innerHTML = `<span style="color:#2ecc71;">✅ Vypsáno ${zapasy.length} zápasů!</span>`;
    document.getElementById('hr-radky').innerHTML = '';
    hrPridejRadek();
    nactiZapasy();
}

function naplnTymSelecty() {

function chipHtml(elId, pool, vybrane, onClick) {
    const el = document.getElementById(elId);
    if (!el) return;
    el.innerHTML = pool.map(t => {
        const on = vybrane.includes(t);
        const bezpecny = t.replace(/"/g, '&quot;');
        return `<span class="ch${on ? ' on' : ''}" data-tym="${bezpecny}" onclick="${onClick}(this.dataset.tym)">${t}</span>`;
    }).join('') || '<span style="opacity:.4; font-size:.85em;">Nejdřív ulož seznam týmů.</span>';
}
function toggle(arr, tym, max) {
    const i = arr.indexOf(tym);
    if (i >= 0) arr.splice(i, 1);
    else if (arr.length < max) arr.push(tym);
}

// Push všem se zapnutou CL
async function posliNotifikaciZapas(domaci, hoste, deadline) {

        const kdy = new Date(deadline).toLocaleString('cs-CZ', {
            day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit'
        });

}

function kolaHtml(list, renderRow, desc) {
    if (!list.length) return '';
    const skup = {};
    list.forEach(z => { const k = z.kolo || 0; (skup[k] = skup[k] || []).push(z); });
    let kola = Object.keys(skup).map(Number).sort((a, b) => a - b);
    if (desc) kola.reverse();
    if (kola.includes(0)) { kola = kola.filter(x => x !== 0); kola.push(0); }
    return kola.map(k => {
        const nazev = k === 0 ? 'Bez kola' : k + '. kolo';
        return `<div class="kolo-blok"><div class="kolo-hl" onclick="this.parentElement.classList.toggle('sbaleno')"><span>${nazev}</span><span style="opacity:.55; font-weight:400; font-size:.85em;">${skup[k].length} · ▾</span></div><div class="kolo-obsah">${skup[k].map(renderRow).join('')}</div></div>`;
    }).join('');
}

async function nactiZapasy() {
    const [{ data: zapasy }, { data: tipy }] = await Promise.all([
        sb.from('cl_zapasy').select('*').order('deadline', { ascending: false }),
        sb.from('cl_tipy_zapasy').select('*')
    ]);
    const tMap = {};
    (tipy || []).forEach(t => (tMap[t.zapas_id] = tMap[t.zapas_id] || []).push(t));

    const esc = s => (s || '').replace(/'/g, "\\'");
    // Tlačítka pro outsidera – stejná pro aktivní zápas i pro opravu vyhodnoceného
    const outsiderBtny = (z) => `<div style="margin-top:8px; font-size:.78em; opacity:.7;">🎲 Outsider (trend 1→3 b., remíza 2 b.):</div>
                <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;">
                    <button class="btn btn-mini" style="${!z.outsider ? 'background:var(--fial); color:#fff;' : 'background:#333; color:#fff;'}" onclick="nastavOutsidera(${z.id}, null)">Nikdo</button>
                    <button class="btn btn-mini" style="${z.outsider === z.domaci ? 'background:var(--fial); color:#fff;' : 'background:#333; color:#fff;'}" onclick="nastavOutsidera(${z.id}, '${esc(z.domaci)}')">${z.domaci}</button>
                    <button class="btn btn-mini" style="${z.outsider === z.hoste ? 'background:var(--fial); color:#fff;' : 'background:#333; color:#fff;'}" onclick="nastavOutsidera(${z.id}, '${esc(z.hoste)}')">${z.hoste}</button>
                </div>`;
    // Výpis tipů hráčů pod zápasem
    const tipyHtml = (tt, hotovo) => `<div style="font-size:.85em; opacity:.65; margin-top:5px;">${tt.map(t => `• ${t.jmeno}: ${t.skore}${hotovo ? ` (+${t.body})` : ''}`).join('<br>')}</div>`;

    const zapasyArr = zapasy || [];
    const aktivni = zapasyArr.filter(z => z.status !== 'vyhodnoceno');
    const hotove = zapasyArr.filter(z => z.status === 'vyhodnoceno');

    // AKTIVNÍ zápasy – zadání výsledku a vyhodnocení
    document.getElementById('seznamZapasuAktivni').innerHTML = kolaHtml(aktivni, z => {
        const tt = tMap[z.id] || [];
        return `<div class="zapas-row">
            <b>${z.domaci} vs ${z.hoste}</b> · ${z.kolo ? z.kolo + '. kolo · ' : ''}${z.faze} · tipů: ${tt.length}
            <div style="margin-top:8px; display:flex; gap:8px; align-items:center;">
                <input class="pole" style="width:52px; margin:0; text-align:center;" id="vd-${z.id}" placeholder="0" inputmode="numeric">
                <b>:</b>
                <input class="pole" style="width:52px; margin:0; text-align:center;" id="vh-${z.id}" placeholder="0" inputmode="numeric">
                <button class="btn btn-mini btn-gold" onclick="vyhodnotZapas(${z.id})">VYHODNOTIT</button>
                <button class="btn btn-mini btn-red" onclick="smazZapas(${z.id})">🗑</button>
            </div>
            ${outsiderBtny(z)}
            ${tipyHtml(tt, false)}
        </div>`;
    }, false) || '<div style="opacity:.5;">Žádné aktivní zápasy.</div>';

    // VYHODNOCENÉ zápasy – zobrazení + možnost opravy (přehodnocení)
    document.getElementById('seznamZapasuHotove').innerHTML = kolaHtml(hotove, z => {
        const tt = tMap[z.id] || [];
        return `<div class="zapas-row">
            <b>${z.domaci} vs ${z.hoste}</b> · ${z.kolo ? z.kolo + '. kolo · ' : ''}${z.faze} · tipů: ${tt.length} · <span style="color:var(--green); font-weight:900;">✔ ${z.vysledek_d}:${z.vysledek_h}</span>${z.outsider ? ` · 🎲 ${z.outsider}` : ''}
            <button class="btn btn-mini" style="margin-left:8px; background:#2c3e50;" onclick="prepniOpravu(${z.id})">✏️ Opravit</button>
            <div id="oprava-${z.id}" style="display:none; margin-top:8px; padding:10px; border:1px dashed rgba(167,139,250,.35); border-radius:10px;">
                <div style="font-size:.72em; opacity:.7; margin-bottom:6px;">Uprav výsledek a dej PŘEHODNOTIT – body všech hráčů u tohoto zápasu se přepočítají.</div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <input class="pole" style="width:52px; margin:0; text-align:center;" id="vd-${z.id}" value="${z.vysledek_d}" inputmode="numeric">
                    <b>:</b>
                    <input class="pole" style="width:52px; margin:0; text-align:center;" id="vh-${z.id}" value="${z.vysledek_h}" inputmode="numeric">
                    <button class="btn btn-mini btn-gold" onclick="vyhodnotZapas(${z.id})">PŘEHODNOTIT</button>
                    <button class="btn btn-mini btn-red" onclick="smazZapas(${z.id})">🗑</button>
                </div>
                ${outsiderBtny(z)}
            </div>
            ${tipyHtml(tt, true)}
        </div>`;
    }, true) || '<div style="opacity:.5;">Zatím žádné vyhodnocené zápasy.</div>';
}

function prepniOpravu(id) {
    const el = document.getElementById('oprava-' + id);
    if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
async function nastavOutsidera(id, tym) {
    const { error } = await sb.from('cl_zapasy').update({ outsider: tym }).eq('id', id);
    if (error) return msg('Chyba: ' + error.message, true);
    nactiZapasy();
}

async function vyhodnotZapas(id) {
    const d = parseInt(document.getElementById('vd-' + id).value);
    const h = parseInt(document.getElementById('vh-' + id).value);
    if (isNaN(d) || isNaN(h)) return msg('Doplň skóre.', true);
    const { data: zapas } = await sb.from('cl_zapasy').select('domaci, hoste, outsider').eq('id', id).maybeSingle();
    const vitez = d > h ? zapas?.domaci : (h > d ? zapas?.hoste : null);
    const outsiderVyhral = zapas?.outsider && vitez && zapas.outsider === vitez;

    const { data: tipy } = await sb.from('cl_tipy_zapasy').select('*').eq('zapas_id', id);
    for (const t of (tipy || [])) {
        const [td, th] = t.skore.split(':').map(Number);
        const presne = td === d && th === h;
        const trend = (d > h && td > th) || (d < h && td < th) || (d === h && td === th);

        // Trend: normálně 1 b. V outsider zápase: výhra outsidera 3 b., remíza 2 b.
        let trendBody = 0;
        if (trend) {
            if (zapas?.outsider) {
                if (outsiderVyhral &&
                    ((d > h && td > th && zapas.outsider === zapas?.domaci) ||
                     (h > d && th > td && zapas.outsider === zapas?.hoste))) {
                    trendBody = 3;
                } else if (d === h && td === th) {
                    trendBody = 2;
                } else {
                    trendBody = 1;
                }
            } else {
                trendBody = 1;
            }
        }
        // Bonusy: stejný ROZDÍL skóre (ABSOLUTNÍ – nezáleží, kdo vyhrál: 3:1 i 0:2 = rozdíl 2) + stejný počet branek, sčítá se
        const hitRozdil = Math.abs(td - th) === Math.abs(d - h);
        const hitPocet = (td + th) === (d + h);

        // Body se sčítají (jako u hokeje): přesné skóre + trend + rozdíl + počet
        const b = (presne ? BODY.presne : 0) + trendBody + (hitRozdil ? 1 : 0) + (hitPocet ? 1 : 0);
        await sb.from('cl_tipy_zapasy').update({
            body: b, hit_skore: presne, hit_trend: trend,
            hit_rozdil: hitRozdil, hit_pocet: hitPocet
        }).eq('id', t.id);
    }
    await sb.from('cl_zapasy').update({ status: 'vyhodnoceno', vysledek_d: d, vysledek_h: h }).eq('id', id);
    msg('VYHODNOCENO ✅ (' + (tipy || []).length + ' tipů)');
    nactiZapasy();
}

async function smazZapas(id) {
    if (!confirm('Smazat zápas včetně tipů?')) return;
    await sb.from('cl_zapasy').delete().eq('id', id);
    nactiZapasy();
}

const radky = (id) => document.getElementById(id).value.split('\n').map(x => x.trim()).filter(Boolean);

async function ulozTymy() {
    const tymy = radky('t-tymy');
    // Kompletní sada je 36 týmů. Míň (i 0) povolíme, ale upozorníme —
    // hráčům se pak dlouhodobka 1 neotevře (index kontroluje >= 36), takže nebudou tipovat.
    if (tymy.length !== 36) {
        const jak = tymy.length === 0
            ? 'Ukládáš PRÁZDNÝ seznam týmů — hráči nebudou moct tipovat dlouhodobku 1.'
            : `Máš jen ${tymy.length} z 36 týmů — dokud jich nebude 36, hráči dlouhodobku 1 tipovat nemůžou.`;
        if (!confirm(jak + '\n\nOpravdu uložit takto?')) return;
    }
    const dl = document.getElementById('t-dl1').value;
    const { error } = await sb.from('cl_stav').update({
        tymy, deadline_tip1: dl ? new Date(dl).toISOString() : null,
        aktualizovano: new Date().toISOString()
    }).eq('id', 1);
    if (error) return msg('Chyba: ' + error.message, true);
    stav.tymy = tymy;
    naplnTymSelecty(); renderR16Pary(); initVysl1();
    msg('TÝMY ULOŽENY ✅');
    if (dl && confirm('Poslat hráčům notifikaci, že je dlouhodobý tip otevřený?')) {
        const kdy = new Date(dl).toLocaleString('cs-CZ', { day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit' });
        posliCLNotifikaci('📋 Dlouhodobý tip je otevřený!',
            'Tipni top 8, vítěze základní části a propadlíky — uzávěrka ' + kdy);
    }
}

    } catch (e) { console.error('Notifikace selhala:', e); }
}

async function ulozR16() {
    const pary = [];
    const pouzite = new Set();

    // Zjisti, kolik polí je vyplněných
    let vyplneno = 0;
    for (let i = 0; i < 8; i++) {
        if (document.getElementById(`r16-a-${i}`).value) vyplneno++;
        if (document.getElementById(`r16-b-${i}`).value) vyplneno++;
    }

    // Úplně prázdný pavouk = reset dlouhodobky 2 (hráči ji pak nemůžou tipovat)
    if (vyplneno === 0) {
        if (!confirm('Ukládáš PRÁZDNÝ pavouk — tím se Cesta k titulu (dlouhodobka 2) zavře a hráči ji nebudou moct tipovat.\n\nTipy a body hráčů zůstanou zachované. Opravdu resetovat?')) return;
        const dl = document.getElementById('t-dl2').value;
        const { error } = await sb.from('cl_stav').update({
            bracket_r16: [], osmifinaliste: [],
            deadline_tip2: dl ? new Date(dl).toISOString() : null,
            aktualizovano: new Date().toISOString()
        }).eq('id', 1);
        if (error) return msg('Chyba: ' + error.message, true);
        stav.bracket_r16 = [];
        stav.osmifinaliste = [];
        renderVysl2();
        return msg('PAVOUK VYRESETOVÁN (dlouhodobka 2 zavřená) ✅');
    }

    // Půjde uložit i NEÚPLNÝ pavouk (los ještě není hotový):
    // každý pár musí být buď KOMPLETNÍ (oba týmy), nebo úplně PRÁZDNÝ. Prázdné páry přeskočíme.
    for (let i = 0; i < 8; i++) {
        const a = document.getElementById(`r16-a-${i}`).value;
        const b = document.getElementById(`r16-b-${i}`).value;
        if (!a && !b) continue;
        if (!a || !b) return msg(`Pár č. ${i + 1}: vyplň OBA týmy, nebo nech oba prázdné.`, true);
        if (a === b) return msg(`Pár č. ${i + 1}: tým nemůže hrát sám proti sobě.`, true);
        if (pouzite.has(a) || pouzite.has(b)) return msg(`Tým se v párech opakuje (pár č. ${i + 1}).`, true);
        pouzite.add(a); pouzite.add(b);
        pary.push([a, b]);
    }
    const kompletni = pary.length === 8;
    const dl = document.getElementById('t-dl2').value;
    const { error } = await sb.from('cl_stav').update({
        bracket_r16: pary, osmifinaliste: pary.flat(),
        deadline_tip2: dl ? new Date(dl).toISOString() : null,
        aktualizovano: new Date().toISOString()
    }).eq('id', 1);
    if (error) return msg('Chyba: ' + error.message, true);
    stav.bracket_r16 = pary;
    renderVysl2();
    if (!kompletni) {
        msg(`ULOŽENO ČÁSTEČNĚ: ${pary.length} z 8 párů ✅ — dokud nebude 8 párů, nech uzávěrku prázdnou, ať se hráčům neotevře neúplná Cesta k titulu.`);
        return;
    }
    msg('PÁRY OSMIFINÁLE ULOŽENY ✅ (kompletní pavouk)');
    if (confirm('Poslat hráčům notifikaci, že je Cesta k titulu otevřená?')) {
        const kdyTxt = dl
            ? ' — uzávěrka ' + new Date(dl).toLocaleString('cs-CZ', { day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit' })
            : '';
        posliCLNotifikaci('🏆 Cesta k titulu je otevřená!',
            'Pavouk je nalosovaný — proklikej si cestu až k vítězi CL' + kdyTxt);
    }
}

/* ---------- DLOUHODOBKY VYHODNOCENÍ ---------- */
const low = (x) => String(x || '').trim().toLowerCase();
const maTym = (list, tym) => (list || []).some(x => low(x) === low(tym));

async function vyhodnotDl1() {
    const top8 = vysl1.top8, prop = vysl1.propadlici;
    const vitezZC = document.getElementById('v-vitezZC').value.trim();
    if (top8.length !== 8 || prop.length !== 12 || !vitezZC) return msg('Čekám 8 + vítěze + 12.', true);

    // Skutečné výsledky Slavie z formuláře
    const realCech = document.getElementById('v-cech').value || '';
    const mistoRaw = document.getElementById('v-slavia-misto').value;
    const bodyRaw  = document.getElementById('v-slavia-body').value;
    const golyRaw  = document.getElementById('v-slavia-goly').value;
    if (!realCech || mistoRaw === '' || bodyRaw === '' || golyRaw === '') {
        return msg('Vyplň u Slavie všechny čtyři skutečné údaje (kam došla, umístění, body, góly).', true);
    }
    const realMisto = parseInt(mistoRaw);
    const realBody  = parseInt(bodyRaw);
    const realGoly  = parseInt(golyRaw);

    const { data: dl } = await sb.from('cl_dlouhodobe').select('*');
    for (const r of (dl || [])) {
        const t = r.tip1 || {};
        let b = 0;
        (t.top8 || []).forEach(x => { if (maTym(top8, x)) b += BODY.top8; });
        if (low(t.vitezZC) === low(vitezZC)) b += BODY.vitezZC;
        (t.propadlici || []).forEach(x => { if (maTym(prop, x)) b += BODY.propadlik; });
        // 🇨🇿 Kam Slavia došla
        if (t.cech === realCech) b += BODY.cech;
        // 🇨🇿 Umístění v tabulce (přesná trefa)
        if (t.slavia_misto != null && parseInt(t.slavia_misto) === realMisto) b += BODY.slavia_misto;
        // 🇨🇿 Počet bodů (přesná trefa)
        if (t.slavia_body != null && parseInt(t.slavia_body) === realBody) b += BODY.slavia_body;
        // 🇨🇿 Počet gólů (přesná trefa)
        if (t.slavia_goly != null && parseInt(t.slavia_goly) === realGoly) b += BODY.slavia_goly;
        await sb.from('cl_dlouhodobe').update({ body1: b }).eq('user_id', r.user_id);
    }
    await sb.from('cl_stav').update({
        vysledky: { ...(stav.vysledky || {}), top8, vitezZC, propadlici: prop,
                    cech: realCech, slavia_misto: realMisto, slavia_body: realBody, slavia_goly: realGoly },
        aktualizovano: new Date().toISOString()
    }).eq('id', 1);
    msg('DLOUHODOBKA 1 SPOČÍTÁNA ✅');
}

async function vyhodnotDl2() {
    const qf = vysl2.qf, sf = vysl2.sf, fin = vysl2.finale;
    const vitez = document.getElementById('v-vitez').value.trim();
    if (qf.length !== 8 || sf.length !== 4 || fin.length !== 2 || !vitez) return msg('Čekám 8 / 4 / 2 / vítěze.', true);
    const { data: dl } = await sb.from('cl_dlouhodobe').select('*');
    for (const r of (dl || [])) {
        const t = r.tip2 || {};
        let b = 0;
        (t.qf || []).forEach(x => { if (maTym(qf, x)) b += BODY.qf; });
        (t.sf || []).forEach(x => { if (maTym(sf, x)) b += BODY.sf; });
        (t.finale || []).forEach(x => { if (maTym(fin, x)) b += BODY.finale; });
        if (low(t.vitez) === low(vitez)) b += BODY.vitezCL;
        await sb.from('cl_dlouhodobe').update({ body2: b }).eq('user_id', r.user_id);
    }
    await sb.from('cl_stav').update({
        vysledky: { ...(stav.vysledky || {}), qf, sf, finale: fin, vitez },
        sezona_ukoncena: true,
        aktualizovano: new Date().toISOString()
    }).eq('id', 1);
    msg('DLOUHODOBKA 2 SPOČÍTÁNA ✅ – sezóna uzavřena');
}

/* ---------- STARTOVNÉ ---------- */
async function nactiDlouhodobe() {
    const { data: dl } = await sb.from('cl_dlouhodobe').select('*').order('jmeno');
    document.getElementById('seznamDl').innerHTML = (dl || []).map(r => `
        <div class="dl-radek">
            <b>${r.jmeno}</b> · body: ${(r.body1 || 0) + (r.body2 || 0)}
            <button class="btn btn-mini" style="background:${r.zaplaceno ? 'var(--green)' : 'var(--red)'}; color:#fff; margin-left:10px;"
                onclick="togglePaid('${r.user_id}', ${r.zaplaceno})">${r.zaplaceno ? '✅ zaplaceno' : '❌ nezaplaceno'}</button>
        </div>`).join('') || '<div style="opacity:.5;">Zatím nikdo nepodal dlouhodobý tip.</div>';
}

async function togglePaid(uid, curr) {
    await sb.from('cl_dlouhodobe').update({ zaplaceno: !curr }).eq('user_id', uid);
    nactiDlouhodobe();
}

// Rozbalovací sekce adminu – default vše sbalené, klikáním otvírám
function initSbalovani() {
    document.querySelectorAll('.karta').forEach(function(karta) {
        const h2 = karta.querySelector('h2');
        if (!h2 || h2.classList.contains('sbal')) return; // už zpracováno
        // obal veškerý obsah za h2 do .karta-obsah
        const obsah = document.createElement('div');
        obsah.className = 'karta-obsah zavreno';
        let el = h2.nextSibling;
        while (el) {
            const dalsi = el.nextSibling;
            obsah.appendChild(el);
            el = dalsi;
        }
        karta.appendChild(obsah);
        // uprav h2 na klikatelný s šipkou
        h2.classList.add('sbal');
        h2.innerHTML = '<span>' + h2.innerHTML + '</span><span class="arrow">▼</span>';
        h2.addEventListener('click', function() {
            const otevreno = !obsah.classList.contains('zavreno');
            obsah.classList.toggle('zavreno', otevreno);
            h2.classList.toggle('open', !otevreno);
        });
    });
}

// Spustit až teď, když jsou obě funkce (init i initSbalovani) bezpečně definované
let _kralNavrh = null; // dočasný návrh krále čekající na potvrzení

async function nactiKrale() {
    const box = document.getElementById('kralHistorie');
    if (!box) return;
    const { data: kola } = await sb.from('cl_kola').select('*').order('id', { ascending: false });
    if (!kola || !kola.length) { box.innerHTML = '<div style="opacity:.5;">Zatím nevyhlášeno žádné kolo.</div>'; return; }
    box.innerHTML = '<div style="opacity:.6; margin-bottom:6px; text-transform:uppercase; letter-spacing:1px; font-size:.8em;">Síň králů</div>' +
        kola.map((k, idx) => {
            const cislo = kola.length - idx;
            const kral = (k.kral || []).map(x => `${x.jmeno} (+${x.body} b.)`).join(', ');
            return `<div style="padding:5px 0; border-bottom:1px solid rgba(255,255,255,.06);">👑 <b>${cislo}. kolo:</b> ${kral || '—'}</div>`;
        }).join('');
}

async function vyhodnotKolo() {
    const msg = document.getElementById('kralMsg');
    const vys = document.getElementById('kralVysledek');
    _kralNavrh = null; vys.innerHTML = '';
    msg.innerHTML = '<span style="opacity:.6;">Počítám…</span>';

    // 1) aktuální součet bodů za ZÁPASY per hráč
    const { data: tipy, error: e1 } = await sb.from('cl_tipy_zapasy').select('user_id, jmeno, body');
    if (e1) { msg.innerHTML = '<span style="color:#ff5555;">Chyba: ' + e1.message + '</span>'; return; }
    const soucet = {};
    (tipy || []).forEach(t => {
        const so = soucet[t.user_id] = soucet[t.user_id] || { jmeno: t.jmeno, body: 0 };
        so.body += (t.body || 0);
        if (t.jmeno) so.jmeno = t.jmeno;
    });

    // 2) poslední snímek = základ (není-li žádné kolo → základ 0)
    const { data: posl } = await sb.from('cl_kola').select('*').order('id', { ascending: false }).limit(1);
    const zaklad = (posl && posl[0] && posl[0].snapshot) ? posl[0].snapshot : {};
    const { count } = await sb.from('cl_kola').select('*', { count: 'exact', head: true });
    const cisloKola = (count || 0) + 1;

    // 3) přírůstky od minula
    let nej = 0; const gains = [];
    Object.keys(soucet).forEach(uid => {
        const g = soucet[uid].body - (Number(zaklad[uid]) || 0);
        gains.push({ user_id: uid, jmeno: soucet[uid].jmeno, gain: g });
        if (g > nej) nej = g;
    });

    if (nej <= 0) {
        msg.innerHTML = '<span style="color:#e0a53a;">Od minulého kola nikdo nezískal žádné body — není koho vyhlásit. Vyhodnotil jsi zápasy tohoto kola?</span>';
        return;
    }

    // 4) bezpečnostní kontrola: zápasy po uzávěrce bez vyhodnocení
    const { data: zap } = await sb.from('cl_zapasy').select('deadline, status');
    const nevyh = (zap || []).filter(z => z.status !== 'vyhodnoceno' && new Date(z.deadline).getTime() < Date.now()).length;

    const kraluje = gains.filter(g => g.gain === nej);
    const snapshot = {}; Object.keys(soucet).forEach(uid => snapshot[uid] = soucet[uid].body);
    _kralNavrh = { cisloKola, kral: kraluje.map(k => ({ user_id: k.user_id, jmeno: k.jmeno, body: k.gain })), snapshot };

    const jmena = kraluje.map(k => k.jmeno).join(', ');
    vys.innerHTML = `<div style="background:rgba(212,175,55,.12); border:1px solid var(--gold); border-radius:12px; padding:14px; text-align:center;">
            <div style="font-size:.7em; letter-spacing:2px; text-transform:uppercase; color:var(--gold); font-weight:900;">Návrh – ${cisloKola}. kolo</div>
            <div style="font-size:1.4em; font-weight:900; margin:6px 0;">👑 ${jmena}</div>
            <div style="opacity:.85;">+${nej} b. za toto kolo${kraluje.length > 1 ? ' · shodně (spolukrálové)' : ''}</div>
            ${nevyh ? `<div style="color:#e0a53a; margin-top:8px; font-size:.85em;">⚠️ Pozor: ${nevyh} zápas(ů) po uzávěrce ještě NENÍ vyhodnoceno. Fakt vyhlásit?</div>` : ''}
            <button class="btn btn-gold" style="width:100%; margin-top:12px;" onclick="potvrdKrale()">✅ Potvrdit a poslat push</button>
        </div>`;
    msg.innerHTML = '';
}

async function potvrdKrale() {
    if (!_kralNavrh) return;
    const msg = document.getElementById('kralMsg');
    msg.innerHTML = '<span style="opacity:.6;">Ukládám…</span>';
    const { error } = await sb.from('cl_kola').insert({ kral: _kralNavrh.kral, snapshot: _kralNavrh.snapshot });
    if (error) { msg.innerHTML = '<span style="color:#ff5555;">Chyba: ' + error.message + '</span>'; return; }
    const jmena = _kralNavrh.kral.map(k => k.jmeno).join(', ');
    const body = _kralNavrh.kral[0] ? _kralNavrh.kral[0].body : 0;
    await posliCLNotifikaci(`👑 Král ${_kralNavrh.cisloKola}. kola`, `${jmena} — nejvíc bodů tohoto kola (+${body} b.). Gratulace!`);
    _kralNavrh = null;
    document.getElementById('kralVysledek').innerHTML = '';
    msg.innerHTML = '<span style="color:#2ecc71;">✅ Vyhlášeno a push odeslán.</span>';
    nactiKrale();
}
