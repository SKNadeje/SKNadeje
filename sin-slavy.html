<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK Naděje – Síň slávy</title>
<link rel="icon" href="logo-wc2026.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: radial-gradient(ellipse at top, #0d1022 0%, #05070f 70%);
    font-family: Inter, sans-serif;
    color: #f0e6c8;
    min-height: 100vh;
    padding: 44px 16px 32px;
}
.wrap { max-width: 700px; margin: 0 auto; }

/* ===== HLAVIČKA ===== */
.back {
    display: inline-flex; align-items: center; gap: 6px;
    color: #8a93ad; text-decoration: none; font-size: .72rem;
    margin-bottom: 22px; transition: color .2s;
}
.back:hover { color: #d4af37; }
.presents { text-align: center; font-size: 10px; letter-spacing: 4px; color: rgba(212,175,55,.55); text-transform: uppercase; font-weight: 700; }
h1 {
    text-align: center; font-size: 2rem; font-weight: 900; letter-spacing: 5px;
    margin: 8px 0 4px; text-transform: uppercase;
    background: linear-gradient(135deg, #f0e6c8, #d4af37 40%, #f0e6c8 70%, #b8901e);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: #d4af37;
}
.sub { text-align: center; font-size: .76rem; color: #5a6480; margin-bottom: 14px; }
.line { width: 100px; height: 1px; background: linear-gradient(90deg, transparent, #d4af37, transparent); margin: 0 auto 34px; }

/* ===== KARTA TURNAJE ===== */
.turnaj {
    background: rgba(15,20,35,.75);
    border: 1px solid rgba(212,175,55,.25);
    border-radius: 18px;
    padding: 24px 22px 20px;
    margin-bottom: 18px;
    animation: fadeUp .5s ease both;
}
.turnaj:nth-child(2) { animation-delay: .1s; }
.turnaj:nth-child(3) { animation-delay: .2s; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .turnaj { animation: none; } }

.thead { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
.tlogo {
    width: 74px; height: 74px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 2rem;
    background: linear-gradient(160deg, rgba(240,230,200,.14), rgba(212,175,55,.06));
    border: 1px solid rgba(212,175,55,.3); padding: 7px;
}
.tlogo img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
.tname { font-size: 1.15rem; font-weight: 800; color: #f0e6c8; }
.tmeta { font-size: .7rem; color: #8a93ad; margin-top: 4px; line-height: 1.5; }
.rok {
    margin-left: auto; align-self: flex-start;
    font-size: .62rem; font-weight: 800; letter-spacing: 1.5px;
    background: rgba(212,175,55,.13); color: #d4af37;
    border: 1px solid rgba(212,175,55,.35);
    padding: 4px 12px; border-radius: 999px;
}

/* ===== PÓDIUM ===== */
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin: 6px 0 20px; }
.pcol { display: flex; flex-direction: column; align-items: center; flex: 1; max-width: 160px; }
.pname { font-size: .78rem; font-weight: 800; text-align: center; word-break: break-word; margin-bottom: 3px; }
.ppts { font-size: .62rem; color: #8a93ad; margin-bottom: 8px; }
.pblok {
    width: 100%; border-radius: 10px 10px 0 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 900; gap: 2px; padding: 8px 4px;
}
.pblok .medaile { font-size: 1.3rem; }
.pblok .cislo { font-size: 1rem; }
.p1 .pblok { height: 88px; background: linear-gradient(180deg, rgba(212,175,55,.28), rgba(212,175,55,.08)); border: 1px solid rgba(212,175,55,.45); border-bottom: none; color: #d4af37; }
.p1 .pname { color: #d4af37; font-size: .88rem; }
.p2 .pblok { height: 62px; background: rgba(148,163,184,.12); border: 1px solid rgba(148,163,184,.3); border-bottom: none; color: #cbd5e1; }
.p2 .pname { color: #cbd5e1; }
.p3 .pblok { height: 44px; background: rgba(180,100,40,.12); border: 1px solid rgba(180,100,40,.35); border-bottom: none; color: #d97b3a; }
.p3 .pname { color: #d97b3a; }
.podstavec { height: 1px; background: linear-gradient(90deg, transparent, rgba(212,175,55,.4), transparent); margin-bottom: 18px; }

/* ===== STATISTIKY ===== */
.stats { display: flex; justify-content: center; gap: 26px; flex-wrap: wrap; margin-bottom: 20px; }
.stat { text-align: center; }
.stat .v { font-size: 1.05rem; font-weight: 900; color: #f0e6c8; }
.stat .l { font-size: .58rem; letter-spacing: 1.5px; color: #5a6480; text-transform: uppercase; margin-top: 2px; }

/* ===== AKCE ===== */
.akce { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
    flex: 1; min-width: 140px;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 11px 16px; border-radius: 10px;
    font-size: .72rem; font-weight: 800; letter-spacing: .5px;
    text-decoration: none; transition: all .2s; text-transform: uppercase;
}
.btn-gold {
    background: linear-gradient(135deg, #d4af37, #9a7b1e); color: #05070f;
    box-shadow: 0 4px 14px rgba(212,175,55,.25);
}
.btn-gold:hover { box-shadow: 0 6px 20px rgba(212,175,55,.4); transform: translateY(-1px); }
.btn-ghost {
    background: transparent; color: #d4af37;
    border: 1px solid rgba(212,175,55,.35);
}
.btn-ghost:hover { background: rgba(212,175,55,.08); border-color: rgba(212,175,55,.6); }

/* ===== PRÁZDNÝ STAV ===== */
.empty {
    text-align: center; padding: 50px 20px;
    border: 1px dashed rgba(212,175,55,.25); border-radius: 18px;
    color: #5a6480; font-size: .8rem; line-height: 1.7;
}
.empty .big { font-size: 2.2rem; margin-bottom: 10px; opacity: .6; }

.foot {
    margin-top: 30px; padding-top: 18px;
    border-top: 1px solid rgba(212,175,55,.12);
    text-align: center;
    font-size: .62rem; color: rgba(212,175,55,.35);
    letter-spacing: 2px; text-transform: uppercase;
}

@media (max-width: 560px) {
    body { padding-top: 30px; }
    h1 { font-size: 1.5rem; letter-spacing: 4px; }
    .thead { flex-wrap: wrap; }
    .stats { gap: 18px; }
    .btn { min-width: 100%; }
}
</style>
</head>
<body>
<div class="wrap">
    <a class="back" href="hub.html">← Zpět na výběr turnajů</a>

    <div class="presents">SK Naděje presents</div>
    <h1>📜 Síň slávy</h1>
    <div class="sub">Dohrané turnaje, šampioni a kroniky</div>
    <div class="line"></div>

    <div id="obsah"></div>

    <div class="foot">SK Naděje · tipovačky od 2026</div>
</div>

<script>
/* ============================================================
   ARCHIV TURNAJŮ – po dohrání turnaje sem přidej záznam.
   podium: [1., 2., 3. místo] – jméno + body (+ výhra v Kč)
   Pole nech prázdné [], dokud turnaj běží – ukáže se
   "zatím žádný dohraný turnaj".
   ============================================================ */
const ARCHIV = [
    /* Odkomentuj a doplň po skončení MS 2026:
    {
        nazev: 'MS ve fotbale 2026',
        meta: 'USA · Mexiko · Kanada · 11. 6. – 19. 7. 2026',
        rok: '2026',
        logo: 'logo-wc2026.png',
        emoji: '🏆',
        podium: [
            { jmeno: 'Trnda',   body: 187, vyhra: 3000 },
            { jmeno: 'Kominek', body: 175, vyhra: 1500 },
            { jmeno: 'Grof',    body: 168, vyhra: 500 }
        ],
        stats: [
            { v: '25', l: 'hráčů' },
            { v: '5 000 Kč', l: 'bank' },
            { v: '104', l: 'zápasů' },
            { v: '223', l: 'gólů' }
        ],
        aplikace: 'wc2026.html',
        kronika: 'kronika-wc2026.pdf'
    },
    */
];

function podiumHtml(p) {
    if (!p || p.length === 0) return '';
    const col = (idx, cls, medaile, cislo) => {
        const h = p[idx];
        if (!h) return `<div class="pcol ${cls}"></div>`;
        return `<div class="pcol ${cls}">
            <div class="pname">${h.jmeno}</div>
            <div class="ppts">${h.body} b.${h.vyhra ? ' · ' + h.vyhra.toLocaleString('cs-CZ') + ' Kč' : ''}</div>
            <div class="pblok"><span class="medaile">${medaile}</span><span class="cislo">${cislo}</span></div>
        </div>`;
    };
    // pořadí sloupců: 2. – 1. – 3. (klasické pódium)
    return `<div class="podium">
        ${col(1, 'p2', '🥈', '2')}
        ${col(0, 'p1', '🏆', '1')}
        ${col(2, 'p3', '🥉', '3')}
    </div>
    <div class="podstavec"></div>`;
}

function statsHtml(stats) {
    if (!stats || stats.length === 0) return '';
    return `<div class="stats">${stats.map(s =>
        `<div class="stat"><div class="v">${s.v}</div><div class="l">${s.l}</div></div>`
    ).join('')}</div>`;
}

function turnajHtml(t) {
    const logo = t.logo
        ? `<div class="tlogo"><img src="${t.logo}" alt="" onerror="this.parentNode.textContent='${t.emoji || '🏆'}'"></div>`
        : `<div class="tlogo">${t.emoji || '🏆'}</div>`;
    const btny = [];
    if (t.aplikace) btny.push(`<a class="btn btn-gold" href="${t.aplikace}">⚽ Otevřít archiv</a>`);
    if (t.kronika)  btny.push(`<a class="btn btn-ghost" href="${t.kronika}" download>📖 Stáhnout kroniku</a>`);
    return `<div class="turnaj">
        <div class="thead">
            ${logo}
            <div>
                <div class="tname">${t.nazev}</div>
                <div class="tmeta">${t.meta || ''}</div>
            </div>
            <span class="rok">${t.rok || ''}</span>
        </div>
        ${podiumHtml(t.podium)}
        ${statsHtml(t.stats)}
        ${btny.length ? `<div class="akce">${btny.join('')}</div>` : ''}
    </div>`;
}

const obsah = document.getElementById('obsah');
obsah.innerHTML = ARCHIV.length
    ? ARCHIV.map(turnajHtml).join('')
    : `<div class="empty">
        <div class="big">🏟️</div>
        Síň slávy zatím čeká na prvního šampiona.<br>
        Historie se píše právě teď – na MS ve fotbale 2026.
    </div>`;
</script>
</body>
</html>
