/* Právě probíhající turnaje (odkaz na jejich appky) */
const PRAVE = [

/* ===== ŠAMPION (úřadující) ===== */
function renderSampion() {
    const el = document.getElementById('sampion');
    if (!ARCHIV.length) { el.style.display = 'none'; return; }
    const t = ARCHIV[0];
    const w = seradSRankem(t.zebricek)[0];
    if (!w) { el.style.display = 'none'; return; }
    let tituly = 0;
    ARCHIV.forEach(tt => { const top = seradSRankem(tt.zebricek)[0]; if (top && top.jmeno === w.jmeno) tituly++; });
    el.innerHTML = `
        <div class="sh-eyebrow">Úřadující šampion</div>
        <div class="sh-trophy">🏆</div>
        <div class="sh-name">${w.jmeno}</div>
        <div class="sh-turnaj">${t.nazev}</div>
        <div class="sh-meta">
            <div class="m"><b>${w.body}</b><span>bodů</span></div>
            <div class="m"><b>1.</b><span>místo</span></div>
            <div class="m"><b>${tituly}×</b><span>${tituly === 1 ? 'titul' : 'tituly'}</span></div>
        </div>`;
}

/* ===== SÍŇ REKORDŮ ===== */
function spocitejRekordy() {
    let nejBody = { v: 0 }, nejNaskok = { v: -1 }, nejUcast = { v: 0 }, nejTituly = { v: 0 };
    const tituly = {};
    ARCHIV.forEach(t => {
        const raz = seradSRankem(t.zebricek);
        raz.forEach(r => { if (r.body > nejBody.v) nejBody = { v: r.body, kdo: r.jmeno }; });
        if (raz[0]) tituly[raz[0].jmeno] = (tituly[raz[0].jmeno] || 0) + 1;
        if (raz.length >= 2) { const n = raz[0].body - raz[1].body; if (n > nejNaskok.v) nejNaskok = { v: n, kdo: raz[0].jmeno }; }
        if (raz.length > nejUcast.v) nejUcast = { v: raz.length, kde: t.nazev };
    });
    Object.keys(tituly).forEach(k => { if (tituly[k] > nejTituly.v) nejTituly = { v: tituly[k], kdo: k }; });
    return { nejBody, nejNaskok, nejUcast, nejTituly };
}
function rekordyHtml() {
    const r = spocitejRekordy();
    const item = (ic, val, lbl, sub) => `<div class="rek"><div class="rek-ic">${ic}</div><div class="rek-val">${val}</div><div class="rek-lbl">${lbl}</div><div class="rek-sub">${sub || '&nbsp;'}</div></div>`;
    return `<div class="sekce-nadpis">📊 Síň rekordů</div><div class="rekordy">
        ${item('🎯', r.nejBody.v + ' b.', 'Nejvíc bodů v turnaji', r.nejBody.kdo || '')}
        ${item('👑', r.nejTituly.v + '×', 'Nejvíc titulů', r.nejTituly.kdo || '')}
        ${item('⚡', (r.nejNaskok.v >= 0 ? r.nejNaskok.v : '–') + ' b.', 'Největší náskok vítěze', r.nejNaskok.kdo || '')}
        ${item('👥', r.nejUcast.v, 'Největší účast (hráčů)', r.nejUcast.kde || '')}
    </div>`;
}

/* ===== JEDNA LEGENDA ===== */
function legendaHtml(h, i) {
    const cab = [];
    if (h.zlato) cab.push(`<span class="cab zlato">🥇 ${h.zlato}</span>`);
    if (h.stribro) cab.push(`<span class="cab stribro">🥈 ${h.stribro}</span>`);
    if (h.bronz) cab.push(`<span class="cab bronz">🥉 ${h.bronz}</span>`);
    if (!cab.length) cab.push(`<span class="cab">bez medaile</span>`);
    return `<div class="legenda ${i === 0 ? 'top' : ''}">
        <div class="lg-rank">${i + 1}</div>
        <div class="lg-main">
            <div class="lg-name">${h.jmeno}${i === 0 ? ' <span class="goat">GOAT</span>' : ''}</div>
            <div class="lg-cab">${cab.join('')}</div>
        </div>
        <div class="lg-stats"><div><b>${h.turnaje}</b><span>turnajů</span></div><div><b>${h.body}</b><span>bodů</span></div></div>
    </div>`;
}

<body>
<div class="wrap">
    <a class="back" href="hub.html">← Zpět na výběr turnajů</a>

    <div class="presents">SK Naděje presents</div>
    <h1>📜 Síň slávy</h1>
    <div class="sub">Dohrané turnaje, šampioni a kroniky</div>

    <div class="sampion" id="sampion"></div>

    <div class="taby">
        <button class="tab on" id="tab-sumar" onclick="prepniTab('sumar')">🏆 Legendy</button>
        <button class="tab" id="tab-archiv" onclick="prepniTab('archiv')">🗄️ Archiv turnajů</button>
    </div>

    <div class="panel" id="panel-archiv"></div>

    <div class="foot">SK Naděje · tipovačky od 2026</div>

<script>
/* ============================================================
   ARCHIV TURNAJŮ – po dohrání turnaje sem přidej záznam.
   zebricek: KOMPLETNÍ finální pořadí [{jmeno, body}], seřazené
   sestupně podle bodů. Pódium (top 3) a Sumář se odvodí automaticky.
   ============================================================ */
const ARCHIV = [
    {
        nazev: 'MS ve fotbale 2026',
        meta: 'USA · Mexiko · Kanada · 11. 6. – 19. 7. 2026',
        rok: '2026',
        logo: 'logo-wc2026.png',
        emoji: '🏆',
        stats: [
            { v: '25', l: 'hráčů' },
            { v: '5 000 Kč', l: 'bank' },
            { v: '104', l: 'zápasů' },
            { v: '308', l: 'gólů' },
            { v: 'Španělsko', l: 'mistr světa' },
            { v: 'Mbappé · 10×', l: 'nejlepší střelec' },
            { v: 'Unai Simón', l: 'nejlepší brankář' }
        ],
        aplikace: 'wc2026.html',
        kronika: 'Kronika_WC2026.pdf',
        zebricek: [
            { jmeno: 'Jan Rathouský', body: 250 },
            { jmeno: 'Peca', body: 225 },
            { jmeno: 'Deny', body: 221 },
            { jmeno: 'Grof', body: 220 },
            { jmeno: 'Tácek', body: 211 },
            { jmeno: 'Trnda', body: 202 },
            { jmeno: 'DtzDK', body: 198 },
            { jmeno: 'King of football', body: 198 },
            { jmeno: 'Adam H.', body: 196 },
            { jmeno: 'Stehla', body: 194 },
            { jmeno: 'Vojtěch', body: 193 },
            { jmeno: 'Kachla', body: 190 },
            { jmeno: 'Tomáš Brauner', body: 190 },
            { jmeno: 'Lázik', body: 188 },
            { jmeno: 'Kominek', body: 182 },
            { jmeno: 'Bimboš', body: 182 },
            { jmeno: 'Lukas', body: 180 },
            { jmeno: 'FC Kopyta', body: 179 },
            { jmeno: 'Jaromir', body: 177 },
            { jmeno: 'Serba', body: 177 },
            { jmeno: 'Radovan', body: 165 },
            { jmeno: 'Mocl', body: 165 },
            { jmeno: 'churs', body: 147 },
            { jmeno: 'Wondris', body: 136 },
            { jmeno: 'r1c1', body: 124 }
        ]
    }
];

/* Sdílené pořadí (stejné číslo pro remízu, stejně jako appka) */
function seradSRankem(list) {
    const s = [...list].sort((a, b) => b.body - a.body);
    let i = 0;
    while (i < s.length) {
        let j = i;
        while (j + 1 < s.length && s[j + 1].body === s[i].body) j++;
        for (let k = i; k <= j; k++) { s[k]._rank = `${i + 1}.`; s[k]._rankNum = i + 1; }
        i = j + 1;
    }
    return s;
}

function prepniTab(kam) {
    document.getElementById('tab-sumar').classList.toggle('on', kam === 'sumar');
    document.getElementById('tab-archiv').classList.toggle('on', kam === 'archiv');
    document.getElementById('panel-sumar').classList.toggle('on', kam === 'sumar');
    document.getElementById('panel-archiv').classList.toggle('on', kam === 'archiv');
}

/* ===== SUMÁŘ ===== */
function renderSumar() {
    const el = document.getElementById('panel-sumar');
    if (!ARCHIV.length) {
        el.innerHTML = `<div class="empty"><div class="big">🏟️</div>Síň slávy zatím čeká na prvního šampiona.</div>`;
        return;
    }
    // Kariérní agregace napříč všemi turnaji
    const H = {};
    ARCHIV.forEach(t => {
        seradSRankem(t.zebricek).forEach(r => {
            const h = H[r.jmeno] = H[r.jmeno] || { jmeno: r.jmeno, zlato: 0, stribro: 0, bronz: 0, turnaje: 0, body: 0, best: 99 };
            if (r._rankNum === 1) h.zlato++; else if (r._rankNum === 2) h.stribro++; else if (r._rankNum === 3) h.bronz++;
            h.turnaje++; h.body += r.body; h.best = Math.min(h.best, r._rankNum);
        });
    });
    const legendy = Object.values(H).sort((a, b) =>
        b.zlato - a.zlato || b.stribro - a.stribro || b.bronz - a.bronz || a.best - b.best || b.body - a.body);
    el.innerHTML = rekordyHtml()
        + `<div class="sekce-nadpis">🏅 Žebříček legend</div>`
        + legendy.map((h, i) => legendaHtml(h, i)).join('');
}

/* ===== ARCHIV ===== */
function statsHtml(stats) {
    if (!stats || !stats.length) return '';
    return `<div class="stats">${stats.map(s => `<div class="stat"><div class="v">${s.v}</div><div class="l">${s.l}</div></div>`).join('')}</div>`;
}

function podiumHtml(top3) {
    const col = (r, cls, medaile, cislo) => {
        if (!r) return `<div class="pcol ${cls}"></div>`;
        return `<div class="pcol ${cls}">
            <div class="pname">${r.jmeno}</div>
            <div class="ppts">${r.body} b.</div>
            <div class="pblok"><span class="medaile">${medaile}</span><span>${cislo}</span></div>
        </div>`;
    };
    return `<div class="podium">${col(top3[1], 'p2', '🥈', '2')}${col(top3[0], 'p1', '🏆', '1')}${col(top3[2], 'p3', '🥉', '3')}</div>`;
}

function turnajHtml(t) {
    const razeni = seradSRankem(t.zebricek);
    const top3 = razeni.slice(0, 3);
    const zbytek = razeni.slice(3);
    const logo = t.logo
        ? `<div class="tlogo"><img src="${t.logo}" alt="" onerror="this.parentNode.textContent='${t.emoji || '🏆'}'"></div>`
        : `<div class="tlogo">${t.emoji || '🏆'}</div>`;
    const btny = [];
    if (t.aplikace) btny.push(`<a class="btn btn-gold" href="${t.aplikace}">⚽ Otevřít archiv appky</a>`);
    if (t.kronika) btny.push(`<a class="btn btn-ghost" href="${t.kronika}" download>📖 Stáhnout kroniku</a>`);

    return `<div class="turnaj">
        <div class="thead">${logo}<div><div class="tname">${t.nazev}</div><div class="tmeta">${t.meta || ''}</div></div><span class="rok">${t.rok || ''}</span></div>
        ${podiumHtml(top3)}
        <div class="rozdelovac"><div class="cara"></div><div class="lbl">Kompletní žebříček</div><div class="cara"></div></div>
        ${zbytek.map(r => `<div class="zb-row"><span class="poradi">${r._rank}</span><span class="jm">${r.jmeno}</span><span class="b">${r.body} b.</span></div>`).join('')}
        ${statsHtml(t.stats)}
        ${btny.length ? `<div class="akce">${btny.join('')}</div>` : ''}
    </div>`;
}

function praveHtml() {
    if (!PRAVE.length) return '';
    return `<div class="sekce-nadpis">🔥 Právě se hraje o slávu</div><div class="prave">${PRAVE.map(p => `
        <a class="prave-card" href="${p.app}">
            <div class="pc-emoji">${p.emoji}</div>
            <div class="pc-name">${p.nazev}</div>
            <div class="pc-sezona">${p.sezona}</div>
            <div class="pc-stav">${p.stav}</div>
        </a>`).join('')}</div>`;
}
function renderArchiv() {
    const el = document.getElementById('panel-archiv');
    const archiv = ARCHIV.length
        ? `<div class="sekce-nadpis">📜 Dohrané turnaje</div>` + ARCHIV.map(turnajHtml).join('')
        : `<div class="empty"><div class="big">🏟️</div>Zatím žádný dohraný turnaj.</div>`;
    el.innerHTML = praveHtml() + archiv;
}

renderSampion();
renderSumar();
renderArchiv();
</script>
</body>
</html>
